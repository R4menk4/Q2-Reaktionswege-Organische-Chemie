function resetProgress(scope){const modules=scope==='vorwissen'?progressModules.filter(module=>module.block==='vorwissen'):progressModules.filter(module=>module.id===scope);const ids=new Set(modules.flatMap(module=>module.questionIds));for(const name of ['answers','done','hints','build','checks'])for(const id of ids)delete state[name][id];for(const key of Object.keys(state.orders))if(ids.has(key.split(':')[0]))delete state.orders[key];for(const module of modules)state.positions[module.id]={s:0,q:0};if(scope!=='vorwissen'){state.activeModule=scope;applyModule(scope);}state.s=0;state.q=0;state.page=scope==='vorwissen'?'prior':'module';resetNotice=scope==='vorwissen'?'Der Lernfortschritt im gesamten Block Vorwissen wurde zurückgesetzt.':'Der Lernfortschritt im Modul '+moduleDefinitions[scope].title+' wurde zurückgesetzt.';save();render();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.practiceQuestion){openPracticeQuestion(b.dataset.practiceQuestion);return;}if(b.dataset.book){state.book=b.dataset.book;state.page='book';resetNotice='';render();save();window.scrollTo(0,0);return;}if(handleVariedClick(b))return;if(b.dataset.experimentView){experimentView=b.dataset.experimentView;render();return;}if(b.dataset.equilibrium){const action=b.dataset.equilibrium;if(action==='step'||action==='twenty')equilibriumStep(action==='step'?1:20);if(action==='a'||action==='b')equilibriumState[action]+=20;if(action==='catalyst')equilibriumState.catalyst=!equilibriumState.catalyst;if(action==='reset')equilibriumState={a:100,b:0,step:0,catalyst:false};render();return;}if(b.dataset.acidView){acidView=b.dataset.acidView;render();return;}if(b.dataset.redoxView){redoxView=b.dataset.redoxView;render();return;}if(b.dataset.interactionView){interactionView=b.dataset.interactionView;render();return;}if(b.dataset.particleView){particleView=b.dataset.particleView;render();return;}if(b.dataset.polarModel){polarityModel=b.dataset.polarModel;render();return;}if(b.hasAttribute('data-polar-arrows')){polarityArrows=!polarityArrows;render();return;}if(b.dataset.reset){resetDialog(b.dataset.reset);return;}if(b.hasAttribute('data-reset-cancel')){b.closest('dialog').close();return;}if(b.dataset.resetConfirm){resetProgress(b.dataset.resetConfirm);return;}resetNotice='';if(b.dataset.module){switchModule(b.dataset.module);render();save();window.scrollTo(0,0);return;}if(b.dataset.page){state.page=b.dataset.page;render();save();window.scrollTo(0,0);return;}if(b.dataset.section!==undefined){state.s=Number(b.dataset.section);state.q=0;state.page='module';render();save();return;}if(state.page!=='module')return;const q=current();if(b.dataset.answer!==undefined){state.answers[q.id]=Number(b.dataset.answer);delete state.checks[q.id];delete state.done[q.id];render();save();return;}if(b.dataset.change!==undefined){const v=[...buildValues(q)];const i=Number(b.dataset.change);v[i]=Math.max(0,Math.min(hLimit(q,i),v[i]+Number(b.dataset.delta)));state.build[q.id]=v;delete state.checks[q.id];delete state.done[q.id];render();save();return;}if(b.dataset.action==='show-balance'){state.build[q.id]={showBalance:true};render();save();return;}if(b.dataset.action==='hint'){state.hints[q.id]=Math.min(2,(state.hints[q.id]||0)+1);}if(b.dataset.action==='check'){if(['multi','order','classify','gaps'].includes(q.type)?!variedComplete(q):(q.type==='charges'||q.type==='match'||q.type==='balance')?(!Array.isArray(state.answers[q.id])||state.answers[q.id].length!==q.answer.length||state.answers[q.id].some(value=>value===''||value===undefined||value===null)):q.type!=='builder'&&(state.answers[q.id]===undefined||String(state.answers[q.id]).trim()==='')){state.checks[q.id]='empty';delete state.done[q.id];}else{const ok=isCorrect(q);state.checks[q.id]=ok?'ok':'wrong';state.done[q.id]=ok;}}if(b.dataset.action==='next'){if(state.q<sections[state.s].q.length-1)state.q++;else if(state.s<sections.length-1){state.s++;state.q=0;}else state.page='result';}if(b.dataset.action==='back'){if(state.q>0)state.q--;else if(state.s>0){state.s--;state.q=sections[state.s].q.length-1;}}render();save();});
root.addEventListener('input',e=>{if(e.target.dataset.gap!==undefined){const q=current(),v=[...(state.answers[q.id]||q.answer.map(()=>''))];v[Number(e.target.dataset.gap)]=e.target.value;state.answers[q.id]=v;delete state.checks[q.id];delete state.done[q.id];root.querySelector('.feedback')?.remove();save();return;}if(e.target.dataset.coefficient!==undefined){const q=current(),values=[...(state.answers[q.id]||q.answer.map(()=>''))];values[Number(e.target.dataset.coefficient)]=e.target.value===''?'':Number(e.target.value);state.answers[q.id]=values;delete state.checks[q.id];delete state.done[q.id];const box=root.querySelector('.feedback');if(box)box.remove();const table=root.querySelector('#coefficient-balance');if(table&&state.build[q.id]?.showBalance)table.innerHTML=balanceTable(q);save();return;}if(e.target.id==='chem-answer'||e.target.id==='chem-name-answer'){state.answers[current().id]=e.target.value;delete state.checks[current().id];delete state.done[current().id];const box=root.querySelector('.feedback');if(box)box.remove();save();}});
root.addEventListener('change',e=>{if(e.target.dataset.selfcheck){state.selfChecks[e.target.dataset.selfcheck]=e.target.checked;const skills=Object.values(selfCheckSkills).flat();root.querySelector('#selfcheck-count').textContent=skills.filter(([,id])=>state.selfChecks[id]).length+' von '+skills.length;save();return;}if(e.target.dataset.match!==undefined){const q=current(),values=[...(state.answers[q.id]||q.matchLabels.map(()=>''))];values[Number(e.target.dataset.match)]=e.target.value===''?'':Number(e.target.value);state.answers[q.id]=values;delete state.checks[q.id];delete state.done[q.id];render();save();return;}if(e.target.dataset.charge!==undefined){const q=current(),values=[...(state.answers[q.id]||q.chargeLabels.map(()=>''))];values[Number(e.target.dataset.charge)]=e.target.value;state.answers[q.id]=values;delete state.checks[q.id];delete state.done[q.id];render();save();return;}if(e.target.dataset.bond){const id=e.target.dataset.bond;const v=[...buildValues(current())];v[Number(e.target.dataset.index)]=Number(e.target.value);state.build[id]=v;delete state.checks[id];delete state.done[id];render();save();}});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v&&!interacted){restore(v);render();}});
render();
})();
</script>
