iten?", "formula": "", "choices": ["Die Moleküle werden selbst größer", "Die mittleren Abstände zwischen den Molekülen sind größer", "Die Moleküle wurden in Atome zerlegt"], "answer": 1, "ok": "Die größeren Abstände veranschaulichen die geringere Teilchendichte im Gas. Die Molekülsymbole behalten ihre Größe.", "bad": "Abstand zwischen Teilchen ist nicht Teilchengröße.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Vergleiche die freien Räume zwischen den Symbolen."], "particleFigure": "gas"}, {"id": "st14", "text": "Was bedeutet eine rote Kugel für ein O-Atom in einem Molekülmodell?", "formula": "", "choices": ["Ein einzelnes O-Atom wäre in Wirklichkeit als rote Kugel sichtbar", "Die Farbe dient als vereinbartes Kennzeichen im Modell", "Die Kugel ist ein roter Tropfen Sauerstoff"], "answer": 1, "ok": "Modellfarben dienen zur Unterscheidung von Atomarten. Sie sind keine wörtliche Beobachtung am einzelnen Atom.", "bad": "Die Darstellung ist vereinfacht und verwendet eine Farblegende.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Modelle verwenden vereinbarte Symbole."]}, {"id": "st15", "text": "Was kann ein schematisches Teilchenbild mit wenigen Symbolen nicht ohne Weiteres liefern?", "formula": "", "choices": ["Eine Vorstellung von der Anordnung", "Eine Unterscheidung der Teilchenarten nach Legende", "Die genaue reale Zahl der Moleküle in einem ganzen Becherglas"], "answer": 2, "ok": "Die kleine Zahl gezeichneter Teilchen ist meist eine didaktische Vereinfachung, keine genaue Zählung der realen Probe.", "bad": "Ein Modell kann bestimmte Merkmale erklären, ohne alle Größen maßstäblich abzubilden.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Prüfe, ob ein quantitativer Maßstab angegeben ist."]}], "explainer": "<div class=\"module-goal\"><strong>Modellgrenzen</strong>Die folgenden Bilder zeigen ausgewählte Teilchen schematisch. Teilchenzahl, Größen und Abstände sind nicht maßstäblich. Die Zeichen E stehen für ganze Moleküle, deren innerer Aufbau hier nicht dargestellt ist.</div>", "particleExplorer": true}, {"title": "Zustandsänderungen auf beiden Ebenen", "intro": "Beim Verdampfen und Kondensieren bleiben die Moleküle erhalten. Anordnung, Abstände und Bewegungen ändern sich. Bindungen innerhalb der Moleküle sind von Wechselwirkungen zwischen Molekülen zu unterscheiden.", "q": [{"id": "st16", "text": "Verbinde Stoff- und Teilchenbeschreibung.", "formula": "", "choices": [], "answer": [0, 1, 2], "ok": "Verdampfen und Kondensieren ändern die Anordnung; beim Erwärmen steigt die mittlere kinetische Energie.", "bad": "Die Moleküle bleiben in diesen Vorgängen Ethanolmoleküle.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Achte auf die Richtung des Phasenübergangs."], "type": "match", "matchLabels": ["Eine Ethanolprobe verdampft.", "Die Ethanolprobe kondensiert.", "Ethanol wird ohne Stoffumwandlung erwärmt."], "matchChoices": ["Moleküle gehen in die Gasphase über; ihre mittleren Abstände werden größer.", "Moleküle gehen in die Flüssigkeit über; ihre mittleren Abstände werden kleiner.", "Die mittlere kinetische Energie der Teilchen nimmt zu."]}, {"id": "st17", "text": "Was muss zum Verdampfen von Ethanol hauptsächlich überwunden werden?", "formula": "", "choices": ["Anziehung zwischen den Molekülen", "Alle C–C- und C–O-Bindungen im Molekül", "Die Bindung der Elektronen an die Atomkerne vollständig"], "answer": 0, "ok": "Zum Verdampfen muss Energie gegen die Anziehung zwischen den Molekülen aufgebracht werden. Der Molekülaufbau bleibt erhalten.", "bad": "Wechselwirkungen zwischen Molekülen sind nicht dasselbe wie Bindungen innerhalb eines Moleküls.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Vergleiche zwischenmolekular und innerhalb des Moleküls."]}, {"id": "st18", "text": "Ethanol verdampft in einem geschlossenen Gefäß. Welche Aussage zur Gesamtmasse ist richtig?", "formula": "", "choices": ["Die Gesamtmasse nimmt ab, weil Gas keine Masse hat", "Die Gesamtmasse bleibt erhalten", "Die Gesamtmasse nimmt durch größere Teilchenabstände zu"], "answer": 1, "ok": "Im geschlossenen Gefäß bleiben alle Teilchen enthalten; die Gesamtmasse ändert sich durch den Phasenübergang nicht.", "bad": "Gas besitzt Masse. Größere Abstände erzeugen keine zusätzlichen Teilchen.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Betrachte Flüssigkeit und Gas gemeinsam."]}, {"id": "st19", "text": "Welche Aussage beschreibt Kondensation richtig?", "formula": "", "choices": ["Gasförmige Ethanolmoleküle werden neu zu Ethanol zusammengesetzt", "Ethanolmoleküle gelangen aus der Gasphase in die Flüssigkeit", "Aus jedem Molekül entsteht ein neues Atom"], "answer": 1, "ok": "Die gleichen Moleküle gehen in die Flüssigkeit über. Es entsteht dadurch kein neuer Stoff.", "bad": "Die Moleküle existieren bereits vor der Kondensation.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Die Veränderung betrifft den Stoffzustand."]}], "explainer": "<div class=\"module-goal\"><strong>Eine wichtige Trennung</strong><strong>Zwischen Molekülen:</strong> Wechselwirkungen beeinflussen z. B. den Phasenübergang. <strong>Innerhalb eines Moleküls:</strong> Bindungen bestimmen seine chemische Struktur.</div>", "particleExplorer": false}, {"title": "Chemische Reaktionen erklären", "intro": "Bei einer chemischen Reaktion entstehen andere Stoffe. Im Teilchenmodell werden Atome neu verknüpft. Atomsorten und Gesamtzahl der Atome bleiben bei einer gewöhnlichen chemischen Reaktion im geschlossenen System erhalten.", "q": [{"id": "st20", "text": "Was kennzeichnet eine chemische Reaktion im Molekülmodell?", "formula": "", "choices": ["Nur die Abstände zwischen unveränderten Molekülen werden größer", "Atome werden neu verknüpft und es entstehen andere Teilchen", "Die Atomkerne werden in andere Elemente umgewandelt"], "answer": 1, "ok": "Bei den hier betrachteten Reaktionen werden Bindungen umgebaut. Die Atomarten bleiben erhalten.", "bad": "Das Umwandeln von Atomkernen ist keine gewöhnliche chemische Reaktion.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Vergleiche Molekülaufbau vor und nach dem Vorgang."]}, {"id": "st21", "text": "Was bleibt bei der dargestellten Reaktion erhalten?", "formula": "2 H₂ + O₂ → 2 H₂O", "choices": ["Die Zahl der Moleküle muss gleich bleiben", "Die Zahl der H- und O-Atome bleibt jeweils gleich", "Alle Bindungen bleiben gleich"], "answer": 1, "ok": "Vorher und nachher sind vier H- und zwei O-Atome vorhanden. Aus drei Molekülen entstehen hier zwei.", "bad": "Atomanzahl und Molekülanzahl sind nicht dasselbe.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Zähle die Atome für jedes Element getrennt."], "particleFigure": "reaction"}, {"id": "st22", "text": "Ordne die Aussagen zu den Ebenen.", "formula": "", "choices": [], "answer": [0, 1, 2], "ok": "Neue Stoffe: Stoffebene. Neue Verknüpfungen: Teilchenebene. Reaktionsgleichung: Symbolebene.", "bad": "Die Gleichung stellt das Geschehen symbolisch dar; die Atomanordnung erklärt es.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Trenne Stoffbeschreibung, Teilchenmodell und Gleichung."], "type": "match", "matchLabels": ["Es entstehen nachgewiesene neue Stoffe.", "Atome werden zu anderen Molekülen verknüpft.", "2 H₂ + O₂ → 2 H₂O"], "matchChoices": ["Stoffebene", "Teilchenebene", "Symbolebene"]}, {"id": "st23", "text": "Warum sinkt beim Verbrennen eines Stoffes in einem offenen Gefäß manchmal die zurückbleibende Masse?", "formula": "", "choices": ["Ein Teil der Atome wird vernichtet", "Gasförmige Produkte können das betrachtete Gefäß verlassen", "Gase besitzen grundsätzlich keine Masse"], "answer": 1, "ok": "Ein offenes Gefäß kann gasförmige Stoffe an die Umgebung abgeben. Daraus folgt keine Vernichtung von Atomen.", "bad": "Für die Gesamtbilanz müssen alle beteiligten Stoffe und Systemgrenzen berücksichtigt werden.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Denke an Stoffe, die als Gas die Umgebung erreichen."]}], "explainer": "<div class=\"module-goal\"><strong>Das Modell erklärt den Stoffumsatz</strong>Die Reaktionsgleichung zeigt ein Teilchen- bzw. Stoffmengenverhältnis. Sie ist keine maßstäbliche Momentaufnahme eines Experiments. Bei Verbrennungen muss auch der zugeführte Sauerstoff in die Bilanz einbezogen werden.</div>", "particleExplorer": false}, {"title": "Kannst du die Ebenen sicher verbinden?", "intro": "Fünf neue Aufgaben zu Beobachtung, Deutung, Modellen, Zustandsänderungen und chemischen Reaktionen.", "q": [{"id": "st24", "text": "Ordne die Aussagen ihrer Ebene zu.", "formula": "", "choices": [], "answer": [0, 1, 2], "ok": "Schichten sind sichtbar; Molekülwechselwirkungen sind eine Deutung; die Strukturformel gehört zur Symbolebene.", "bad": "Formeln und Modellvorstellungen sind keine direkten Beobachtungen am Gefäß.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Nutze die drei Ebenen."], "topic": 1, "type": "match", "matchLabels": ["Im Gefäß sind zwei Flüssigkeitsschichten sichtbar.", "Die Moleküle der beiden Stoffe bilden nur begrenzt günstige gegenseitige Wechselwirkungen aus.", "Die Struktur von Ethanol wird als CH₃–CH₂–OH notiert."], "matchChoices": ["Stoffebene", "Teilchenebene", "Symbolebene"]}, {"id": "st25", "text": "Welche Erklärung zum Sieden ist richtig?", "formula": "", "choices": ["Die Moleküle eines reinen Stoffes bleiben erhalten und gehen in die Gasphase über", "Jedes Molekül wird flüssig und dann in Atome zerlegt", "Beim Sieden muss ein neuer Stoff entstehen"], "answer": 0, "ok": "Sieden ist ein Phasenübergang. Bei den hier betrachteten stabilen Stoffen bleibt die chemische Identität erhalten.", "bad": "Eine Zustandsänderung muss keine chemische Reaktion sein.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Unterscheide Molekülaufbau und Molekülabstände."], "topic": 4}, {"id": "st26", "text": "Welche Aussage vermeidet eine Vermischung der Ebenen?", "formula": "", "choices": ["Ein Wassermolekül ist nass", "Eine Wasserprobe benetzt eine Oberfläche; das Verhalten wird mithilfe von Wechselwirkungen erklärt", "Die Moleküle möchten zusammenbleiben"], "answer": 1, "ok": "Die Stoffprobe zeigt ein beobachtbares Verhalten; Wechselwirkungen liefern eine Erklärung.", "bad": "Nasssein und menschliche Absichten sind keine passende Beschreibung einzelner Moleküle.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Formuliere Beobachtung und Erklärung getrennt."], "topic": 2}, {"id": "st27", "text": "Was bedeutet eine Verbindungslinie zwischen Atomkugeln in einem Molekülmodell?", "formula": "", "choices": ["Eine Bindung zwischen den dargestellten Atomen", "Eine sichtbare starre Stange im realen Molekül", "Immer eine Anziehung zwischen ganzen Molekülen"], "answer": 0, "ok": "Die Linie bzw. der Modellstab symbolisiert eine chemische Bindung.", "bad": "Ein Modellzeichen wird nicht wörtlich als realer Gegenstand übernommen.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Beachte die Modelllegende."], "topic": 3}, {"id": "st28", "text": "Welche Aussage zur chemischen Reaktion ist richtig?", "formula": "", "choices": ["Die Molekülzahl muss immer gleich bleiben", "Atome bleiben erhalten, während sich ihre Verknüpfungen ändern können", "Atome verschwinden, sobald ein Gas entsteht"], "answer": 1, "ok": "Bei einer gewöhnlichen chemischen Reaktion werden Atome umgruppiert. Die Zahl der Moleküle kann sich verändern.", "bad": "Erhaltung der Atome bedeutet nicht Erhaltung der Molekülzahl.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Vergleiche 2 H₂ + O₂ mit 2 H₂O."], "topic": 5}], "explainer": "", "particleExplorer": false}], "goal": "Ich kann Beobachtungen auf der Stoffebene von Teilchenerklärungen unterscheiden und beide Ebenen mit Formeln und Modellen verbinden.", "tagline": "Beobachten · Mit Teilchen erklären · Mit Formeln darstellen", "transfer": "Beschreibe das Verdampfen von Ethanol und das Mischen von Öl mit Wasser jeweils zuerst als Beobachtung. Ergänze danach eine getrennte Erklärung auf Teilchenebene.", "success": "Du unterscheidest Stoff-, Teilchen- und Symbolebene und kannst Vorgänge erklären, ohne Stoffeigenschaften unpassend auf einzelne Teilchen zu übertragen."};
moduleDefinitions.reaktionsgleichungen={"title": "Reaktionsgleichungen", "names": ["Startcheck", "Aufbau & Formeln", "Ausgleichen", "Verbrennungen", "Verhältnisse", "Ladungsbilanz", "Abschlusscheck"], "sections": [{"title": "Was sagt eine Reaktionsgleichung aus?", "intro": "Prüfe zuerst dein Vorwissen zu Formeln, Koeffizienten und Atomerhaltung.", "q": [{"id": "rg01", "text": "Was darf beim Ausgleichen verändert werden?", "formula": "", "choices": ["Die Koeffizienten vor den Formeln", "Die Indizes innerhalb der Formeln", "Die Elementsymbole"], "answer": 0, "ok": "Koeffizienten verändern die Mengenverhältnisse; die beteiligten Stoffe bleiben dieselben.", "bad": "Veränderte Indizes würden andere Stoffe beschreiben.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Eine 2 vor H₂O bedeutet zwei Wassermoleküle."]}, {"id": "rg02", "text": "Wie viele H-Atome werden durch 3 H₂O dargestellt?", "formula": "3 H₂O", "choices": ["2", "3", "6"], "answer": 2, "ok": "3 · 2 = 6 H-Atome; zusätzlich sind drei O-Atome dargestellt.", "bad": "Der Koeffizient gilt für die gesamte Formel.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Multipliziere 3 mit dem Index 2."]}, {"id": "rg03", "text": "Was muss in einer ausgeglichenen Reaktionsgleichung stimmen?", "formula": "", "choices": ["Die Anzahl der Moleküle ist immer gleich", "Die Atomanzahl jedes Elements und die Gesamtladung sind auf beiden Seiten gleich", "Alle Koeffizienten sind gleich"], "answer": 1, "ok": "Jedes Element und die Gesamtladung werden getrennt bilanziert.", "bad": "Die Zahl der Moleküle kann sich ändern.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Denke an 2 H₂ + O₂ → 2 H₂O."]}], "explainer": ""}, {"title": "Vom Stoffnamen zur Gleichung", "intro": "Eine Wortgleichung nennt Edukte und Produkte. Die Formelgleichung gibt zusätzlich die Zusammensetzung und das Stoffmengenverhältnis an. Links stehen die Edukte, rechts die Produkte.", "q": [{"id": "rg04", "text": "Welche Stoffe sind die Edukte?", "formula": "CH₄ + 2 O₂ → CO₂ + 2 H₂O", "choices": ["Kohlenstoffdioxid und Wasser", "Methan und Sauerstoff", "Methan und Wasser"], "answer": 1, "ok": "Methan und Sauerstoff stehen links vom Reaktionspfeil.", "bad": "Edukte reagieren miteinander; Produkte entstehen.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Lies die linke Seite."]}, {"id": "rg05", "text": "Welche Formelgleichung passt zur Wortgleichung „Methan + Sauerstoff → Kohlenstoffdioxid + Wasser“?", "formula": "", "choices": ["CH₄ + 2 O₂ → CO₂ + 2 H₂O", "CH₄ → C + 2 H₂", "CO₂ + 2 H₂O → CH₄ + 2 O₂"], "answer": 0, "ok": "Die Stoffnamen wurden in passende Formeln übersetzt und die Atomanzahlen ausgeglichen.", "bad": "Die Formelgleichung muss dieselben Edukte und Produkte wie die Wortgleichung enthalten.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Sauerstoff liegt als O₂ vor."]}, {"id": "rg06", "text": "Welche Atomzahlen enthält ein Ethanolmolekül?", "formula": "C₂H₅OH", "choices": ["C: 2, H: 5, O: 1", "C: 2, H: 6, O: 1", "C: 2, H: 5, O: 2"], "answer": 1, "ok": "Die OH-Gruppe enthält ein weiteres H-Atom: insgesamt sechs.", "bad": "Zähle auch die Atome außerhalb des ersten Formelblocks.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "H₅ und das H in OH gehören zusammen."]}, {"id": "rg07", "text": "Was bedeutet (g) hinter einer Formel?", "formula": "CO₂(g)", "choices": ["Gasförmiger Aggregatzustand", "Ein Gramm des Stoffes", "Ein zusätzlicher Koeffizient"], "answer": 0, "ok": "(g) bedeutet gasförmig. Weitere Angaben sind (s) fest, (l) flüssig und (aq) in wässriger Lösung.", "bad": "Zustandsangaben verändern die Atomanzahl nicht.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Das g steht hier für gasförmig."]}], "explainer": "<div class=\"module-goal\"><strong>Wortgleichung → Formeln → Bilanz</strong>Bestimme zuerst die beteiligten Stoffe und ihre Formeln. Gleiche anschließend die Koeffizienten aus. Bedingungen wie Temperatur oder Katalysator können am Pfeil stehen. Eine Reaktionsgleichung allein erklärt noch keinen Reaktionsmechanismus.</div>"}, {"title": "Koeffizienten selbst ergänzen", "intro": "Trage vor jeder Formel einen positiven ganzzahligen Koeffizienten ein, auch die 1. Gesucht ist jeweils das kleinste ganzzahlige Verhältnis. Mit „Bilanz anzeigen“ kannst du deine Atomzahlen prüfen.", "q": [{"id": "rg08", "text": "Warum ist diese Änderung beim Ausgleichen unzulässig?", "formula": "H₂ + O₂ → H₂O₂ statt H₂O", "choices": ["Es entsteht eine Formel für einen anderen Stoff", "Die Zahl 2 ist zu groß", "Sauerstoff darf nicht rechts stehen"], "answer": 0, "ok": "H₂O₂ bezeichnet Wasserstoffperoxid; H₂O bezeichnet Wasser. Indizes dürfen nicht zum Ausgleichen verändert werden.", "bad": "Die Formeln müssen zu den vorgegebenen Stoffen passen.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Vergleiche die Zusammensetzung von Wasser und Wasserstoffperoxid."]}, {"id": "rg09", "text": "Gleiche die Bildung von Wasser aus.", "formula": "", "choices": [], "answer": [2, 1, 2], "ok": "2 H₂ + O₂ → 2 H₂O. Auf beiden Seiten: H = 4, O = 2.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Beginne mit den O-Atomen: rechts werden zwei Wassermoleküle benötigt."], "type": "balance", "left": [{"formula": "H₂", "atoms": {"H": 2}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg10", "text": "Gleiche die Zersetzung von Wasser aus. Die Gleichung beschreibt die Gesamtbilanz einer Elektrolyse.", "formula": "", "choices": [], "answer": [2, 2, 1], "ok": "2 H₂O → 2 H₂ + O₂. Die umgekehrte Richtung hat dieselben Atomzahlen.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "O₂ enthält zwei O-Atome; beginne daher mit 2 H₂O."], "type": "balance", "left": [{"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}], "right": [{"formula": "H₂", "atoms": {"H": 2}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}]}, {"id": "rg11", "text": "Gleiche die Addition von Brom an Ethen aus.", "formula": "", "choices": [], "answer": [1, 1, 1], "ok": "C₂H₄ + Br₂ → C₂H₄Br₂ ist bereits im Verhältnis 1 : 1 : 1 ausgeglichen.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Prüfe C, H und Br einzeln; nicht jede Gleichung braucht Koeffizienten größer als 1."], "type": "balance", "left": [{"formula": "C₂H₄", "atoms": {"C": 2, "H": 4}, "charge": 0}, {"formula": "Br₂", "atoms": {"Br": 2}, "charge": 0}], "right": [{"formula": "C₂H₄Br₂", "atoms": {"C": 2, "H": 4, "Br": 2}, "charge": 0}]}, {"id": "rg12", "text": "Welche Koeffizienten sind für die Wasserbildung in der vereinbarten Schreibweise richtig?", "formula": "H₂ + O₂ → H₂O", "choices": ["4 : 2 : 4", "2 : 1 : 2", "1 : 1 : 1"], "answer": 1, "ok": "2 : 1 : 2 ist das kleinste ganzzahlige Verhältnis. 4 : 2 : 4 wäre ebenfalls bilanziert, aber noch kürzbar.", "bad": "Das Verhältnis wird auf die kleinsten ganzen Zahlen gekürzt.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Teile gemeinsame Faktoren heraus."]}], "explainer": ""}, {"title": "Organische Stoffe vollständig verbrennen", "intro": "Bei vollständiger Verbrennung der hier betrachteten C/H/O-Verbindungen entstehen CO₂ und H₂O. Gleiche zuerst C, dann H und zuletzt O aus. Sauerstoffatome im Brennstoff zählen mit.", "q": [{"id": "rg13", "text": "Gleiche die vollständige Verbrennung von Methan aus.", "formula": "", "choices": [], "answer": [1, 2, 1, 2], "ok": "CH₄ + 2 O₂ → CO₂ + 2 H₂O. C = 1, H = 4, O = 4 auf beiden Seiten.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Ein C-Atom ergibt ein CO₂; vier H-Atome ergeben zwei H₂O."], "type": "balance", "left": [{"formula": "CH₄", "atoms": {"C": 1, "H": 4}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg14", "text": "Gleiche die vollständige Verbrennung von Ethan aus.", "formula": "", "choices": [], "answer": [2, 7, 4, 6], "ok": "2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O. C = 4, H = 12, O = 14.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Für ein Ethan wären 3,5 O₂ nötig. Verdopple danach alle Koeffizienten."], "type": "balance", "left": [{"formula": "C₂H₆", "atoms": {"C": 2, "H": 6}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg15", "text": "Gleiche die vollständige Verbrennung von Propan aus.", "formula": "", "choices": [], "answer": [1, 5, 3, 4], "ok": "C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. C = 3, H = 8, O = 10.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Drei C-Atome und acht H-Atome bestimmen zuerst die Produktkoeffizienten."], "type": "balance", "left": [{"formula": "C₃H₈", "atoms": {"C": 3, "H": 8}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg16", "text": "Gleiche die vollständige Verbrennung von Ethanol aus.", "formula": "", "choices": [], "answer": [1, 3, 2, 3], "ok": "C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O. Das O-Atom im Ethanol wird mitgezählt.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Rechts sind sieben O-Atome nötig. Eines stammt bereits aus Ethanol."], "type": "balance", "left": [{"formula": "C₂H₅OH", "atoms": {"C": 2, "H": 6, "O": 1}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg17", "text": "Warum reicht zum Ausgleichen der Ethanolverbrennung nicht das Zählen von O₂ allein?", "formula": "", "choices": ["Ethanol enthält selbst ein O-Atom", "Wasser enthält keine O-Atome", "CO₂ enthält drei O-Atome"], "answer": 0, "ok": "Zum Sauerstoff auf der Eduktseite gehört auch das O-Atom des Ethanols.", "bad": "Zähle O in allen beteiligten Formeln.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Betrachte die OH-Gruppe."]}], "explainer": "<div class=\"module-goal\"><strong>Vollständige Verbrennung</strong>Die Produkte CO₂ und H₂O sind hier vorgegeben. Bei unvollständiger Verbrennung können andere Produkte auftreten; dafür wäre eine andere Stoffbilanz erforderlich.</div>"}, {"title": "Verhältnisse richtig lesen", "intro": "Koeffizienten geben Teilchenzahl- und Stoffmengenverhältnisse an. Sie sind keine direkten Massenverhältnisse und verraten allein weder Reaktionsgeschwindigkeit noch Mechanismus.", "q": [{"id": "rg18", "text": "Wie viel O₂ wird für 2 mol Ethanol bei vollständiger Verbrennung benötigt?", "formula": "C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O", "choices": ["3 mol", "6 mol", "2 mol"], "answer": 1, "ok": "Das Verhältnis Ethanol : O₂ ist 1 : 3; 2 mol Ethanol benötigen 6 mol O₂.", "bad": "Multipliziere alle Stoffmengen im Verhältnis mit demselben Faktor.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Verdopple den Koeffizienten von O₂."]}, {"id": "rg19", "text": "Wie viel CO₂ entsteht aus 3 mol Propan bei vollständiger Umsetzung?", "formula": "C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O", "choices": ["3 mol", "5 mol", "9 mol"], "answer": 2, "ok": "Pro mol Propan entstehen 3 mol CO₂, aus 3 mol also 9 mol.", "bad": "Lies das Verhältnis Propan : CO₂.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "3 · 3 = ?"]}, {"id": "rg20", "text": "Bedeutet 2 H₂ + O₂ → 2 H₂O ein Massenverhältnis von 2 : 1 : 2?", "formula": "", "choices": ["Ja, Koeffizienten sind immer Grammangaben", "Nein, für Massen werden zusätzlich die molaren Massen benötigt", "Ja, aber nur bei Gasen"], "answer": 1, "ok": "Die Koeffizienten beschreiben Stoffmengenverhältnisse. Massen ergeben sich mit m = n · M.", "bad": "Verschiedene Stoffe besitzen unterschiedliche molare Massen.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Ein mol H₂ hat eine andere Masse als ein mol O₂."]}, {"id": "rg21", "text": "Was lässt sich aus der Gesamtgleichung allein nicht ableiten?", "formula": "", "choices": ["Das Stoffmengenverhältnis", "Die beteiligten Formeln", "Der genaue Reaktionsmechanismus und die Geschwindigkeit"], "answer": 2, "ok": "Eine Gesamtgleichung bilanziert Stoffe; Mechanismus und Geschwindigkeit benötigen weitere Informationen.", "bad": "Eine ausgeglichene Gleichung beschreibt nicht automatisch einzelne Reaktionsschritte.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Denke an den Unterschied zwischen Bilanz und Ablauf."]}], "explainer": ""}, {"title": "Auch die Ladung muss stimmen", "intro": "Bei Ionengleichungen wird neben jedem Element die elektrische Gesamtladung bilanziert. Koeffizienten multiplizieren auch die Ladung eines Ions. Die folgenden Gleichungen sind vereinfachte Nettogleichungen ohne Zuschauerionen.", "q": [{"id": "rg22", "text": "Gleiche die Neutralisation aus. H⁺ ist hier eine vereinfachte Schreibweise für ein hydratisiertes Proton.", "formula": "", "choices": [], "answer": [1, 1, 1], "ok": "H⁺ + OH⁻ → H₂O. H = 2, O = 1 und Gesamtladung = 0 auf beiden Seiten.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Die Ladungen +1 und −1 ergeben zusammen 0."], "type": "balance", "left": [{"formula": "H⁺", "atoms": {"H": 1}, "charge": 1}, {"formula": "OH⁻", "atoms": {"O": 1, "H": 1}, "charge": -1}], "right": [{"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg23", "text": "Welche Gesamtladung besitzt 2 OH⁻?", "formula": "2 OH⁻", "choices": ["−1", "−2", "0"], "answer": 1, "ok": "2 · (−1) = −2. Auch die Ionenladung wird mit dem Koeffizienten multipliziert.", "bad": "Der Koeffizient gibt die Zahl der Ionen an.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Zwei einfach negative Ionen tragen zusammen welche Ladung?"]}, {"id": "rg24", "text": "Gleiche die Reaktion von Ethansäure mit Hydroxid-Ionen aus.", "formula": "", "choices": [], "answer": [1, 1, 1, 1], "ok": "CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O. C = 2, H = 5, O = 3, Ladung = −1 auf beiden Seiten.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Das Säuremolekül gibt ein Proton ab; Hydroxid wird zu Wasser."], "type": "balance", "left": [{"formula": "CH₃COOH", "atoms": {"C": 2, "H": 4, "O": 2}, "charge": 0}, {"formula": "OH⁻", "atoms": {"O": 1, "H": 1}, "charge": -1}], "right": [{"formula": "CH₃COO⁻", "atoms": {"C": 2, "H": 3, "O": 2}, "charge": -1}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg25", "text": "Was stimmt an dieser Gleichung nicht?", "formula": "H⁺ + OH⁻ → H₂O⁺", "choices": ["Die H-Atomanzahl", "Die O-Atomanzahl", "Die Gesamtladung"], "answer": 2, "ok": "Links ist die Gesamtladung 0, rechts wäre sie +1. Das neutrale Produkt ist H₂O.", "bad": "Eine passende Atomzahl genügt bei Ionengleichungen nicht.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Addiere links +1 und −1."]}], "explainer": "<div class=\"module-goal\"><strong>Bilanz in zwei Schritten</strong>1. Zähle jedes Element getrennt. 2. Addiere die Ladungen auf jeder Seite. Zuschauerionen können in einer Nettogleichung weggelassen werden, wenn sie auf beiden Seiten unverändert vorkommen.</div>"}, {"title": "Dein Abschlusscheck", "intro": "Löse die Aufgaben möglichst ohne Hilfe. Die Auswertung zeigt dir, welche Abschnitte du erneut üben kannst.", "q": [{"id": "rg26", "text": "Gleiche die Ethanolverbrennung selbstständig aus.", "formula": "", "choices": [], "answer": [1, 3, 2, 3], "ok": "Die kleinsten Koeffizienten sind 1 : 3 : 2 : 3.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Zähle C, H und O in dieser Reihenfolge."], "topic": 3, "type": "balance", "left": [{"formula": "C₂H₅OH", "atoms": {"C": 2, "H": 6, "O": 1}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg27", "text": "Gleiche die Ethanverbrennung mit kleinsten ganzen Koeffizienten aus.", "formula": "", "choices": [], "answer": [2, 7, 4, 6], "ok": "Die kleinsten Koeffizienten sind 2 : 7 : 4 : 6.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Vermeide Brüche, indem du am Ende alle Koeffizienten passend multiplizierst."], "topic": 3, "type": "balance", "left": [{"formula": "C₂H₆", "atoms": {"C": 2, "H": 6}, "charge": 0}, {"formula": "O₂", "atoms": {"O": 2}, "charge": 0}], "right": [{"formula": "CO₂", "atoms": {"C": 1, "O": 2}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg28", "text": "Gleiche die Nettogleichung für Ethansäure und Hydroxid aus.", "formula": "", "choices": [], "answer": [1, 1, 1, 1], "ok": "Alle Koeffizienten sind 1; Atome und Gesamtladung stimmen.", "bad": "Prüfe die Bilanz und verwende die kleinsten positiven ganzen Koeffizienten. Eine 1 muss hier ebenfalls eingetragen werden.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Prüfe auch die Ladung −1 auf beiden Seiten."], "topic": 5, "type": "balance", "left": [{"formula": "CH₃COOH", "atoms": {"C": 2, "H": 4, "O": 2}, "charge": 0}, {"formula": "OH⁻", "atoms": {"O": 1, "H": 1}, "charge": -1}], "right": [{"formula": "CH₃COO⁻", "atoms": {"C": 2, "H": 3, "O": 2}, "charge": -1}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rg29", "text": "Wie viel H₂O entsteht aus 2 mol Methan bei vollständiger Verbrennung?", "formula": "CH₄ + 2 O₂ → CO₂ + 2 H₂O", "choices": ["2 mol", "4 mol", "1 mol"], "answer": 1, "ok": "Das Verhältnis Methan : Wasser ist 1 : 2, daher entstehen 4 mol Wasser.", "bad": "Nutze das Stoffmengenverhältnis, kein direktes Massenverhältnis.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Multipliziere den Wasserkoeffizienten mit 2."], "topic": 4}, {"id": "rg30", "text": "Eine Gleichung ist noch nicht ausgeglichen. Welcher nächste Schritt ist richtig?", "formula": "", "choices": ["Die Indizes passend verändern", "Koeffizienten verändern und anschließend Atome und Ladung prüfen", "Alle Produkte weglassen"], "answer": 1, "ok": "Die Stoffformeln bleiben erhalten; Koeffizienten stellen das passende Verhältnis her.", "bad": "Veränderte Indizes würden andere Stoffe beschreiben.", "hints": ["Zähle für jedes Element die Atome auf beiden Seiten. Koeffizienten multiplizieren die gesamte Formel; Indizes bleiben unverändert.", "Prüfe die Mengenverhältnisse."], "topic": 2}], "explainer": ""}], "goal": "Ich kann Reaktionsgleichungen aufstellen, mit kleinsten ganzen Koeffizienten ausgleichen und ihre Atom-, Ladungs- und Stoffmengenbilanz prüfen.", "tagline": "Formeln aufstellen · Koeffizienten ergänzen · Bilanz prüfen", "transfer": "Formuliere die vollständige Verbrennung von Butan als Wort- und Formelgleichung. Gleiche aus und leite das Stoffmengenverhältnis von Butan zu Sauerstoff ab.", "success": "Du kannst organische Reaktionen bilanzieren und Koeffizienten als Stoffmengenverhältnisse deuten."};
moduleDefinitions.isomerie={"title": "Molekülbau und Isomerie", "names": ["Startcheck", "Struktur vergleichen", "Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Isomere zeichnen", "Abschlusscheck"], "sections": [{"title": "Gleiche Formel – gleiche Verbindung?", "intro": "Drei Fragen zum Einstieg. Prüfe, ob du Summenformel, Verknüpfung und Darstellung bereits unterscheiden kannst.", "q": [{"id": "is01", "text": "Was haben Konstitutionsisomere gemeinsam?", "choices": ["Die Summenformel", "Immer dieselbe Stoffklasse", "Die Verknüpfung aller Atome"], "answer": 0, "ok": "Konstitutionsisomere besitzen dieselbe Summenformel, aber eine unterschiedliche Verknüpfung der Atome.", "bad": "Gleiche Atomzahlen legen die Verknüpfung noch nicht fest.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vergleiche Zusammensetzung und Struktur."]}, {"id": "is02", "text": "Wie stehen diese Formeln zueinander?", "choices": ["Zwei unterschiedliche Isomere", "Dieselbe Verbindung in umgekehrter Leserichtung", "Zwei verschiedene Summenformeln"], "answer": 1, "ok": "Beide Formeln zeigen Ethanol mit der Verknüpfung C–C–O.", "bad": "Die Leserichtung ändert nicht, welche Atome miteinander verbunden sind.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Lies eine Formel von rechts nach links."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–OH"}, {"label": "Struktur 2", "formula": "HO–CH₂–CH₃"}]}, {"id": "is03", "text": "Sind diese Verbindungen Isomere?", "choices": ["Ja, sie enthalten beide C und H", "Nein, ihre Summenformeln unterscheiden sich", "Ja, weil beide Alkane sind"], "answer": 1, "ok": "Ethan hat C₂H₆, Propan C₃H₈. Unterschiedliche Summenformeln schließen Isomerie aus.", "bad": "Dieselbe Stoffklasse genügt nicht.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Zähle C und H."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₃"}, {"label": "Struktur 2", "formula": "CH₃–CH₂–CH₃"}]}], "explainer": ""}, {"title": "Konstitution statt Leserichtung", "intro": "Vergleiche Strukturen in zwei Schritten: 1. Stimmen die Summenformeln überein? 2. Sind die Atome unterschiedlich verknüpft? Drehen, Spiegeln einer Papierzeichnung oder Umzeichnen erzeugt bei den hier betrachteten Beispielen keine neue Verknüpfung.", "q": [{"id": "is04", "text": "Welche Summenformel besitzen beide Strukturen?", "choices": ["C₄H₈", "C₄H₁₀", "C₃H₈"], "answer": 1, "ok": "Beide enthalten vier C- und zehn H-Atome. Die Verknüpfung unterscheidet sich.", "bad": "Die CH₃-Gruppe in der Klammer zählt als zusätzliches C-Atom.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Addiere bei der verzweigten Formel 3 + 1 + 3 + 3 H."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–CH₃"}, {"label": "Struktur 2", "formula": "CH₃–CH(CH₃)–CH₃"}]}, {"id": "is05", "text": "Was bedeutet die Klammer in CH₃–CH(CH₃)–CH₃?", "choices": ["Die CH₃-Gruppe ist an das mittlere CH gebunden", "Die Gruppe darf bei der Summenformel weggelassen werden", "Die Klammer bezeichnet eine Doppelbindung"], "answer": 0, "ok": "Der Klammerausdruck ist ein Seitenzweig am direkt davorstehenden C-Atom.", "bad": "Klammern sind hier eine verkürzte Schreibweise für eine Verzweigung.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Das mittlere CH hat drei C-Nachbarn."]}, {"id": "is06", "text": "Entsteht ein neues Konstitutionsisomer, wenn Butan als gerade Linie statt als Zickzackkette gezeichnet wird?", "choices": ["Ja, jede andere Form ist ein Isomer", "Nein, solange die Verknüpfung gleich bleibt", "Ja, weil sich die Atomzahl verändert"], "answer": 1, "ok": "Die gezeichnete Form allein ändert keine Bindung zwischen den Atomen.", "bad": "Für Konstitutionsisomerie muss sich die Verknüpfung ändern.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vergleiche die C-Nachbarn jedes C-Atoms."]}, {"id": "is07", "text": "Welche Aussage über Konstitutionsisomere stimmt?", "choices": ["Sie müssen dieselben Eigenschaften besitzen", "Sie können unterschiedliche Eigenschaften und Reaktionen zeigen", "Sie besitzen immer verschiedene Summenformeln"], "answer": 1, "ok": "Eine andere Struktur kann Eigenschaften und Reaktionsverhalten verändern.", "bad": "Die Summenformel beschreibt nur die Zusammensetzung.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Der Aufbau beeinflusst z. B. Wechselwirkungen und funktionelle Gruppen."]}], "explainer": "<div class=\"module-goal\"><strong>Die drei Schwerpunkte</strong><strong>Kettenisomerie:</strong> anderes C-Gerüst. <strong>Stellungsisomerie:</strong> gleiche Stoffklasse und gleiches C-Gerüst, andere Position einer Gruppe. <strong>Funktionsisomerie:</strong> gleiche Summenformel, unterschiedliche funktionelle Gruppen bzw. Stoffklassen.</div>"}, {"title": "Kettenisomerie: das C-Gerüst vergleichen", "intro": "Butan und 2-Methylpropan besitzen C₄H₁₀. Bei Butan bilden die vier C-Atome eine unverzweigte Kette. Bei 2-Methylpropan ist ein C-Atom mit drei anderen C-Atomen verbunden.", "q": [{"id": "is08", "text": "Welche Isomerie liegt vor?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 0, "ok": "Butan und 2-Methylpropan unterscheiden sich im C-Gerüst: Kettenisomerie.", "bad": "Beide sind Alkane; der Unterschied liegt in der Verzweigung.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Prüfe, wie viele C-Nachbarn das mittlere C besitzt."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–CH₃"}, {"label": "Struktur 2", "formula": "CH₃–CH(CH₃)–CH₃"}]}, {"id": "is09", "text": "Welcher Name gehört zur verzweigten Struktur?", "choices": ["Butan", "2-Methylpropan", "2-Methylbutan"], "answer": 1, "ok": "Die längste Kette enthält drei C-Atome, mit einer Methylgruppe an C-2.", "bad": "2-Methylbutan hätte insgesamt fünf C-Atome.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Bestimme zuerst die längste zusammenhängende C-Kette."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH(CH₃)–CH₃"}]}, {"id": "is10", "text": "Welches Paar zeigt Kettenisomerie?", "choices": ["Pentan und 2-Methylbutan", "Ethan und Propan", "Ethanol und Ethanol"], "answer": 0, "ok": "Pentan und 2-Methylbutan haben C₅H₁₂, aber unterschiedliche C-Gerüste.", "bad": "Verschiedene Atomzahlen oder dieselbe Struktur sind kein Isomerenpaar.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Beide richtigen Strukturen besitzen fünf C-Atome."]}, {"id": "is11", "text": "Wie viele unterschiedliche Konstitutionsisomere gibt es für C₄H₁₀?", "choices": ["1", "2", "4"], "answer": 1, "ok": "Es gibt Butan und 2-Methylpropan. Andere Leserichtungen liefern keine weiteren Isomere.", "bad": "Zähle unterschiedliche Verknüpfungen, nicht unterschiedliche Zeichnungen.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vier C-Atome ergeben eine unverzweigte oder eine verzweigte Struktur."]}], "explainer": ""}, {"title": "Stellungsisomerie: die Gruppe verschieben", "intro": "Bei Propan-1-ol und Propan-2-ol bleibt das unverzweigte C₃-Gerüst erhalten. Beide sind Alkohole mit C₃H₈O; die OH-Gruppe ist an unterschiedlichen Positionen gebunden.", "q": [{"id": "is12", "text": "Welche Isomerie liegt vor?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 1, "ok": "Gleiches C-Gerüst, gleiche Stoffklasse, andere OH-Position: Stellungsisomerie.", "bad": "Das C-Gerüst ist unverändert; die Gruppe sitzt an einem anderen C-Atom.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vergleiche endständiges und mittleres C."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–OH"}, {"label": "Struktur 2", "formula": "CH₃–CH(OH)–CH₃"}]}, {"id": "is13", "text": "Welcher Name gehört zur Struktur?", "choices": ["Propan-1-ol", "Propan-2-ol", "2-Methylpropan"], "answer": 1, "ok": "Die OH-Gruppe ist an C-2 der Propankette gebunden.", "bad": "Die Nummer gibt die Position der Hydroxygruppe an.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Die OH-Gruppe sitzt am mittleren C."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH(OH)–CH₃"}]}, {"id": "is14", "text": "Ist „Propan-3-ol“ ein weiteres Stellungsisomer von Propan-1-ol?", "choices": ["Ja, die Zahl ist anders", "Nein, nach Nummerierung vom anderen Ende ist es Propan-1-ol", "Ja, es gehört zu einer anderen Stoffklasse"], "answer": 1, "ok": "Die beiden Enden der unverzweigten Propankette sind gleichwertig. Es wird so nummeriert, dass OH die kleinere Zahl erhält.", "bad": "Ein neuer Name für dieselbe Verknüpfung erzeugt kein neues Isomer.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Drehe die Leserichtung um."]}, {"id": "is15", "text": "Welche Aussage zu diesem Paar stimmt?", "choices": ["Es sind zwei unterschiedliche Stellungsisomere", "Es ist dieselbe Verbindung in umgekehrter Leserichtung", "Die erste Struktur besitzt mehr O-Atome"], "answer": 1, "ok": "In beiden Fällen ist die OH-Gruppe am Ende einer unverzweigten C₃-Kette gebunden.", "bad": "Endständiges OH bleibt endständig, auch wenn die Formel umgedreht wird.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vergleiche die Nachbarn des OH-tragenden C-Atoms."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–OH"}, {"label": "Struktur 2", "formula": "HO–CH₂–CH₂–CH₃"}]}], "explainer": ""}, {"title": "Funktionsisomerie: die Stoffklasse wechseln", "intro": "Ethanol und Dimethylether besitzen C₂H₆O. Ethanol hat eine Hydroxygruppe; im Ether ist O zwischen zwei C-Resten gebunden. Auch Propanal und Propanon sind Funktionsisomere mit C₃H₆O.", "q": [{"id": "is16", "text": "Welche Isomerie liegt vor?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 2, "ok": "Ethanol ist ein Alkohol, Dimethylether ein Ether: Funktionsisomerie bei C₂H₆O.", "bad": "Achte darauf, ob O mit H oder mit zwei C-Atomen verbunden ist.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Suche die O–H-Bindung."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–OH"}, {"label": "Struktur 2", "formula": "CH₃–O–CH₃"}]}, {"id": "is17", "text": "Welche Beschreibung passt zum Ether?", "choices": ["Eine OH-Gruppe am C-Gerüst", "Ein O-Atom zwischen zwei C-Resten", "Eine Carboxygruppe"], "answer": 1, "ok": "Die Einheit C–O–C kennzeichnet hier den Ether. Dimethylether besitzt keine OH-Gruppe.", "bad": "Ein O-Atom allein macht eine Verbindung noch nicht zum Alkohol.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Prüfe die beiden direkten Nachbarn von O."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–O–CH₃"}]}, {"id": "is18", "text": "Welche Isomerie liegt bei Propanal und Propanon vor?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 2, "ok": "Beide haben C₃H₆O. Propanal ist ein Aldehyd, Propanon ein Keton: Funktionsisomerie.", "bad": "Die Umgebung von C=O entscheidet über die Stoffklasse.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Beim Aldehyd ist H direkt an das Carbonyl-C gebunden."], "isomerPairs": [{"label":  "builder", "graph": {"atoms": [["C", 100, 125], ["O", 250, 125], ["C", 400, 125]], "bonds": [[0, 1, 1], [1, 2, 1]], "slots": [[[-60, 0], [0, -65], [0, 65], [45, 45]], [[45, 45], [-45, -45]], [[60, 0], [0, -65], [0, 65], [45, 45]]], "labels": ["C₍1₎", "O₍2₎", "C₍3₎"], "variable": [], "w": 495, "h": 260}, "target": [3, 0, 3]}], "explainer": "<div class=\"module-goal\"><strong>Zusatzaufgabe auf Papier</strong>Zeichne nach den sechs Übungen die drei Isomerenpaare selbst: Butan/2-Methylpropan, Propan-1-ol/Propan-2-ol und Ethanol/Dimethylether. Gib jeweils die gemeinsame Summenformel und die Isomerieart an. Prüfe jede Bindigkeit.</div>"}, {"title": "Dein Abschlusscheck", "intro": "Ordne neue Vergleiche ein und prüfe, ob eine andere Darstellung wirklich ein anderes Molekül zeigt.", "q": [{"id": "is26", "text": "Welche Isomerie zeigt dieses Paar?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 0, "ok": "Die beiden C₅H₁₂-Strukturen haben unterschiedliche C-Gerüste: Kettenisomerie.", "bad": "Vergleiche die Verzweigung des C-Gerüsts.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Prüfe die C-Nachbarn jedes C-Atoms."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–CH₂–CH₃"}, {"label": "Struktur 2", "formula": "CH₃–CH(CH₃)–CH₂–CH₃"}], "topic": 2}, {"id": "is27", "text": "Welche Isomerie zeigt dieses Paar?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 1, "ok": "Gleiches unverzweigtes C₄-Gerüst, gleiche Alkoholklasse, andere OH-Position: Stellungsisomerie.", "bad": "Prüfe die Position der OH-Gruppe.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Vergleiche C-1 mit C-2."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CH₂–CH₂–OH"}, {"label": "Struktur 2", "formula": "CH₃–CH₂–CH(OH)–CH₃"}], "topic": 3}, {"id": "is28", "text": "Welche Isomerie zeigt dieses Paar?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 2, "ok": "Propanal und Propanon sind Aldehyd und Keton mit C₃H₆O: Funktionsisomerie.", "bad": "Die Umgebung des Carbonyl-C unterscheidet die Stoffklassen.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Ein Carbonyl-C trägt H, das andere zwei C-Reste."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH₂–CHO"}, {"label": "Struktur 2", "formula": "CH₃–C(=O)–CH₃"}], "topic": 4}, {"id": "is29", "text": "Wie stehen diese beiden Strukturen zueinander?", "choices": ["Kettenisomerie", "Stellungsisomerie", "Funktionsisomerie", "Kein Isomerenpaar"], "answer": 3, "ok": "Beide zeigen Propan-2-ol. Die gleiche Verknüpfung in anderer Darstellung ist kein Isomerenpaar.", "bad": "Der Wechsel der Schreibweise allein verändert die Struktur nicht.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Das mittlere C ist in beiden Formeln mit OH verbunden."], "isomerPairs": [{"label": "Struktur 1", "formula": "CH₃–CH(OH)–CH₃"}, {"label": "Struktur 2", "formula": "HO–CH(CH₃)₂"}], "topic": 1}, {"id": "is30", "text": "Ergänze abschließend das Ether-Isomer von C₂H₆O.", "choices": [], "answer": null, "ok": "Dimethylether ist vollständig: C₂H₆O mit C–O–C-Verknüpfung. Er ist ein Funktionsisomer von Ethanol.", "bad": "Prüfe jede Bindigkeit: C bildet hier vier, O zwei und H eine Bindung. Zähle anschließend die Atome.", "hints": ["Vergleiche zuerst die Summenformeln, danach C-Gerüst, Position der Gruppe und Stoffklasse.", "Zähle die schon vorhandenen Bindungen des O-Atoms."], "topic": 4, "type": "builder", "graph": {"atoms": [["C", 100, 125], ["O", 250, 125], ["C", 400, 125]], "bonds": [[0, 1, 1], [1, 2, 1]], "slots": [[[-60, 0], [0, -65], [0, 65], [45, 45]], [[45, 45], [-45, -45]], [[60, 0], [0, -65], [0, 65], [45, 45]]], "labels": ["C₍1₎", "O₍2₎", "C₍3₎"], "variable": [], "w": 495, "h": 260}, "target": [3, 0, 3]}], "explainer": ""}], "goal": "Ich kann Ketten-, Stellungs- und Funktionsisomerie unterscheiden, einfache Isomere zeichnen und dieselbe Struktur in verschiedenen Darstellungen erkennen.", "tagline": "Summenformeln prüfen · Strukturen vergleichen · Isomere zeichnen", "transfer": "Zeichne zwei unterschiedliche C₅H₁₂-Strukturen und begründe ihre Isomerieart. Zeichne danach Propan-1-ol von beiden Leserichtungen und erkläre, warum kein neues Isomer entsteht.", "success": "Du unterscheidest die drei behandelten Arten der Konstitutionsisomerie und erkennst den Unterschied zwischen neuer Verknüpfung und anderer Darstellung."};
moduleDefinitions.wechselwirkungen={"title": "Zwischenmolekulare Wechselwirkungen", "names": ["Startcheck", "Innen & zwischen", "London-Kräfte", "Dipole & H-Brücken", "Siedetemperatur", "Löslichkeit", "Abschlusscheck"], "sections": [{"title": "Was hält Moleküle zusammen?", "intro": "Starte mit drei Grundfragen zu Bindungen, Polarität und Wasserstoffbrücken.", "q": [{"id": "ww01", "text": "Was wird beim Verdampfen von Ethanol hauptsächlich überwunden?", "choices": ["Anziehung zwischen Ethanolmolekülen", "Alle C–C-Bindungen innerhalb der Moleküle", "Die Bindung der Atomkerne"], "answer": 0, "ok": "Beim Verdampfen werden Moleküle voneinander getrennt; ihr chemischer Aufbau bleibt erhalten.", "bad": "Zwischenmolekulare Anziehung ist von Bindungen innerhalb eines Moleküls zu unterscheiden.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Die Moleküle bleiben auch im Gas Ethanolmoleküle."], "formula": ""}, {"id": "ww02", "text": "Welche Wechselwirkung tritt auch zwischen unpolaren Molekülen auf?", "choices": ["Nur Wasserstoffbrücken", "London-Dispersionskräfte", "Keine Anziehung"], "answer": 1, "ok": "London-Kräfte treten bei allen Molekülen auf, auch bei unpolaren.", "bad": "Unpolar bedeutet nicht wechselwirkungsfrei.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Die Elektronenverteilung kann kurzzeitig schwanken."], "formula": ""}, {"id": "ww03", "text": "Welche Gruppe ermöglicht einem Ethanolmolekül, als Wasserstoffbrücken-Donator zu wirken?", "choices": ["Die CH₃-Gruppe", "Die O–H-Gruppe", "Jede C–H-Bindung gleich gut"], "answer": 1, "ok": "Das an O gebundene H kann eine Wasserstoffbrücke zu einem geeigneten freien Elektronenpaar ausbilden.", "bad": "Für die hier betrachteten starken Wasserstoffbrücken muss H an O, N oder F gebunden sein.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Betrachte die Hydroxygruppe."], "formula": "CH₃–CH₂–OH"}], "explainer": "", "interactionExplorer": false}, {"title": "Innerhalb oder zwischen Molekülen?", "intro": "Eine kovalente Bindung verbindet Atome innerhalb eines Moleküls. Zwischenmolekulare Wechselwirkungen wirken zwischen getrennten Molekülen und beeinflussen z. B. Sieden und Löslichkeit.", "q": [{"id": "ww04", "text": "Ordne die Beispiele zu.", "choices": [], "answer": [0, 1, 0], "ok": "C–O und O–H sind hier kovalente Bindungen im Molekül; die Anziehung zwischen den Molekülen ist zwischenmolekular.", "bad": "Die beteiligten Teilchen und ihre Grenzen sind entscheidend.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Frage: Gehören die beiden Atome zum selben Molekül?"], "formula": "", "type": "match", "matchLabels": ["C–O-Bindung innerhalb eines Ethanolmoleküls", "Anziehung zwischen zwei Ethanolmolekülen", "O–H-Bindung innerhalb eines Wassermoleküls"], "matchChoices": ["Bindung im Molekül", "Wechselwirkung zwischen Molekülen"]}, {"id": "ww05", "text": "Warum kann Wasser sieden, ohne in H₂ und O₂ zerlegt zu werden?", "choices": ["Es werden überwiegend Wechselwirkungen zwischen Wassermolekülen überwunden", "Die O–H-Bindungen werden alle gespalten", "Gas besteht grundsätzlich aus einzelnen Atomen"], "answer": 0, "ok": "Beim Sieden bleiben H₂O-Moleküle erhalten. Eine Zerlegung wäre eine chemische Reaktion.", "bad": "Ein Phasenübergang ändert nicht automatisch die Molekülstruktur.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Unterscheide Sieden und Elektrolyse."], "formula": ""}, {"id": "ww06", "text": "Welche Aussage über eine Wasserstoffbrücke ist richtig?", "choices": ["Sie ist die O–H-Bindung innerhalb eines Moleküls", "Sie ist hier eine Anziehung zwischen einem geeigneten H-Donator und einem Akzeptor in einem anderen Molekül", "Sie verbindet immer zwei H-Atome"], "answer": 1, "ok": "Im Modul betrachten wir Wasserstoffbrücken zwischen Molekülen, z. B. O–H···O.", "bad": "Die kovalente O–H-Bindung und die zusätzliche Wasserstoffbrücke haben unterschiedliche Rollen.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Die Punktlinie verbindet H mit einem geeigneten Akzeptor."], "formula": ""}, {"id": "ww07", "text": "Welche Aussage ist für Molekülstoffe sinnvoll?", "choices": ["Eine höhere Siedetemperatur kann auf stärkere gesamte zwischenmolekulare Anziehung hindeuten", "Eine höhere Siedetemperatur beweist immer stärkere C–C-Bindungen", "Die Siedetemperatur hängt nie vom Druck ab"], "answer": 0, "ok": "Bei vergleichbaren Bedingungen beeinflusst die gesamte zwischenmolekulare Anziehung das Sieden.", "bad": "Vergleiche bei gleichem Druck; die Bindungen im Molekül erklären den Phasenübergang nicht.", "hints": ["Prüfe Molekülpolarität, Elektronenhülle und mögliche O–H-, N–H- oder F–H-Gruppen. Unterscheide Bindungen im Molekül und Wechselwirkungen zwischen Molekülen.", "Beim Sieden werden ganze Moleküle getrennt."], "formula": ""}], "explainer": "<div class=\"module-goal\"><strong>Beim Vergleichen kontrollieren</strong>Vergleiche Stoffe bei gleichem Druck und berücksichtige mehrere Merkmale: Polarität, Wasserstoffbrücken, Größe und Form der Elektronenhülle. Eine einzelne Gruppe erklärt nicht jede Stoffeigenschaft.</div>", "interactionExplorer": false}, {"title": "London-Kräfte: bei allen Molekülen", "intro": "Die Elektronenverteilung schwankt. Momentane Dipole können in Nachbarmolekülen Dipole induzieren. Daraus entstehen ionsmittel oxidiert den Partner und wird selbst reduziert. Das Reduktionsmittel reduziert den Partner und wird selbst oxidiert.", "q": [{"id": "rx04", "text": "Ordne die Begriffe zu.", "choices": [], "answer": [0, 1, 0, 1], "ok": "Abgabe und Anstieg gehören zur Oxidation; Aufnahme und Abnahme zur Reduktion.", "bad": "Verwechsle die beiden Richtungen nicht.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Merke: Oxidation gibt Elektronen ab."], "formula": "", "type": "match", "matchLabels": ["Elektronen abgeben", "Elektronen aufnehmen", "Oxidationszahl steigt", "Oxidationszahl sinkt"], "matchChoices": ["Oxidation", "Reduktion"]}, {"id": "rx05", "text": "Wer ist bei dieser Reaktion der Elektronendonator?", "choices": ["Zn", "Cu²⁺", "Cu"], "answer": 0, "ok": "Zn gibt Elektronen ab und wird zu Zn²⁺ oxidiert.", "bad": "Cu²⁺ nimmt die abgegebenen Elektronen auf.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Betrachte die Oxidationszahlen vor und nach der Reaktion."], "formula": "Zn + Cu²⁺ → Zn²⁺ + Cu"}, {"id": "rx06", "text": "Ordne die Rollen zu.", "choices": [], "answer": [0, 1], "ok": "Zn ist Reduktionsmittel; Cu²⁺ ist Oxidationsmittel.", "bad": "Der Name beschreibt die Wirkung auf den Partner.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Der Elektronenakzeptor ist das Oxidationsmittel."], "formula": "", "type": "match", "matchLabels": ["Zn in Zn + Cu²⁺ → Zn²⁺ + Cu", "Cu²⁺ in Zn + Cu²⁺ → Zn²⁺ + Cu"], "matchChoices": ["Reduktionsmittel: wird selbst oxidiert", "Oxidationsmittel: wird selbst reduziert"]}, {"id": "rx07", "text": "Warum sind Oxidation und Reduktion gekoppelt?", "choices": ["Die abgegebenen Elektronen müssen von einem Partner aufgenommen werden", "Jede Oxidation erzeugt automatisch Sauerstoff", "Be + 2 · (−II) = 0, also C = +IV.", "bad": "Die Summe der Oxidationszahlen im neutralen Molekül ist 0.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Zwei O-Atome tragen zusammen −IV bei."], "formula": "CO₂"}, {"id": "rx11", "text": "Welche Oxidationszahl hat C in CH₄?", "choices": ["−IV", "+IV", "0"], "answer": 0, "ok": "C + 4 · (+I) = 0, also C = −IV.", "bad": "Das neutrale Molekül hat insgesamt die Summe 0.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Vier H-Atome tragen zusammen +IV bei."], "formula": "CH₄"}, {"id": "rx12", "text": "Ist die Oxidationszahl eines C-Atoms in einem Molekül seine tatsächliche elektrische Ladung?", "choices": ["Ja, sie ist immer eine gemessene Ionenladung", "Nein, sie beruht auf einer formalen Zuordnung der Bindungselektronen", "Ja, sie ist dasselbe wie δ+ oder δ−"], "answer": 1, "ok": "Oxidationszahlen sind formale Bilanzgrößen und von Partialladungen zu unterscheiden.", "bad": "Ein kovalent gebundenes Atom wird dadurch nicht automatisch zu einem freien Ion.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Denke an die gedankliche Zuordnung der Elektronen."], "formula": ""}, {"id": "rx13", "text": "Welche Einschränkung gehört zu den vereinfachten Regeln H = +I und O = −II?", "choices": ["Sie gelten ausnahmslos für jede Verbindung", "Es gibt Ausnahmen, z. B. Metallhydride und Peroxide; sie kommen in diesen Übungen nicht vor", "Sie gelten nur für Alkane"], "answer": 1, "ok": "Die Regeln passen zu den hier verwendeten Molekülen. In Metallhydriden kann H −I, in Peroxiden O −I haben.", "bad": "Die allgemeine Regel besitzt bekannte Ausnahmen.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Wende eine Regel im passenden Bereich an."], "formula": ""}], "explainer": "<div class=\"module-goal\"><strong>Formale Zuordnung</strong>Bindungselektronen werden gedanklich dem elektronegativeren Atom zugeordnet; zwischen gleichen Atomen gleich geteilt. Bei Molekülen darfst du Oxidationszahlen nicht einfach mit tatsächlichen Ionenladungen gleichsetzen.</div>", "redoxExplorer": false}, {"title": "Jedes C-Atom einzeln betrachten", "intro": "Für die hier betrachteten C/H/O-Strukturen gilt am betrachteten C: jede C–H-Bindung −1, jede C–O-Einfachbindung +1, jede C=O-Doppelbindung +2 und jede C–C-Bindung 0. Addiere nur die Beiträge der direkt gebundenen Nachbarn.", "q": [{"id": "rx14", "text": "Bestimme die Oxidationszahl der beiden C-Atome in Ethanol.", "choices": [], "answer": [1, 3], "ok": "CH₃-C: −III. CH₂OH-C: zwei C–H (−2), eine C–O (+1), eine C–C (0), insgesamt −I.", "bad": "Die beiden C-Atome haben unterschiedliche direkte Nachbarn.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Zähle C–H und C–O für jedes C getrennt."], "formula": "CH₃–CH₂–OH", "type": "match", "matchLabels": ["C der CH₃-Gruppe", "C der CH₂OH-Gruppe"], "matchChoices": ["−IV", "−III", "−II", "−I", "0", "+I", "+II", "+III", "+IV"]}, {"id": "rx15", "text": "Bestimme die Oxidationszahl des funktionellen C-Atoms.", "choices": [], "answer": [5, 7], "ok": "Ethanal: +2 für C=O und −1 für C–H ergibt +I. Ethansäure: +2 für C=O und +1 für C–O ergibt +III.", "bad": "Die OH-Bindung wird nicht als C–H-Bindung gezählt.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Prüfe ausschließlich die Bindungen direkt am betrachteten C."], "formula": "", "type": "match", "matchLabels": ["Carbonyl-C in Ethanal CH₃–CHO", "Carboxyl-C in Ethansäure CH₃–COOH"], "matchChoices": ["−IV", "−III", "−II", "−I", "0", "+I", "+II", "+III", "+IV"]}, {"id": "rx16", "text": "Welche Oxidationszahl hat das mittlere C in Propan-2-ol?", "choices": ["−II", "0", "+II"], "answer": 1, "ok": "Eine C–H-Bindung (−1) und eine C–O-Bindung (+1) heben sich auf; C–C trägt 0 bei.", "bad": "Das H in der OH-Gruppe ist nicht direkt an C gebunden.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Vergleiche die direkte C–H- mit der C–O-Bindung."], "formula": "CH₃–CH(OH)–CH₃"}, {"id": "rx17", "text": "Welche Oxidationszahl hat das Carbonyl-C in Propanon?", "choices": ["0", "+I", "+II"], "answer": 2, "ok": "Die C=O-Doppelbindung trägt +2 bei; die beiden C–C-Bindungen jeweils 0.", "bad": "Das Carbonyl-C trägt hier kein H.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Zähle die Doppelbindung als zwei Bindungsbeiträge."], "formula": "CH₃–C(=O)–CH₃"}, {"id": "rx18", "text": "Warum ist die durchschnittliche C-Oxidationszahl −II in Ethanol keine Zuordnung für jedes einzelne C-Atom?", "choices": ["Weil die C-Atome tatsächlich −III und −I haben", "Weil jedes C in Ethanol 0 hat", "Weil H hier immer −I hat"], "answer": 0, "ok": "Der Mittelwert aus −III und −I ist −II; die einzelnen C-Atome besitzen unterschiedliche Umgebungen.", "bad": "Für Reaktionswege ist häufig das funktionelle C-Atom entscheidend.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Unterscheide Mittelwert und konkrete Atomposition."], "formula": ""}], "explainer": "<div class=\"module-goal\"><strong>Bindungen am C zählen</strong><strong>C–H: −1</strong> · <strong>C–O: +1</strong> · <strong>C=O: +2</strong> · <strong>C–C: 0</strong>. Die O–H-Bindung selbst ist keine Bindung des betrachteten C-Atoms.</div>", "redoxExplorer": false}, {"title": "Alkohole und Carbonylverbindungen", "intro": "Primäre Alkohole können zu Aldehyden und weiter zu Carbonsäuren oxidiert werden; geeignete Bedingungen und Oxidationsmittel bestimmen, wie weit die Reaktion geht. Sekundäre Alkohole können zu Ketonen oxidiert werden.", "q": [{"id": "rx19", "text": "Welche Produktklasse passt zur schonenden Oxidation?", "choices": [], "answer": [0, 1], "ok": "Primär → Aldehyd; sekundär → Keton. Primäre Alkohole können weiter zu Carbonsäuren oxidiert werden.", "bad": "Prüfe die Anzahl der C-Reste am OH-tragenden C.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Ein primärer Alkohol trägt dort zwei H, ein sekundärer eines."], "formula": "", "type": "match", "matchLabels": ["Primärer Alkohol", "Sekundärer Alkohol"], "matchChoices": ["Aldehyd", "Keton"]}, {"id": "rx20", "text": "Wie verändert sich die Oxidationszahl des funktionellen C bei Ethanol → Ethanal?", "choices": ["−I → +I: Oxidation", "+I → −I: Reduktion", "−III → −III: keine Änderung"], "answer": 0, "ok": "Die Oxidationszahl steigt um zwei. Die CH₃-Gruppe bleibt bei diesem Schritt unverändert.", "bad": "Vergleiche das C, das die funktionelle Gruppe trägt.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "CH₂OH wird zu CHO."], "formula": ""}, {"id": "rx21", "text": "Welche Aussage beschreibt tertiäre Alkohole unter den üblichen milden Bedingungen der Alkoholoxidation?", "choices": ["Sie ergeben stets ein Keton bei unverändertem C-Gerüst", "Eine entsprechende Carbonylbildung bei unverändertem C-Gerüst ist nicht möglich; am OH-tragenden C fehlt H", "Sie können unter keinen Bedingungen reagieren"], "answer": 1, "ok": "Am OH-tragenden C fehlt eine C–H-Bindung. Unter stärkeren Bedingungen können andere Reaktionen, etwa mit C–C-Spaltung, auftreten.", "bad": "Die Aussage betrifft die übliche milde Oxidation bei erhaltenem C-Gerüst.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektron
