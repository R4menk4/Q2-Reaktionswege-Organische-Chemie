id": "rx24", "text": "Gleiche die Gesamtreaktion von Zink mit Kupfer(II)-Ionen aus.", "choices": [], "answer": [1, 1, 1, 1], "ok": "Zn + Cu²⁺ → Zn²⁺ + Cu. Atome und Gesamtladung +2 stimmen.", "bad": "Prüfe jede Atomart und die Gesamtladung. Trage die kleinsten positiven ganzen Koeffizienten ein, auch die 1.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Zn gibt zwei Elektronen ab; Cu²⁺ nimmt zwei auf."], "formula": "", "type": "balance", "left": [{"formula": "Zn", "atoms": {"Zn": 1}, "charge": 0}, {"formula": "Cu²⁺", "atoms": {"Cu": 1}, "charge": 2}], "right": [{"formula": "Zn²⁺", "atoms": {"Zn": 1}, "charge": 2}, {"formula": "Cu", "atoms": {"Cu": 1}, "charge": 0}]}, {"id": "rx25", "text": "Ergänze die Oxidations-Teilgleichung Ethanol → Ethanal in saurer Lösung.", "choices": [], "answer": [1, 1, 2, 2], "ok": "CH₃CH₂OH → CH₃CHO + 2 H⁺ + 2 e⁻. Die Ladung rechts ist +2 − 2 = 0.", "bad": "Prüfe jede Atomart und die Gesamtladung. Trage die kleinsten positiven ganzen Koeffizienten ein, auch die 1.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Ethanol enthält zwei H-Atome mehr als Ethanal. Die Elektronen stehen bei Oxidation rechts."], "formula": "", "type": "balance", "left": [{"formula": "CH₃CH₂OH", "atoms": {"C": 2, "H": 6, "O": 1}, "charge": 0}], "right": [{"formula": "CH₃CHO", "atoms": {"C": 2, "H": 4, "O": 1}, "charge": 0}, {"formula": "H⁺", "atoms": {"H": 1}, "charge": 1}, {"formula": "e⁻", "atoms": {}, "charge": -1}]}, {"id": "rx26", "text": "Gleiche die Gesamtreaktion von Ethanol mit Kupfer(II)-oxid aus.", "choices": [], "answer": [1, 1, 1, 1, 1], "ok": "CH₃CH₂OH + CuO → CH₃CHO + Cu + H₂O. Ethanol wird oxidiert; Cu(+II) wird zu Cu(0) reduziert.", "bad": "Prüfe jede Atomart und die Gesamtladung. Trage die kleinsten positiven ganzen Koeffizienten ein, auch die 1.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Die zwei H-Atome des Alkohols bilden mit dem O aus CuO Wasser."], "formula": "", "type": "balance", "left": [{"formula": "CH₃CH₂OH", "atoms": {"C": 2, "H": 6, "O": 1}, "charge": 0}, {"formula": "CuO", "atoms": {"Cu": 1, "O": 1}, "charge": 0}], "right": [{"formula": "CH₃CHO", "atoms": {"C": 2, "H": 4, "O": 1}, "charge": 0}, {"formula": "Cu", "atoms": {"Cu": 1}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}]}, {"id": "rx27", "text": "Wo dürfen Elektronen nach dem Zusammenfassen einer vollständigen Redoxgesamtgleichung stehen?", "choices": ["Sie müssen übrig bleiben", "Sie werden nach dem Angleichen der Teilgleichungen vollständig gekürzt", "Sie werden zu H₂O umgeschrieben"], "answer": 1, "ok": "In der Gesamtgleichung der gekoppelten Redoxreaktion heben sich abgegebene und aufgenommene Elektronen auf.", "bad": "Die Elektronenübertragung wird in den Teilgleichungen sichtbar.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Gleiche erst die Elektronenzahlen an."], "formula": ""}], "explainer": "", "redoxExplorer": false}, {"title": "Dein Abschlusscheck", "intro": "Bestimme Oxidationszahlen, erkenne Reaktionswege und prüfe die Elektronenbilanz.", "q": [{"id": "rx28", "text": "Ordne die Änderung ein.", "choices": [], "answer": [0, 1], "ok": "Anstieg: Oxidation. Abnahme: Reduktion.", "bad": "Betrachte die Richtung, nicht nur das Vorzeichen.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Vergleiche vorher und nachher."], "formula": "", "topic": 1, "type": "match", "matchLabels": ["Funktionelles C: −I → +I", "Cu: +II → 0"], "matchChoices": ["Oxidation", "Reduktion"]}, {"id": "rx29", "text": "Bestimme die Oxidationszahlen der funktionellen C-Atome.", "choices": [], "answer": [3, 5, 7], "ok": "Die Oxidationsreihe am funktionellen C lautet −I → +I → +III.", "bad": "Zähle die direkten C–H- und C–O-Bindungen.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "C=O zählt doppelt."], "formula": "", "topic": 3, "type": "match", "matchLabels": ["Ethanol: CH₂OH-C", "Ethanal: CHO-C", "Ethansäure: COOH-C"], "matchChoices": ["−IV", "−III", "−II", "−I", "0", "+I", "+II", "+III", "+IV"]}, {"id": "rx30", "text": "Was entsteht bei schonender Oxidation von Propan-2-ol mit geeignetem Oxidationsmittel?", "choices": ["Propanal", "Propanon", "Immer Propansäure"], "answer": 1, "ok": "Der sekundäre Alkohol ergibt das Keton Propanon.", "bad": "Das OH-tragende C hat zwei C-Nachbarn.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Sekundärer Alkohol → Keton."], "formula": "", "topic": 4}, {"id": "rx31", "text": "Ergänze die formale Oxidations-Teilgleichung Ethanal → Ethansäure in saurer Lösung.", "choices": [], "answer": [1, 1, 1, 2, 2], "ok": "CH₃CHO + H₂O → CH₃COOH + 2 H⁺ + 2 e⁻. Atome und Gesamtladung sind ausgeglichen.", "bad": "Prüfe jede Atomart und die Gesamtladung. Trage die kleinsten positiven ganzen Koeffizienten ein, auch die 1.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Wasser liefert das zusätzliche O-Atom; zwei Protonen und zwei Elektronen gleichen H und Ladung aus."], "formula": "", "topic": 5, "type": "balance", "left": [{"formula": "CH₃CHO", "atoms": {"C": 2, "H": 4, "O": 1}, "charge": 0}, {"formula": "H₂O", "atoms": {"H": 2, "O": 1}, "charge": 0}], "right": [{"formula": "CH₃COOH", "atoms": {"C": 2, "H": 4, "O": 2}, "charge": 0}, {"formula": "H⁺", "atoms": {"H": 1}, "charge": 1}, {"formula": "e⁻", "atoms": {}, "charge": -1}]}, {"id": "rx32", "text": "Wer ist das Oxidationsmittel bei CH₃CH₂OH + CuO → CH₃CHO + Cu + H₂O?", "choices": ["Ethanol", "Kupfer(II)-oxid", "Ethanal"], "answer": 1, "ok": "CuO oxidiert Ethanol; sein Cu wird dabei von +II auf 0 reduziert.", "bad": "Das Oxidationsmittel wird selbst reduziert.", "hints": ["Oxidation: Elektronenabgabe bzw. steigende Oxidationszahl. Reduktion: Elektronenaufnahme bzw. sinkende Oxidationszahl.", "Verfolge die Oxidationszahl von Cu."], "formula": "", "topic": 1}], "explainer": "", "redoxExplorer": false}], "goal": "Ich kann Oxidation und Reduktion erkennen, Oxidationszahlen einzelner C-Atome bestimmen und einfache organische Redoxreaktionen bilanzieren.", "tagline": "Elektronen verfolgen · Oxidationszahlen bestimmen · Reaktionswege erkennen", "transfer": "Zeichne Ethanol, Ethanal und Ethansäure. Markiere jeweils das funktionelle C, bestimme seine Oxidationszahl und erkläre die beiden Oxidationsschritte.", "success": "Du erkennst die Elektronenbilanz von Redoxreaktionen und kannst die Oxidationsreihe primärer Alkohole sowie die Ketonbildung aus sekundären Alkoholen begründen."};
moduleDefinitions.saeurebase={"title": "Säuren und Basen", "names": ["Startcheck", "Protonen übertragen", "Säure-Base-Paare", "Organische Beispiele", "Stärke & pH", "Protolysebilanz", "Abschlusscheck"], "sections": [{"title": "Wer gibt ein Proton ab?", "intro": "Prüfe dein Vorwissen zu Protonen, Säuren und Basen. Im Modul verwenden wir das Brønsted-Konzept.", "q": [{"id": "sb01", "text": "Was ist eine Brønsted-Säure?", "choices": ["Ein Protonendonator", "Ein Elektronendonator", "Immer ein negativ geladenes Ion"], "answer": 0, "ok": "Eine Brønsted-Säure kann ein Proton H⁺ abgeben.", "bad": "Protonenübertragung und Elektronenübertragung sind unterschiedliche Konzepte.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Donator bedeutet Geber."], "formula": ""}, {"id": "sb02", "text": "Was ist eine Brønsted-Base?", "choices": ["Ein Stoff, der nur OH⁻ enthalten kann", "Ein Protonenakzeptor", "Ein Stoff ohne Elektronen"], "answer": 1, "ok": "Eine Brønsted-Base kann ein Proton aufnehmen. NH₃ ist z. B. eine Base ohne OH-Gruppe.", "bad": "Die Brønsted-Definition hängt nicht vom Vorhandensein einer OH-Gruppe ab.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Akzeptor bedeutet Aufnehmer."], "formula": ""}, {"id": "sb03", "text": "Welches Teilchen beschreibt in wässriger Lösung ein protoniertes Wassermolekül?", "choices": ["H₃O⁺", "O₂", "H₂"], "answer": 0, "ok": "H₃O⁺ ist das Oxoniumion. Es stellt ein hydratisiertes Proton vereinfacht dar.", "bad": "H⁺ liegt im Wasser nicht als isoliertes nacktes Proton vor.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Wasser nimmt H⁺ auf und erhält ein zusätzliches H."], "formula": ""}], "explainer": "", "acidExplorer": false}, {"title": "Protonenübertragung erkennen", "intro": "Bei einer Protolyse gibt ein Partner H⁺ ab und der andere nimmt es auf. Säure und Base werden durch ihre Rolle in der jeweiligen Reaktion bestimmt.", "q": [{"id": "sb04", "text": "Ordne die Rollen für die Reaktion mit Wasser zu.", "choices": [], "answer": [0, 1], "ok": "HCl gibt ein Proton ab; Wasser nimmt es auf.", "bad": "Vergleiche die Formeln vor und nach der Übertragung.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "HCl wird zu Cl⁻, Wasser zu H₃O⁺."], "formula": "", "type": "match", "matchLabels": ["HCl in HCl + H₂O → Cl⁻ + H₃O⁺", "H₂O in HCl + H₂O → Cl⁻ + H₃O⁺"], "matchChoices": ["Säure: gibt H⁺ ab", "Base: nimmt H⁺ auf"]}, {"id": "sb05", "text": "Welche Teilchenänderung ist eine Protonenaufnahme?", "choices": ["NH₃ → NH₄⁺", "NH₄⁺ → NH₃", "Cu²⁺ → Cu"], "answer": 0, "ok": "NH₃ nimmt H⁺ auf und wird zu NH₄⁺.", "bad": "Cu²⁺ → Cu ist eine Reduktion; NH₄⁺ → NH₃ eine Protonenabgabe.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Vergleiche H-Anzahl und Ladung."], "formula": ""}, {"id": "sb06", "text": "Welche Rolle hat Wasser in dieser Reaktion?", "choices": ["Säure", "Base", "Oxidationsmittel"], "answer": 0, "ok": "Wasser gibt ein Proton an NH₃ ab und wird zu OH⁻: Es wirkt als Säure.", "bad": "Die Rolle von Wasser hängt vom Partner ab.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "H₂O wird zu OH⁻."], "formula": "NH₃ + H₂O ⇌ NH₄⁺ + OH⁻"}, {"id": "sb07", "text": "Welche Aussage unterscheidet Protolyse und Redoxreaktion?", "choices": ["Bei einer Protolyse wird H⁺ übertragen; bei einer Redoxreaktion werden Elektronen übertragen bzw. Oxidationszahlen verändert", "Jede Protonenaufnahme ist eine Reduktion", "Jede Säure ist ein Oxidationsmittel"], "answer": 0, "ok": "Eine reine Protolyse wird durch die Protonenübertragung beschrieben, ohne Änderung der Oxidationszahlen.", "bad": "Eine Änderung der Ionenladung durch H⁺-Aufnahme ist nicht automatisch eine Reduktion.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Ein Proton ist kein Elektron."], "formula": ""}], "explainer": "<div class=\"module-goal\"><strong>Wasser kann beide Rollen übernehmen</strong>Gegenüber HCl nimmt Wasser H⁺ auf, gegenüber NH₃ gibt es H⁺ ab. Ein Teilchen, das sowohl als Säure als auch als Base reagieren kann, heißt Ampholyt.</div>", "acidExplorer": false}, {"title": "Korrespondierende Säure-Base-Paare", "intro": "Gibt eine Säure H⁺ ab, entsteht ihre korrespondierende Base. Nimmt eine Base H⁺ auf, entsteht ihre korrespondierende Säure. Die beiden Partner unterscheiden sich um genau ein H⁺ und damit um eine Ladungseinheit.", "q": [{"id": "sb08", "text": "Ordne die korrespondierende Base zu.", "choices": [], "answer": [0, 1, 2], "ok": "Nach Abgabe eines H⁺ entstehen H₂O, Ethanoat und NH₃.", "bad": "Entferne genau ein Proton, nicht ein neutrales H-Atom.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Die Ladung wird jeweils um eins kleiner."], "formula": "", "type": "match", "matchLabels": ["H₃O⁺", "CH₃COOH", "NH₄⁺"], "matchChoices": ["H₂O", "CH₃COO⁻", "NH₃"]}, {"id": "sb09", "text": "Welches Paar ist ein korrespondierendes Säure-Base-Paar?", "choices": ["NH₄⁺ / NH₃", "H₃O⁺ / OH⁻", "CH₃COOH / H₂O"], "answer": 0, "ok": "NH₄⁺ und NH₃ unterscheiden sich um ein H⁺.", "bad": "H₃O⁺ und OH⁻ unterscheiden sich um zwei Protonen; sie sind nicht direkt korrespondierend.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Vergleiche H-Anzahl und Ladung."], "formula": ""}, {"id": "sb10", "text": "Welche korrespondierende Säure entsteht aus OH⁻?", "choices": ["H₂O", "H₃O⁺", "O₂"], "answer": 0, "ok": "OH⁻ + H⁺ ergibt H₂O.", "bad": "Es wird genau ein Proton aufgenommen.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Ein zusätzliches H erhöht die Ladung von −1 auf 0."], "formula": ""}, {"id": "sb11", "text": "Finde die beiden Paare in der Ethansäure-Protolyse.", "choices": [], "answer": [0, 1], "ok": "CH₃COOH/CH₃COO⁻ und H₃O⁺/H₂O sind die beiden korrespondierenden Paare.", "bad": "Edukt und Produkt desselben Paars unterscheiden sich um H⁺.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Ethansäure gibt H⁺ ab, Wasser nimmt H⁺ auf."], "formula": "CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺", "type": "match", "matchLabels": ["Partner von CH₃COOH", "Partner von H₂O"], "matchChoices": ["CH₃COO⁻", "H₃O⁺"]}, {"id": "sb12", "text": "Warum kann Wasser in zwei verschiedenen Paaren vorkommen?", "choices": ["Es kann H⁺ aufnehmen oder abgeben", "Es hat je nach Partner eine andere Summenformel", "Es muss bei jeder Reaktion oxidiert werden"], "answer": 0, "ok": "Wasser gehört als Base zu H₃O⁺/H₂O und als Säure zu H₂O/OH⁻.", "bad": "Seine Rolle wechselt; das Ausgangsteilchen bleibt H₂O.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Denke an den Ampholyten Wasser."], "formula": ""}], "explainer": "<div class=\"module-goal\"><strong>Ein Proton, eine Ladungseinheit</strong>Säure → korrespondierende Base + H⁺. Bei Abgabe wird die Ladung um eins kleiner; bei Aufnahme um eins größer. Korrespondierend bedeutet nicht einfach „irgendeine Säure plus irgendeine Base“.</div>", "acidExplorer": false}, {"title": "Carbonsäuren und organische Basen", "intro": "Ethansäure kann das H der Carboxyl-OH-Gruppe abgeben. Es entsteht das Carboxylat-Ion Ethanoat. Organische Moleküle können auch Protonen aufnehmen, z. B. Amine am N oder Alkohole am O mit einem geeigneten Säurepartner.", "q": [{"id": "sb13", "text": "Welches H wird bei der typischen Protolyse von Ethansäure abgegeben?", "choices": ["Das H der Carboxyl-OH-Gruppe", "Alle drei H der CH₃-Gruppe gleichzeitig", "Das C-Atom der Carboxylgruppe"], "answer": 0, "ok": "Die O–H-Gruppe innerhalb von –COOH liefert hier das Proton.", "bad": "Die CH₃-Gruppe bleibt bei dieser Protolyse erhalten.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Unterscheide C–H und O–H."], "formula": "CH₃–C(=O)–OH"}, {"id": "sb14", "text": "Welches Teilchen entsteht nach Abgabe dieses Protons?", "choices": ["CH₃COO⁻", "CH₃COOH₂⁺", "CH₄"], "answer": 0, "ok": "Ethanoat CH₃COO⁻ ist die korrespondierende Base der Ethansäure.", "bad": "Ein H⁺ weniger ergibt eine um eins negativere Ladung.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Die beiden O-Atome bleiben erhalten."], "formula": ""}, {"id": "sb15", "text": "Warum ist eine Carbonsäure deutlich saurer als ein vergleichbarer Alkohol?", "choices": ["Das Carboxylat-Ion wird durch Delokalisierung der negativen Ladung über beide O-Atome stabilisiert", "Carbonsäuren besitzen grundsätzlich mehr H-Atome", "Jede C–H-Bindung ist eine starke Säure"], "answer": 0, "ok": "Die Stabilisierung der korrespondierenden Base begünstigt die Protonenabgabe.", "bad": "Nicht die Gesamtzahl der H-Atome bestimmt die Säurestärke.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Vergleiche Carboxylat und Alkoholat."], "formula": "Carbonsäure: R–COOH · Alkohol: R–OH"}, {"id": "sb16", "text": "Wo kann Methylamin ein Proton aufnehmen?", "choices": ["Am N-Atom über sein freies Elektronenpaar", "Nur an der CH₃-Gruppe", "Gar nicht, weil keine OH-Gruppe vorhanden ist"], "answer": 0, "ok": "Das N nimmt H⁺ auf; es entsteht CH₃NH₃⁺.", "bad": "Eine Base muss keine OH-Gruppe enthalten.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Prüfe das freie Elektronenpaar am N."], "formula": "CH₃–NH₂"}, {"id": "sb17", "text": "Was entsteht bei Protonierung von Ethanol am O-Atom?", "choices": ["CH₃CH₂OH₂⁺", "CH₃CHO", "CH₃COO⁻"], "answer": 0, "ok": "Das O nimmt ein Proton auf. Es entsteht protoniertes Ethanol, keine Carbonylverbindung.", "bad": "Protonierung ist hier keine Alkoholoxidation.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Ein H⁺ kommt dazu; die Ladung steigt von 0 auf +1."], "formula": "CH₃CH₂OH + H₃O⁺ ⇌ CH₃CH₂OH₂⁺ + H₂O"}], "explainer": "<div class=\"module-goal\"><strong>Struktur und Reaktionspartner zählen</strong>Eine OH-Gruppe allein bedeutet nicht, dass eine wässrige Lösung stark sauer oder basisch ist. Alkohol, Carbonsäure und Hydroxid-Ion haben unterschiedliche Strukturen und Rollen.</div>", "acidExplorer": true}, {"title": "Säurestärke, Konzentration und pH", "intro": "Säurestärke beschreibt die Neigung zur Protonenabgabe an einen bestimmten Partner. Konzentration beschreibt, wie viel Stoff in einem Volumen vorliegt. Der pH hängt von der Oxoniumionen-Aktivität ab; bei verdünnten Lösungen kann man näherungsweise ihre Konzentration verwenden.", "q": [{"id": "sb18", "text": "Welche Aussage unterscheidet Säurestärke und Konzentration?", "choices": ["Eine konzentrierte Säure ist immer eine starke Säure", "Eine schwache Säure kann konzentriert, eine starke Säure verdünnt vorliegen", "Beide Begriffe bedeuten dasselbe"], "answer": 1, "ok": "Stärke ist eine Eigenschaft des Säure-Base-Gleichgewichts; Konzentration eine Mengenangabe der Lösung.", "bad": "Die Menge allein legt die Neigung zur Protonenabgabe nicht fest.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Eine Stoffeigenschaft und eine Lösungszusammensetzung sind unterschiedlich."], "formula": ""}, {"id": "sb19", "text": "Was bedeutet „Ethansäure ist in Wasser eine schwache Säure“?", "choices": ["Sie gibt in Wasser praktisch nie ein Proton ab", "In einer üblichen wässrigen Lösung liegt nur ein Teil als Ethanoat und Oxoniumionen vor", "Ihre Lösung hat immer pH 7"], "answer": 1, "ok": "Die Protolyse ist ein Gleichgewicht. Der Anteil hängt auch von Konzentration und Bedingungen ab.", "bad": "Schwach bedeutet weder keine Reaktion noch stets neutral.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Beachte den Gleichgewichtspfeil."], "formula": "CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺"}, {"id": "sb20", "text": "Welche Aussage gilt für eine neutrale wässrige Lösung?", "choices": ["Oxonium- und Hydroxidionen haben gleiche Konzentrationen; bei 25 °C liegt pH ungefähr bei 7", "Sie enthält gar keine Ionen", "Ihr pH ist bei jeder Temperatur genau 7"], "answer": 0, "ok": "Neutralität bedeutet gleiche Konzentrationen von H₃O⁺ und OH⁻. Der neutrale pH ist temperaturabhängig.", "bad": "Auch reines Wasser enthält durch Autoprotolyse Ionen.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "„Neutral“ und „ionenfrei“ sind nicht gleichbedeutend."], "formula": ""}, {"id": "sb21", "text": "Kannst du allein aus „starke Säure“ den pH einer Lösung eindeutig bestimmen?", "choices": ["Ja, ohne Mengenangabe", "Nein, dazu sind Konzentration und weitere Bedingungen nötig", "Ja, der pH ist immer 0"], "answer": 1, "ok": "Säurestärke allein liefert keinen eindeutigen pH.", "bad": "Auch eine starke Säure kann stark verdünnt sein.", "hints": ["Verfolge ein H⁺: Wer gibt es ab, wer nimmt es auf? Korrespondierende Partner unterscheiden sich um genau ein Proton.", "Du brauchst Informationen zur Lösung."], "formula": "" function rail(){const count=sections.flatMap(section=>section.q).filter(q=>state.done[q.id]).length;return `<aside class="rail"><div class="brand"><span class="brandmark" aria-hidden="true">⚗</span><div><p class="course">Chemie GK Q2</p><strong>${activeDefinition().title}</strong></div></div><div class="progress-label"><span>Dein Lernweg</span><strong>${count} von ${taskTotal}</strong></div><div class="track" role="progressbar" aria-label="Richtig gelöste Aufgaben" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${taskTotal}"><div class="fill" style="width:${100*count/taskTotal}%"></div></div><nav class="steps" aria-label="Abschnitte">${names.map((n,i)=>`<button data-section="${i}" ${i===state.s?'class="chosen" aria-current="step"':''}><span class="step-no">${i+1}</span><span>${n}</span></button>`).join('')}</nav><p class="rail-note">Lerne in deinem eigenen Tempo. Du kannst jeden Abschnitt direkt öffnen. Dein Fortschritt wird auf diesem Gerät gespeichert.</p></aside>`;}
function topbar(){return `<div class="topbar"><button data-page="prior">← Vorwissen</button><p>${activeDefinition().tagline}</p><div class="row"><button class="knowledge-link" data-book="${state.activeModule}">Wissen nachlesen →</button><button class="reset-button" data-reset="${state.activeModule}" aria-label="Lernfortschritt zurücksetzen – Modul ${activeDefinition().title}">Lernfortschritt zurücksetzen</button><button data-page="home">Startseite</button></div></div>`;}
function current(){return sections[state.s].q[state.q];}
function normalizeName(value){return String(value).trim().toLowerCase().normalize('NFKC').replace(/[–—−]/g,'-').replace(/\s+/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');}
function isCorrect(q){if(q.type==='multi'){const v=state.answers[q.id];return Array.isArray(v)&&v.length===q.answer.length&&q.answer.every(i=>v.includes(i));}if(q.type==='gaps')return Array.isArray(state.answers[q.id])&&q.answer.every((a,i)=>[a,...(q.gapAliases[i]||[])].some(x=>normalGap(x)===normalGap(state.answers[q.id][i]??'')));if(q.type==='order'||q.type==='classify')return Array.isArray(state.answers[q.id])&&q.answer.every((a,i)=>state.answers[q.id][i]===a);if(q.type==='charges'||q.type==='match'||q.type==='balance')return Array.isArray(state.answers[q.id])&&state.answers[q.id].length===q.answer.length&&q.answer.every((sign,i)=>state.answers[q.id][i]===sign);if(q.type==='text')return [q.answer,...(q.aliases||[])].some(name=>normalizeName(state.answers[q.id]??'')===normalizeName(name));return q.type==='builder'?buildValues(q).length===q.target.length&&buildValues(q).every((v,i)=>v===q.target[i]):q.type==='number'?String(state.answers[q.id]??'').trim()===String(q.answer):state.answers[q.id]===q.answer;}
function isomerPair(q){return `<div class="isomer-pairs">${q.isomerPairs.map(p=>`<figure><figcaption>${esc(p.label)}</figcaption><div class="isomer-notation" role="img" aria-label="${esc(p.formula)}">${esc(p.formula)}</div></figure>`).join('')}</div>`;}
function builder(q){if(q.dragHydrogen)return hydrogenTask(q);const g=graphFor(q),v=buildValues(q);return `<div id="chem-builder-picture">${svg(builderM(v,q))}</div>${g.variable.map((bi,j)=>{const b=g.bonds[bi],index=g.atoms.length+j;return `<div class="counter"><label for="chem-bond-${j}">Bindung ${g.labels[b[0]].split(' ')[0]}–${g.labels[b[1]].split(' ')[0]}</label><select id="chem-bond-${j}" data-bond="${q.id}" data-index="${index}">${[1,2,3].filter(n=>n<3||(g.atoms[b[0]][0]==='C'&&g.atoms[b[1]][0]==='C')).map(n=>`<option value="${n}" ${v[index]===n?'selected':''}>${['','Einfachbindung','Doppelbindung','Dreifachbindung'][n]}</option>`).join('')}</select></div>`;}).join('')}${g.labels.map((label,i)=>`<div class="counter"><span>${label}: ${v[i]} H</span><button data-change="${i}" data-delta="-1" aria-label="Ein H am ${label} entfernen" ${v[i]===0?'disabled':''}>− H</button><button data-change="${i}" data-delta="1" aria-label="Ein H am ${label} ergänzen" ${v[i]>=hLimit(q,i)?'disabled':''}>+ H</button></div>`).join('')}`;}
function module(){const sec=sections[state.s],q=current(),h=state.hints[q.id]||0,count=Object.keys(state.done).filter(k=>state.done[k]).length,total=sections.reduce((n,s)=>n+s.q.length,0);return `<div class="workspace"><div class="stage-head"><p class="kicker">Schritt ${state.s+1} · ${names[state.s]}</p><h2>${sec.title}</h2><p class="soft">${sec.intro}</p></div><div class="stage-body">${state.s===0?'<div class="module-goal"><strong>Dein Ziel</strong>'+activeDefinition().goal+'</div>':''}${sec.explainer?`<details class="lesson-reference"><summary>Merkkasten / Beispiel öffnen</summary>${sec.explainer}</details>`:''}${sec.polarExplorer?polarityExplorer():''}${sec.particleExplorer?particleExplorer():''}${sec.interactionExplorer?interactionExplorer():''}${sec.redoxExplorer?`<details class="lesson-reference"><summary>Oxidationsreihe untersuchen</summary>${redoxExplorer()}</details>`:''}${sec.acidExplorer?`<details class="lesson-reference"><summary>Protonenübertragung untersuchen</summary>${acidExplorer()}</details>`:''}${sec.equilibriumModel?equilibriumExplorer(sec.equilibriumModel):''}${sec.experimentExplorer?experimentExplorer():''}${sec.rules?`<div class="rule"><div>C<br>4 Bindungen</div><div>H<br>1 Bindung</div><div>O<br>2 Bindungen</div><div>N<br>3 Bindungen</div></div><p class="soft">${neutral}</p>`:''}<section class="study" aria-label="Aufgabe"><p class="soft">Aufgabe ${state.q+1} von ${sec.q.length}${state.done[q.id]?' · bereits richtig gelöst':''}</p><h3>${q.text}</h3>${q.testTable?experimentTable(q.testTable):''}${q.isomerPairs?isomerPair(q):''}${q.m?svg(molecules[q.m],q.lewis&&state.checks[q.id]==='ok'):''}${q.particleFigure?particleGraphic(q.particleFigure):''}${q.polarFigure?polarityGraphic(q.polarFigure,false):''}${q.formula?'<div class="class-formula" role="img" aria-label="'+esc(q.formula)+'">'+esc(q.formula)+'</div>':''}${['multi','order','classify','gaps'].includes(q.type)?variedTask(q):q.type==='balance'?balanceTask(q):q.type==='match'?matchTask(q):q.type==='charges'?chargeTask(q):q.type==='text'?`<label for="chem-name-answer">Dein systematischer Name</label><div class="row" style="margin:12px 0"><input id="chem-name-answer" class="name-answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(state.answers[q.id]??'')}"></div><p class="soft">Groß-/Kleinschreibung und Leerzeichen beeinflussen die Auswertung nicht. Setze Kommas und Bindestriche wie in den Beispielen.</p>`:q.type==='group'?groupTask(q):q.type==='builder'?builder(q):q.type==='number'?`<label for="chem-answer">Deine Antwort als Zahl</label><div class="row" style="margin:12px 0"><input id="chem-answer" type="number" min="0" max="30" inputmode="numeric" value="${esc(state.answers[q.id]??'')}" aria-label="Antwort als Zahl"></div>`:`<div class="choices">${displayOrder(q,"choices",q.choices.length).map(i=>{const a=q.choices[i];return `<button data-answer="${i}" aria-pressed="${state.answers[q.id]===i}" class="${state.answers[q.id]===i?'chosen':''}">${a}</button>`;}).join('')}</div>`}<div class="row"><button class="main" data-action="check">Antwort prüfen</button><button data-action="hint" ${h>=2?'disabled':''}>${h?'Weitere Hilfe':'Hilfe'}</button></div>${h?`<div class="hint">${q.hints.slice(0,h).map((x,i)=>`<p>Hilfe ${i+1}: ${x}</p>`).join('')}</div>`:''}${state.checks[q.id]?`<div class="feedback ${state.checks[q.id]==='wrong'?'wrong':''}" role="status" aria-live="polite">${state.checks[q.id]==='empty'?'Beantworte zuerst die Aufgabe vollständig.':state.checks[q.id]==='ok'?'✓ '+q.ok:'Noch nicht richtig. '+q.bad}</div>`:''}</section></div><div class="footer"><button data-action="back" ${state.s===0&&state.q===0?'disabled':''}>← Zurück</button><button data-action="next">${state.q===sec.q.length-1?(state.s===sections.length-1?'Auswertung ansehen →':'Zum nächsten Abschnitt →'):'Nächste Aufgabe →'}</button></div></div>`;}
let particleView='liquid';
function balanceTask(q){const values=state.answers[q.id]||[],species=[...q.left,...q.right];const term=(sp,i)=>`<label class="coefficient-term"><span class="sr-only">Koeffizient für ${esc(sp.formula)} auf der ${i<q.left.length?'Edukt':'Produkt'}seite</span><input type="number" min="1" max="99" step="1" inputmode="numeric" data-coefficient="${i}" value="${esc(values[i]??'')}" aria-label="Koeffizient ${i+1}: ${esc(sp.formula)}"><strong>${esc(sp.formula)}</strong></label>`;const side=(list,start)=>list.map((sp,i)=>(i?'<span aria-hidden="true">+</span>':'')+term(sp,start+i)).join('');return `<p class="soft">Kleinste positive ganze Zahlen · auch die 1 eintragen</p><div class="coefficient-equation">${side(q.left,0)}<span aria-label="${q.reversible?'steht im Gleichgewicht mit':'reagiert zu'}">${q.reversible?'⇌':'→'}</span>${side(q.right,q.left.length)}</div><button data-action="show-balance">Bilanz anzeigen</button><div id="coefficient-balance">${state.build[q.id]?.showBalance?balanceTable(q):''}</div>`;}
function balanceTable(q){const v=state.answers[q.id]||[],all=[...q.left,...q.right],elements=[...new Set(all.flatMap(sp=>Object.keys(sp.atoms)))];const complete=v.length===all.length&&all.every((_,i)=>Number.isInteger(v[i])&&v[i]>0);if(!complete)return '<p class="soft" role="status">Trage zunächst überall positive ganze Koeffizienten ein.</p>';const sum=(list,start,el)=>list.reduce((n,sp,i)=>n+v[start+i]*(el==='Ladung'?sp.charge:(sp.atoms[el]||0)),0);const keys=all.some(sp=>sp.charge)?[...elements,'Ladung']:elements;return `<div class="balance-scroll"><table class="balance-table"><caption>Deine Atom- und Ladungsbilanz</caption><thead><tr><th>Bilanz</th><th>Links</th><th>Rechts</th><th>Vergleich</th></tr></thead><tbody>${keys.map(el=>{const l=sum(q.left,0,el),r=sum(q.right,q.left.length,el);return `<tr><th>${el}</th><td>${l}</td><td>${r}</td><td>${l===r?'gleich':'ungleich'}</td></tr>`;}).join('')}</tbody></table></div><p class="soft">Gleiche Bilanzen prüfen die Erhaltung. Prüfe zusätzlich, ob alle Koeffizienten auf das kleinste ganze Verhältnis gekürzt sind.</p>`;}
function matchTask(q){const values=state.answers[q.id]||[];return `<div class="match-controls">${q.matchLabels.map((label,i)=>`<label for="match-${i}"><span>${esc(label)}</span><select id="match-${i}" data-match="${i}"><option value="">Bitte wählen</option>${displayOrder(q,"match-"+i,q.matchChoices.length).map(j=>{const choice=q.matchChoices[j];return `<option value="${j}" ${values[i]===j?'selected':''}>${esc(choice)}</option>`;}).join('')}</select>${values[i]!==undefined&&values[i]!==''?`<span class="selected-match">${esc(q.matchChoices[values[i]])}</span>`:''}</label>`).join('')}</div>`;}
function experimentTable(t){return `<div class="balance-scroll"><table class="balance-table"><caption>${esc(t.caption)}</caption><thead><tr>${t.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
let experimentView='fair';
function experimentExplorer(){const m={fair:{temp:['20 °C','20 °C'],text:'Temperatur, Ausgangszusammensetzung, Volumen und Messmethode sind gleich. Der Zeitverlauf lässt sich im Modell der Katalysatorzugabe zuordnen.'},confounded:{temp:['20 °C','50 °C'],text:'Temperatur und Katalysatorzugabe unterscheiden sich. Der Zeitverlauf kann nicht allein auf den Katalysator zurückgeführt werden.'},single:{temp:['—','20 °C'],text:'Ein Vergleichsansatz fehlt. Der Zeitverlauf dieses einen Ansatzes zeigt nicht, wie er ohne Katalysator verlaufen wäre.'}}[experimentView];const a=experimentView==='single'?null:[0,26,42,52,58,60],b=[0,50,59,60,60,60],times=[0,2,4,6,8,10];return `<div class="polarity-explorer"><h3>Vergleich prüfen: Geschwindigkeit oder Ausbeute?</h3><div class="row">${[['fair','Gleiche Bedingungen'],['confounded','Temperatur verschieden'],['single','Ohne Vergleichsansatz']].map(([v,t])=>`<button data-experiment-view="${v}" aria-pressed="${experimentView===v}" class="${experimentView===v?'chosen':''}">${t}</button>`).join('')}</div><p><strong>A:</strong> ${a?'ohne Katalysator, '+m.temp[0]:'nicht untersucht'} · <strong>B:</strong> mit Katalysator, ${m.temp[1]}</p>${experimentTable({caption:'Fiktive Daten: Produktanteil / %',headers:['Zeit / min','A','B'],rows:times.map((t,i)=>[String(t),a?String(a[i]):'—',String(b[i])])})}<p class="soft">Die Modellwerte sind didaktisch vorgegeben, keine Messdaten einer realen Veresterung. Der gleiche spätere Produktanteil wird hier als näherungsweiser Endzustand angenommen; eine einzelne letzte Messung würde dies nicht beweisen.</p><p role="status">${m.text}</p></div>`;}
let equilibriumState={a:100,b:0,step:0,catalyst:false};
function equilibriumStep(count){for(let i=0;i<count;i++){const f=equilibriumState.catalyst?2:1,total=equilibriumState.a+equilibriumState.b,change=f*(0.3*equilibriumState.a-0.1*equilibriumState.b);equilibriumState.a-=change;equilibriumState.b=total-equilibriumState.a;equilibriumState.step++;}}
function equilibriumExplorer(kind){if(kind==='energy')return `<div class="polarity-explorer"><h3>Gleiche Endpunkte – unterschiedliche Barrieren</h3><div class="energy-figure" tabindex="0" aria-label="Energieprofil, auf kleinen Bildschirmen horizontal scrollbar"><svg class="energy-profile" viewBox="0 0 540 270" role="img" aria-label="Schematische exotherme Reaktion: katalysierter Weg mit niedrigerer Barriere bei gleichen Anfangs- und Endenergien"><line x1="45" y1="225" x2="490" y2="225"/><line x1="45" y1="225" x2="45" y2="20"/><text x="55" y="20">Energie</text><text x="290" y="258">Reaktionskoordinate →</text><path class="uncatalysed" d="M 65 160 C 130 160 130 40 240 40 S 345 200 465 200"/><path class="catalysed" d="M 65 160 C 145 160 160 115 240 115 S 355 200 465 200"/><text x="65" y="150">Edukte</text><text x="390" y="190">Produkte</text><text x="215" y="30">ohne Katalysator</text><text x="215" y="105" class="catalyst-label">mit Katalysator</text></svg></div><p class="soft">Niedrigere Barriere in beiden Richtungen. Die Energiedifferenz zwischen Edukten und Produkten bleibt unverändert.</p></div>`;const m=equilibriumState,total=m.a+m.b,f=m.catalyst?2:1,hin=0.3*m.a*f,rueck=0.1*m.b*f,fmt=n=>n.toFixed(2).replace('.',',');return `<div class="polarity-explorer"><h3>A ⇌ B: verändere das Modell</h3><div class="row"><button data-equilibrium="step">1 Schritt</button><button data-equilibrium="twenty">20 Schritte</button><button data-equilibrium="a">A hinzufügen (+20)</button><button data-equilibrium="b">B hinzufügen (+20)</button><button data-equilibrium="catalyst" aria-pressed="${m.catalyst}">${m.catalyst?'Katalysator abschalten':'Katalysator zuschalten'}</button><button data-equilibrium="reset">Modell zurücksetzen</button></div><div class="equilibrium-values"><div><strong>A: ${fmt(m.a)}</strong><div class="model-bar"><span style="width:${100*m.a/total}%"></span></div></div><div><strong>B: ${fmt(m.b)}</strong><div class="model-bar"><span style="width:${100*m.b/total}%"></span></div></div></div><p role="status">Modellschritt ${m.step} · Hinumsatz: ${fmt(hin)} · Rückumsatz: ${fmt(rueck)} · ${Math.abs(hin-rueck)<0.01?'Gleichgewicht näherungsweise erreicht.':hin>rueck?'Momentan entsteht netto B.':'Momentan entsteht netto A.'}</p><p class="soft">Modellwerte in frei gewählten Einheiten. Bei der aktuellen Gesamtmenge: A im Gleichgewicht = ${fmt(total/4)}, B = ${fmt(3*total/4)}. Ein Katalysator verdoppelt hier beide Geschwindigkeitsfaktoren; das Verhältnis B/A = 3 bleibt gleich.</p></div>`;}
let acidView='acid';
function acidExplorer(){const models={acid:{before:[['Ethansäure: Säure','CH₃–C(=O)–O<mark>H</mark>'],['Wasser: Base','H₂O']],after:[['Ethanoat: korrespondierende Base','CH₃–COO⁻'],['Oxonium: korrespondierende Säure','H₂O<mark>H</mark>⁺']],text:'Ethansäure gibt das H⁺ der Carboxyl-OH-Gruppe an Wasser ab. CH₃COOH/CH₃COO⁻ und H₃O⁺/H₂O sind die beiden Paare.'},base:{before:[['Ammoniak: Base','NH₃'],['Wasser: Säure','HO–<mark>H</mark>']],after:[['Ammonium: korrespondierende Säure','NH₃<mark>H</mark>⁺'],['Hydroxid: korrespondierende Base','OH⁻']],text:'Wasser gibt H⁺ an Ammoniak ab. NH₄⁺/NH₃ und H₂O/OH⁻ sind die beiden Paare. Wasser wirkt hier als Säure.'},alcohol:{before:[['Ethanol: Base','CH₃–CH₂–OH'],['Oxonium: Säure','H₂O<mark>H</mark>⁺']],after:[['Protoniertes Ethanol: korrespondierende Säure','CH₃–CH₂–OH<mark>H</mark>⁺'],['Wasser: korrespondierende Base','H₂O']],text:'Ethanol kann am O ein Proton aufnehmen. Es entsteht CH₃CH₂OH₂⁺. Diese Protonierung ist keine Oxidation des Alkohols.'}};const m=models[acidView],cards=list=>list.map(c=>`<div class="redox-card"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join('');return `<div class="polarity-explorer"><h3>Ein Proton wechselt den Partner</h3><div class="row">${[['acid','Ethansäure + Wasser'],['base','Ammoniak + Wasser'],['alcohol','Ethanol + Oxonium']].map(([v,t])=>`<button data-acid-view="${v}" aria-pressed="${acidView===v}" class="${acidView===v?'chosen':''}">${t}</button>`).join('')}</div><div class="acid-model"><div class="acid-partners">${cards(m.before)}</div><div class="acid-arrow" aria-label="Protonenübertragung im Gleichgewicht">H⁺-Übertragung ⇌</div><div class="acid-partners">${cards(m.after)}</div></div><p class="soft">Die Markierung verfolgt das übertragene H⁺. Die Schreibweisen H₂OH⁺ und NH₃H⁺ entsprechen H₃O⁺ und NH₄⁺; sie machen das zusätzliche H sichtbar.</p><p role="status">${m.text}</p></div>`;}
let redoxView='primary';
function redoxExplorer(){const paths={primary:{cards:[['Ethanol','CH₃–<mark>CH₂</mark>–OH','−I'],['Ethanal','CH₃–<mark>CH</mark>=O','+I'],['Ethansäure','CH₃–<mark>C</mark>(=O)–OH','+III']],text:'Am markierten C steigt die Oxidationszahl jeweils um zwei. Geeignete Bedingungen entscheiden, ob der Aldehyd erhalten bleibt oder zur Carbonsäure weiteroxidiert wird.'},secondary:{cards:[['Propan-2-ol','CH₃–<mark>CH</mark>(OH)–CH₃','0'],['Propanon','CH₃–<mark>C</mark>(=O)–CH₃','+II']],text:'Das OH-tragende C ist mit zwei C-Resten und einem H verbunden. Bei Oxidation entsteht ein Keton; die Oxidationszahl steigt um zwei.'},tertiary:{cards:[['2-Methylpropan-2-ol','(CH₃)₃<mark>C</mark>–OH','+I']],text:'Das markierte C trägt drei C-Reste und kein H. Unter üblichen milden Bedingungen entsteht daraus keine Carbonylverbindung bei unverändertem C-Gerüst.'}};const path=paths[redoxView];return `<div class="polarity-explorer"><h3>Die Umgebung des funktionellen C entscheidet</h3><div class="row">${[['primary','Primärer Alkohol'],['secondary','Sekundärer Alkohol'],['tertiary','Tertiärer Alkohol']].map(([v,t])=>`<button data-redox-view="${v}" aria-pressed="${redoxView===v}" class="${redoxView===v?'chosen':''}">${t}</button>`).join('')}</div><div class="redox-path">${path.cards.map((c,i)=>`${i?'<span class="redox-step">Oxidation →</span>':''}<div class="redox-card"><strong>${c[0]}</strong><p>${c[1]}</p><span>Oxidationszahl am markierten C: <b>${c[2]}</b></span></div>`).join('')}</div><p class="soft">Die Markierung kennzeichnet jeweils das betrachtete C-Atom. Die Pfeile beschreiben Reaktionswege mit geeignetem Oxidationsmittel.</p><p role="status">${path.text}</p></div>`;}

function bookParagraph(text){return `<p>${text}</p>`;}
function bookNote(title,text){return `<aside class="book-note"><strong>${title}</strong><p>${text}</p></aside>`;}
function bookTable(headers,rows){return `<div class="book-table-scroll" tabindex="0" aria-label="Tabelle, bei Bedarf horizontal scrollbar"><table><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<${i?'td':'th scope="row"'}>${x}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function bookEquation(text){return `<p class="book-equation">${text}</p>`;}
function bookFigure(title,body,caption,w=720,h=300){return `<figure class="book-figure"><div class="book-figure-scroll" tabindex="0" aria-label="Abbildung, bei Bedarf horizontal scrollbar"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${body}</svg></div><figcaption><strong>${title}.</strong> ${caption}</figcaption></figure>`;}
function bt(x,y,text,size=20,color='#17242a',anchor='middle'){return `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}">${esc(text)}</text>`;}
function bl(x1,y1,x2,y2,color='#526c77',dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.5" ${dash?`stroke-dasharray="${dash}"`:''}/>`;}
function ba(x1,y1,x2,y2,color='#078898'){const a=Math.atan2(y2-y1,x2-x1),p=(d,sgn)=>[x2-d*Math.cos(a)+sgn*6*Math.sin(a),y2-d*Math.sin(a)-sgn*6*Math.cos(a)];const p1=p(12,1),p2=p(12,-1);return bl(x1,y1,x2,y2,color)+`<path d="M${p1[0]} ${p1[1]} L${x2} ${y2} L${p2[0]} ${p2[1]}" fill="none" stroke="${color}" stroke-width="2.5"/>`;}
function box(x,y,w,h,text,color='#edf6f8'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${color}" stroke="#bdcfd5"/>`+bt(x+w/2,y+h/2+7,text);}

const knowledgeArticles={
strukturformeln:{lead:'Eine Formel kann Atomzahlen nennen oder zeigen, wie Atome miteinander verbunden sind. Für organische Reaktionen ist besonders wichtig, die Verknüpfung und die Bindungsordnung sicher zu erkennen.',sections:[
['Was eine Strukturformel zeigt',bookParagraph('Organische Moleküle besitzen ein Kohlenstoffgerüst. Daran können H-Atome und weitere Atome, etwa O oder N, gebunden sein. Ein Bindungsstrich steht für ein gemeinsames Elektronenpaar. Zwei oder drei Striche bedeuten eine Doppel- beziehungsweise Dreifachbindung. Die Zeichnung auf Papier zeigt meist die Verknüpfung, nicht die tatsächlichen Bindungswinkel im Raum.')+structureFigure()],
['Bindigkeiten und freie Elektronenpaare',bookParagraph('Für die hier betrachteten typischen neutralen Moleküle bildet C vier Bindungen, H eine, O zwei und N drei. Beim Zählen der Bindungen zählt eine Doppelbindung doppelt und eine Dreifachbindung dreifach. In Ethen erfüllt daher jedes C mit einer C=C-Bindung und zwei C–H-Bindungen seine Bindigkeit.')+bookTable(['Atom','Typische Bindungszahl','Freie Elektronenpaare'],[['H','1','0'],['C','4','0'],['O','2','2'],['N','3','1']])+bookParagraph('In einer Lewis-Formel werden auch freie Elektronenpaare als Punkte oder kurze Striche dargestellt. Für diese Beispiele erreicht H eine besetzte Außenschale mit zwei Elektronen; C, N und O erreichen in der üblichen Elektronenpaarbeschreibung acht Außenelektronen. Bei Ionen und Radikalen gelten zusätzliche Regeln.')+svg(molecules.ethanol,true)],
['Halbstruktur- und Skelettformeln lesen',bookParagraph('Die Halbstrukturformel CH₃–CH₂–OH fasst an C gebundene H-Atome zu Gruppen zusammen. Klammern kennzeichnen Seitenzweige: In CH₃–CH(CH₃)–CH₃ hängt am mittleren C eine weitere CH₃-Gruppe. Die Schreibweise –CHO steht für –C(=O)–H; –COOH bedeutet –C(=O)–OH.')+bookParagraph('In einer Skelettformel sind C-Symbole und die an C gebundenen H-Atome weggelassen. Jeder Knick und jedes unbeschriftete Linienende steht für ein C-Atom. Ergänze dort gedanklich so viele H, dass C vier Bindungen bildet. Andere Atome werden angeschrieben. Ein H an O oder N wird in den hier verwendeten Formeln ausdrücklich gezeigt.')],
['Vom Gerüst zur vollständigen Formel',bookParagraph('Zuerst wird das C-Gerüst mit seinen Seitenzweigen gezeichnet. Danach kommen funktionelle Gruppen und Mehrfachbindungen hinzu. Erst anschließend werden die fehlenden H-Atome ergänzt. Am Ende prüft man jedes Atom einzeln und zählt die Gesamtzahl der Atome.')+bookNote('Durchgerechnetes Beispiel: Ethanal','CH₃–CHO wird als CH₃–C(=O)–H gelesen. Das Carbonyl-C besitzt eine Einfachbindung zum Nachbar-C, eine Doppelbindung zu O und eine Einfachbindung zu H: insgesamt vier Bindungen. Das Molekül hat die Summenformel C₂H₄O.')],
['Typischer Denkfehler',bookParagraph('Dieselbe Summenformel kann zu verschiedenen Strukturen gehören. C₂H₆O beschreibt sowohl Ethanol als auch Dimethylether. Aus der Atomzahl allein lassen sich die funktionelle Gruppe und die Verknüpfung nicht ablesen.')]
]},
stoffklassen:{lead:'Die funktionelle Gruppe und ihre Umgebung bestimmen, zu welcher Stoffklasse eine Verbindung gehört. Sie liefern zugleich erste Hinweise auf Eigenschaften und mögliche Reaktionen.',sections:[

['Stoffklassen im Überblick',bookTable(['Stoffklasse','Kennzeichen','Beispiel'],[['Alkane','Nur C und H; ausschließlich Einfachbindungen','CH₃–CH₃ · Ethan'],['Alkene','Kohlenwasserstoffe mit C=C','CH₂=CH₂ · Ethen'],['Alkine','Kohlenwasserstoffe mit C≡C','HC≡CH · Ethin'],['Halogenalkane','Halogen an gesättigtem C','CH₃–CH₂–Br · Bromethan'],['Alkohole','–OH an gesättigtem C','CH₃–CH₂–OH · Ethanol'],['Ether','R–O–R′','CH₃–O–CH₃ · Dimethylether'],['Aldehyde','–C(=O)–H','CH₃–CHO · Ethanal'],['Ketone','R–C(=O)–R′','CH₃–CO–CH₃ · Propanon'],['Carbonsäuren','–C(=O)–OH','CH₃–COOH · Ethansäure'],['Ester','–C(=O)–O–R′','CH₃–COO–CH₃ · Methylethanoat'],['Amine','N an organischem Rest, z. B. –NH₂','CH₃–NH₂ · Methylamin']])],
['Sauerstoffhaltige Verbindungen unterscheiden',bookParagraph('Suche zunächst nach C=O. Ist am Carbonyl-C ein H gebunden, liegt eine Aldehydgruppe vor; beim einfachsten Aldehyd Methanal sind es zwei H. Sind dort zwei C-Reste gebunden, handelt es sich um eine Ketongruppe. Die Kombination C=O und OH am selben C bildet die Carboxygruppe. Steht dort O–C statt O–H, liegt eine Estergruppe vor.')+bookParagraph('Fehlt C=O, unterscheiden sich Alkohol und Ether durch die Nachbarn des O-Atoms: R–O–H ist ein Alkohol, wenn OH an gesättigtem C hängt; R–O–R′ ist ein Ether. OH an einem aromatischen Ring gehört zur Stoffklasse der Phenole.')],
['Mehrere Gruppen in einem Molekül',bookParagraph('NH₂–CH₂–COOH enthält eine Aminogruppe und eine Carboxygruppe. Es ist Glycin, eine Aminosäure. CH₃–CH(OH)–COOH besitzt eine Alkoholgruppe und eine Carboxygruppe. Beide können das Reaktionsverhalten beeinflussen.')+bookNote('Genau unterscheiden','Die OH-Einheit innerhalb einer Carboxygruppe ist keine zusätzliche Alkoholgruppe. „Enthält Sauerstoff“ und „enthält OH“ reichen deshalb als Zuordnungsregel nicht aus.')]
]},
nomenklatur:{lead:'Systematische Namen beschreiben das Kohlenstoffgerüst, die Lage von Seitenzweigen, Mehrfachbindungen und funktionellen Gruppen. Wer den Namen lesen kann, kann daraus eine Struktur aufbauen.',sections:[
['Bausteine eines Namens',bookParagraph('Die Wortstämme nennen die Zahl der C-Atome der Stammstruktur: meth- (1), eth- (2), prop- (3), but- (4), pent- (5), hex- (6), hept- (7), oct- (8), non- (9), dec- (10). Bei einfachen unverzweigten Alkanen folgt -an, bei Alkenen -en und bei Alkinen -in. Gruppen können als Endung oder Vorsilbe genannt werden.')+bookTable(['Strukturmerkmal','Typische Benennung','Beispiel'],[['Hydroxygruppe','-ol','Propan-2-ol'],['Aldehydgruppe','-al','Ethanal'],['Ketongruppe','-on','Butan-2-on'],['Carboxygruppe','-säure','Ethansäure'],['Alkylseitenzweig','z. B. methyl-, ethyl-','2-Methylbutan'],['Halogen','fluor-, chlor-, brom-, iod-','1-Brompropan']])],
['Die Stammkette wählen und nummerieren',bookParagraph('Bei einfachen Alkanen ist die längste zusammenhängende C-Kette die Stammkette. Bei den hier behandelten Verbindungen mit einer namensgebenden funktionellen Gruppe muss die Stammkette diese Gruppe enthalten. Die Nummerierung gibt zuerst der als Endung genannten Hauptgruppe die niedrigste mögliche Positionszahl. Danach werden Mehrfachbindungen und anschließend Seitenzweige berücksichtigt. Dies sind Regeln für die einfachen Beispiele dieses Vorwissensbereichs.')+bookFigure('2-Methylbutan: Stammkette und Seitenzweig',bl(138,130,225,130)+bl(275,130,382,130)+bl(458,130,557,130)+bl(250,150,250,210)+bt(100,138,'CH₃',27)+bt(250,138,'CH',27)+bt(420,138,'CH₂',27)+bt(595,138,'CH₃',27)+bt(250,244,'CH₃',27)+[100,250,420,595].map((x,i)=>bt(x,83,String(i+1),23,'#078898')).join('')+bt(360,35,'Stammkette: vier C → butan',22,'#075966')+bt(467,245,'Seitenzweig an C₂: methyl',20,'#075966'),'Die längste Kette enthält vier C-Atome. Von links erhält die Methylgruppe die Position 2; von rechts wäre es 3.')],
['Seitenzweige und Schreibweise',bookParagraph('Gleiche Seitenzweige werden mit di-, tri- oder tetra- zusammengefasst, zum Beispiel 2,3-Dimethylbutan. Verschiedene Alkylgruppen stehen alphabetisch; Vorsilben wie di- zählen bei dieser einfachen alphabetischen Sortierung nicht mit. Zahlen trennt man durch Kommas. Zwischen Zahlen und Wörtern stehen Bindestriche; innerhalb des Namens stehen keine Leerzeichen.')+bookNote('Durchgerechnetes Beispiel','CH₃–CH(OH)–CH₂–CH₃ besitzt vier C in der Stammkette. Die OH-Gruppe hat von links die Position 2 und von rechts 3. Der Name lautet Butan-2-ol. Die Positionszahl steht unmittelbar vor der Endung -ol.')],
['Aldehyde, Säuren und Ester',bookParagraph('Bei einer offenen Kette liegt das Aldehyd-C am Kettenende und ist C₁. Dasselbe gilt für das Carboxyl-C einer einfachen Alkansäure: Es gehört zur Stammkette und wird mitgezählt. CH₃–CH₂–COOH ist deshalb Propansäure.')+bookParagraph('Bei einfachen Estern R–C(=O)–O–R′ benennt man den am einfach gebundenen O hängenden Alkylrest und den Säurerest. CH₃–COO–CH₂–CH₃ heißt Ethylethanoat; auch der gebräuchliche Name Ethansäureethylester beschreibt dieselbe Struktur. „Ethyl“ stammt vom Alkoholteil, „ethanoat“ vom Säureteil.')],
['Vom Namen zur Struktur',bookParagraph('Bei 3-Methylpentan-2-ol wird zuerst eine Kette aus fünf C gezeichnet. An C₂ kommt OH, an C₃ eine CH₃-Gruppe. Zuletzt ergänzt man H entsprechend den Bindigkeiten. Die Halbstrukturformel lautet CH₃–CH(OH)–CH(CH₃)–CH₂–CH₃. Kontrolle: Stammkette, Positionen und Bindigkeiten müssen zugleich zum Namen passen.')]
]},
polaritaet:{lead:'Elektronen sind in einer Bindung nicht immer gleich verteilt. Bindungspolarität erklärt lokale Partialladungen; die räumliche Anordnung entscheidet, ob das gesamte Molekül ein Dipol ist.',sections:[
['Elektronegativität und polare Bindungen',bookParagraph('Die Elektronegativität (EN) beschreibt, wie stark ein Atom in einer Bindung Elektronendichte anzieht. Auf der Pauling-Skala gelten ungefähr: H 2,20; C 2,55; N 3,04; O 3,44. Bei C–O und O–H liegt die Elektronendichte stärker beim O-Atom. O trägt dann δ−, der Bindungspartner δ+. δ bedeutet „teilweise“: Es handelt sich nicht um ganze Ionenladungen.')+bookTable(['Bindung','ΔEN (ungefähr)','Einordnung für diese Beispiele'],[['C–C','0','Unpolar'],['C–H','0,35','Schwach polar; häufig näherungsweise unpolar betrachtet'],['C–O','0,89','Polar: C δ+, O δ−'],['O–H','1,24','Polar: H δ+, O δ−']])+bookParagraph('ΔEN liefert eine Orientierung, keine scharfe universelle Grenze zwischen Bindungsarten. Bindungseigenschaften hängen auch von der chemischen Umgebung ab.')],
['Vom Bindungsdipol zum Moleküldipol',bookParagraph('Bindungsdipole haben eine Richtung. Ihre räumliche Vektorsumme entscheidet über den Gesamtdipol. Wasser ist gewinkelt: Die beiden O–H-Dipole heben sich nicht auf. CO₂ besitzt zwei polare C=O-Bindungen, ist aber linear und symmetrisch. Seine Dipole kompensieren sich.')+polarityBookFigure()],
['Freie Elektronenpaare und Molekülgestalt',bookParagraph('In einem einfachen Elektronenpaarabstoßungsmodell ordnen sich Elektronenbereiche um ein Atom mit möglichst großem Abstand an. Eine Mehrfachbindung zählt dabei als ein Bereich. Bei Methan ergeben vier Bindungsbereiche eine tetraedrische Anordnung. Bei Wasser führen zwei Bindungsbereiche und zwei freie Elektronenpaare zu einer gewinkelten Molekülgestalt. Eine zweidimensionale Strukturformel allein bildet diese räumliche Gestalt nicht vollständig ab.')],
['Partialladung, Ionenladung und Oxidationszahl',bookParagraph('δ+ und δ− beschreiben eine ungleichmäßige Elektronenverteilung innerhalb einer Bindung. Ein Ion wie Na⁺ besitzt dagegen eine ganzzahlige Nettoladung. Eine Oxidationszahl ist wiederum eine formale Rechengröße: Man ordnet Bindungselektronen vollständig dem elektronegativeren Atom zu. Diese drei Beschreibungen beantworten unterschiedliche Fragen.')+bookNote('Bezug zu organischen Reaktionen','Das C-Atom einer Carbonylgruppe ist durch C=O partiell positiv. Es kann deshalb von einem elektronenreichen Reaktionspartner angegriffen werden. Die Polarität erklärt eine mögliche Reaktionsstelle, legt aber noch keinen vollständigen Reaktionsmechanismus fest.')]
]},
stoffteilchen:{lead:'Chemische Erklärungen verbinden das Beobachtbare mit einem Modell der Atome, Moleküle und Ionen. Beide Ebenen müssen klar unterschieden und anschließend sinnvoll aufeinander bezogen werden.',sections:[
['Die drei Beschreibungsebenen',bookTable(['Ebene','Was sie beschreibt','Beispiel'],[['Stoffebene','Beobachtbare oder messbare Eigenschaften','Ethanol verdampft; die Masse der offenen Probe nimmt ab.'],['Teilchenebene','Modelle von Atomen, Molekülen und Ionen','Ethanolmoleküle verlassen die Flüssigkeit und verteilen sich im Gasraum.'],['Symbolebene','Formeln, Gleichungen und Modellzeichnungen','C₂H₅OH(l) → C₂H₅OH(g)']])+bookParagraph('Ein Stoff besitzt eine Siedetemperatur, ein einzelnes Molekül nicht. Moleküle sind auch nicht „flüssig“ oder „nass“. Solche Stoffeigenschaften entstehen aus dem Verhalten vieler Teilchen und ihren Wechselwirkungen.')],
['Aggregatzustände im Modell',bookParagraph('In einem Feststoff sind Teilchen meist dicht und geordnet angeordnet und schwingen um ihre Plätze. In einer Flüssigkeit liegen sie ebenfalls dicht, können aber ihre Nachbarn wechseln. In einem Gas sind die Abstände groß und die Teilchen bewegen sich frei zwischen Zusammenstößen. Die Teilchen selbst werden beim Erwärmen nicht einfach größer.')+particleBookFigure()],
['Physikalische Änderung oder chemische Reaktion?',bookParagraph('Beim Schmelzen, Verdampfen oder Mischen bleiben die beteiligten Stoffarten im einfachen physikalischen Fall erhalten. Die Anordnung und Wechselwirkungen ändern sich. Bei einer chemischen Reaktion werden Bindungen verändert und Atome neu verknüpft; es entstehen andere Stoffe. Bei der Verbrennung von Ethanol entstehen unter vollständiger Verbrennung CO₂ und H₂O.')+bookEquation('C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O')+bookParagraph('Die Atome werden dabei weder erzeugt noch vernichtet. In einem geschlossenen System bleibt die Gesamtmasse erhalten. In einem offenen Gefäß kann sich die gemessene Masse ändern, weil gasförmige Stoffe hinzukommen oder entweichen.')],
['Eine Erklärung aufbauen',bookNote('Beispiel: Ethanol und Wasser','Beobachtung: Die Flüssigkeiten lassen sich vollständig mischen. Teilchendeutung: Ethanol- und Wassermoleküle können unter anderem Wasserstoffbrücken miteinander bilden; insgesamt ist die Mischung thermodynamisch begünstigt. Die Mischbarkeit gehört zur Stoffebene, die Wechselwirkungen zur Teilchenebene.')+bookParagraph('Modelle sind Vereinfachungen: Kugeln zeigen zum Beispiel Teilchenzahl und Anordnung, aber meist keine realen Größenverhältnisse und keine vollständige Elektronenverteilung. Aus einer Modellzeichnung dürfen nur Aussagen abgeleitet werden, die das Modell tatsächlich abbildet.')]
]},
reaktionsgleichungen:{lead:'Eine Reaktionsgleichung beschreibt, welche Stoffe umgesetzt und gebildet werden. Durch Koeffizienten wird sichergestellt, dass die Zahl der Atome jedes Elements und die Gesamtladung erhalten bleiben.',sections:[
['Formeln und Koeffizienten',bookParagraph('Die Formeln links vom Pfeil stehen für Edukte, die rechts für Produkte. Ein tiefgestellter Index gehört zur Stoffformel: H₂O enthält pro Molekül zwei H und ein O. Ein Koeffizient vor der Formel multipliziert die gesamte Einheit: 2 H₂O beschreibt zwei Wassermoleküle oder ein entsprechendes Stoffmengenverhältnis.')+reactionBookFigure()+bookNote('Die Stoffformel bleibt unverändert','Zum Ausgleichen werden ausschließlich Koeffizienten verändert. Aus H₂O darf nicht H₂O₂ gemacht werden: Das wäre ein anderer Stoff.')],
['Eine Gleichung systematisch ausgleichen',bookParagraph('Zuerst werden korrekte Edukt- und Produktformeln notiert. Danach zählt man für jedes Element die Atome auf beiden Seiten und wählt passende Koeffizienten. Bei Verbrennungen organischer Stoffe lässt sich meist zuerst C, dann H und zuletzt O ausgleichen. Zum Schluss werden alle Atome und gegebenenfalls die Ladung erneut geprüft. Üblicherweise verwendet man die kleinsten ganzzahligen Koeffizienten.')+bookEquation('C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O')+bookTable(['Element','Edukte','Produkte'],[['C','2','2 × 1 = 2'],['H','6','3 × 2 = 6'],['O','1 + 3 × 2 = 7','2 × 2 + 3 × 1 = 7']])],
['Ladungen und Zustände',bookParagraph('In Ionengleichungen muss auch die Summe der Ladungen gleich sein. Bei CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺ ist die Gesamtladung auf beiden Seiten null. Die Symbole (s), (l), (g) und (aq) stehen für fest, flüssig, gasförmig und in Wasser gelöst. Die Pfeile → und ⇌ unterscheiden eine bevorzugte Reaktionsrichtung beziehungsweise eine Gleichgewichtsdarstellung.')],
['Stoffmengen aus der Gleichung lesen',bookParagraph('Die Koeffizienten sind Stoffmengenverhältnisse, keine Massenverhältnisse. Für die vollständige Verbrennung von 1 mol Ethanol werden nach obiger Gleichung 3 mol O₂ benötigt; dabei entstehen 2 mol CO₂ und 3 mol H₂O. Für 2 mol Ethanol verdoppeln sich diese Werte, sofern genug Sauerstoff vorliegt und vollständig umgesetzt wird.')+bookParagraph('Die Umrechnung zwischen Masse und Stoffmenge erfolgt über n = m/M. Die Konzentration einer gelösten Stoffart wird als c = n/V beschrieben, zum Beispiel in mol/L. Eine ausgeglichene Gleichung allein sagt noch nichts über Reaktionsgeschwindigkeit, Ausbeute oder Nebenreaktionen aus.')]
]},
isomerie:{lead:'Isomere besitzen dieselbe Summenformel, sind aber verschiedene Verbindungen. Hier werden drei Formen der Konstitutionsisomerie betrachtet: Die Atome sind jeweils unterschiedlich miteinander verknüpft.',sections:[
['Gleiche Atomzahlen, andere Verknüpfung',bookParagraph('Vor jedem Strukturvergleich werden die Summenformeln geprüft. Sind sie unterschiedlich, handelt es sich nicht um Isomere. Bei gleicher Summenformel vergleicht man, welches Atom mit welchem verbunden ist. Eine bloß anders ausgerichtete Zeichnung oder eine Drehung um eine Einfachbindung erzeugt keine neue Konstitutionsisomerie.')+isomerBookFigure()],
['Kettenisomerie',bookParagraph('Bei Kettenisomeren unterscheidet sich das Kohlenstoffgerüst. Butan und 2-Methylpropan besitzen beide C₄H₁₀. Butan besitzt eine unverzweigte Kette aus vier C; bei 2-Methylpropan sind drei endständige C an ein mittleres C gebunden. Die unterschiedliche Gestalt kann beispielsweise die Wechselwirkungen und damit die Siedetemperatur beeinflussen.')],
['Stellungsisomerie',bookParagraph('Bei Stellungsisomeren bleiben das Gerüst und die Art der funktionellen Gruppe beziehungsweise Mehrfachbindung gleich; ihre Position unterscheidet sich. Propan-1-ol und Propan-2-ol besitzen C₃H₈O und eine OH-Gruppe, aber OH sitzt an einem endständigen beziehungsweise am mittleren C. Auch But-1-en und But-2-en sind Stellungsisomere, weil die C=C-Bindung an verschiedenen Positionen liegt.')],
['Funktionsisomerie',bookParagraph('Funktionsisomere besitzen bei gleicher Summenformel unterschiedliche funktionelle Gruppen. Ethanol (CH₃–CH₂–OH) und Dimethylether (CH₃–O–CH₃) haben beide C₂H₆O. Der erste Stoff ist ein Alkohol, der zweite ein Ether. Ein weiteres Beispiel sind Propanal und Propanon mit C₃H₆O: Aldehyd und Keton.')],
['Strukturen vergleichen, ohne doppelt zu zählen',bookParagraph('Bei möglichen Isomeren kann man zunächst verschiedene C-Gerüste zeichnen und anschließend sinnvolle Positionen einer Gruppe prüfen. Jede Struktur wird auf Bindigkeiten und Summenformel kontrolliert. Eine umgedrehte Kette wird nur einmal gezählt: „Propan-3-ol“ ist bei korrekter Nummerierung erneut Propan-1-ol.')+bookNote('Worauf es ankommt','Die Strichrichtung oder die Position auf dem Blatt ist kein Kriterium. Entscheidend ist die Verknüpfung der Atome. Die drei hier behandelten Arten gehören sämtlich zur Konstitutionsisomerie.')]
]},
wechselwirkungen:{lead:'Zwischen Molekülen wirken anziehende Kräfte. Ihre Art und Stärke tragen dazu bei, Siedetemperaturen, Löslichkeit und andere Stoffeigenschaften zu erklären.',sections:[
['Bindungen innerhalb und Kräfte zwischen Molekülen',bookParagraph('Eine kovalente Bindung verbindet Atome innerhalb eines Moleküls. Zwischenmolekulare Wechselwirkungen wirken dagegen zwischen verschiedenen Molekülen. Beim Sieden einer molekularen Flüssigkeit werden Moleküle voneinander getrennt; die kovalenten Bindungen im Molekül bleiben dabei gewöhnlich erhalten.')+interactionBookFigure()],
['Drei wichtige Wechselwirkungen',bookTable(['Wechselwirkung','Voraussetzung / Ursache','Beispiel'],[['London-Dispersionskräfte','Momentane Schwankungen der Elektronendichte und induzierte Dipole; bei allen Molekülen','Zwischen Alkanmolekülen'],['Dipol-Dipol-Wechselwirkungen','Anziehung zwischen permanenten Moleküldipolen','Zwischen Propanonmolekülen'],['Wasserstoffbrücken','H an O, N oder F als Donator; geeignetes freies Elektronenpaar als Akzeptor','Zwischen Wasser- oder Ethanolmolekülen']])+bookParagraph('Die Wechselwirkungen können gleichzeitig auftreten. Auch Ethanol besitzt London-Kräfte. Welche Wechselwirkung für einen Vergleich besonders wichtig ist, hängt von Molekülgröße, Gestalt und funktionellen Gruppen ab; eine einzige pauschale Rangfolge reicht nicht für alle Stoffe.')],
['Wasserstoffbrücken richtig zuordnen',bookParagraph('Ethanol kann Wasserstoffbrücken spenden und aufnehmen: Es besitzt O–H und freie Elektronenpaare am O. Dimethylether besitzt freie Elektronenpaare am O und kann daher Wasserstoffbrücken von Wasser aufnehmen. Zwischen seinen eigenen Molekülen fehlt jedoch ein passender O–H-, N–H- oder F–H-Donator. Ein beliebiges an C gebundenes H genügt für diese Schulbuchregel nicht.')],
['Siedetemperaturen vergleichen',bookParagraph('Bei vergleichbarer Größe können Wasserstoffbrücken die Siedetemperatur deutlich erhöhen. Innerhalb einer Reihe unpolarer Moleküle nehmen London-Kräfte häufig mit Elektronenzahl und Polarisierbarkeit zu. Längere unverzweigte Alkane sieden deshalb meist höher. Bei isomeren Alkanen führt stärkere Verzweigung oft zu einer geringeren Kontaktfläche und niedrigeren Siedetemperatur. Solche Regeln gelten für passende Vergleichsgruppen.')],
['Mischbarkeit und Löslichkeit',bookParagraph('Beim Mischen werden bisherige Wechselwirkungen teilweise ersetzt und neue gebildet; zusätzlich verändert sich die Verteilung der Teilchen und damit die Entropie. Ob eine Mischung begünstigt ist, hängt von der gesamten freien Enthalpie ab. „Ähnliches löst sich in Ähnlichem“ ist eine hilfreiche Faustregel für ähnliche Wechselwirkungsmöglichkeiten, keine allgemeine Gesetzmäßigkeit.')+bookNote('Alkohole und Wasser','Die OH-Gruppe ermöglicht Wechselwirkungen mit Wasser, der Kohlenwasserstoffrest wirkt hydrophob. Mit zunehmender Länge des Alkylrests nimmt die Wasserlöslichkeit in der Reihe einwertiger Alkanole im Allgemeinen ab. Ethanol ist vollständig mit Wasser mischbar.')]
]},
redox:{lead:'Bei einer Redoxreaktion findet eine Elektronenübertragung statt. In Molekülreaktionen lässt sie sich häufig am zuverlässigsten durch die Änderung von Oxidationszahlen erkennen.',sections:[
['Oxidation und Reduktion gehören zusammen',bookParagraph('Oxidation bedeutet Elektronenabgabe, Reduktion Elektronenaufnahme. Das Reduktionsmittel gibt Elektronen ab und wird selbst oxidiert. Das Oxidationsmittel nimmt Elektronen auf und wird selbst reduziert. Die Elektronen sind in einer Gesamtgleichung nicht übrig, sondern werden zwischen den Reaktionspartnern bilanziert.')+bookEquation('Zn → Zn²⁺ + 2 e⁻ &nbsp;&nbsp; · &nbsp;&nbsp; Cu²⁺ + 2 e⁻ → Cu')],
['Oxidationszahlen bestimmen',bookParagraph('Bindungselektronen werden formal vollständig dem elektronegativeren Atom zugeordnet; zwischen gleichen Atomen werden sie gleich verteilt. Elemente im elementaren Zustand besitzen die Oxidationszahl 0. Für die hier verwendeten organischen Verbindungen gilt gewöhnlich: H +I, O −II. Ausnahmen sind beispielsweise Peroxide (O −I) und Metallhydride (H −I). Die Summe aller Oxidationszahlen entspricht der Ladung des Teilchens.')+bookParagraph('Für ein C-Atom in den hier behandelten neutralen C/H/O-Verbindungen zählt jede C–H-Bindung −1, jede C–O-Bindung +1 und C=O +2. C–C trägt 0 bei. So hat das CH₃-C in Ethanol −III, das CH₂OH-C −I. Man darf nicht einfach allen C-Atomen im Molekül dieselbe Oxidationszahl zuweisen.')+redoxBookFigure()],
['Die Oxidationsreihe der Alkanole',bookParagraph('Ein primärer Alkanol kann unter geeigneten Bedingungen zum Aldehyd und weiter zur Carbonsäure oxidiert werden. Ethanol führt so zu Ethanal und Ethansäure. Ein sekundärer Alkanol wird zum Keton, zum Beispiel Propan-2-ol zu Propanon. Ein tertiärer Alkohol lässt sich nicht auf dieselbe milde Weise zu einer Carbonylverbindung oxidieren, weil am OH-tragenden C kein H gebunden ist. Unter starken Bedingungen sind andere Reaktionen einschließlich C–C-Spaltung möglich.')+bookParagraph('Ein primärer Alkohol besitzt gewöhnlich zwei H am OH-tragenden C; Methanol ist der Sonderfall mit drei H. Welches Produkt tatsächlich erhalten wird, hängt unter anderem von Oxidationsmittel, Temperatur und Reaktionsführung ab.')],
['Teilgleichungen und Elektronenbilanz',bookParagraph('Für Ethanol zu Ethanal kann die Oxidations-Teilgleichung im sauren Milieu so geschrieben werden:')+bookEquation('CH₃CH₂OH → CH₃CHO + 2 H⁺ + 2 e⁻')+bookParagraph('Atome und Ladung stimmen auf beiden Seiten überein. Eine passende Reduktions-Teilgleichung muss zwei Elektronen aufnehmen. Beim Addieren werden Elektronen gekürzt. Der formale Anstieg der Oxidationszahl um 2 am betroffenen C entspricht dabei zwei abgegebenen Elektronen pro umgesetztem Molekül.')+bookNote('Abgrenzung','Nicht jede Reaktion mit O-haltigen Stoffen ist eine Redoxreaktion. Bei einer Protonenübertragung können die Oxidationszahlen unverändert bleiben. Entscheidend ist die Elektronenbilanz beziehungsweise die Änderung der Oxidationszahlen.')]
]},
saeurebase:{lead:'Nach Brønsted übertragen Säuren und Basen Protonen. Ein Stoff wirkt als Säure, wenn er ein Proton abgibt, und als Base, wenn er ein Proton aufnimmt.',sections:[
['Das Donator-Akzeptor-Prinzip',bookParagraph('Eine Brønsted-Säure ist ein Protonendonator; eine Brønsted-Base ist ein Protonenakzeptor. Die Rollen ergeben sich aus der konkreten Reaktion. Wasser kann je nach Partner H⁺ aufnehmen oder abgeben und ist damit ein Ampholyt. Eine Base muss keine OH-Gruppe enthalten: Ammoniak und Amine können mit ihrem freien Elektronenpaar am N ein Proton aufnehmen.')+acidBookFigure()],
['Korrespondierende Säure-Base-Paare',bookParagraph('Nach der Protonenabgabe bleibt die korrespondierende Base zurück. Nimmt eine Base ein Proton auf, entsteht ihre korrespondierende Säure. Beide Partner eines Paares unterscheiden sich um genau H⁺; die Säure hat daher eine um +1 höhere Ladung.')+bookTable(['Säure','Korrespondierende Base'],[['CH₃COOH','CH₃COO⁻'],['H₃O⁺','H₂O'],['H₂O','OH⁻'],['NH₄⁺','NH₃']])+bookParagraph('Für CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺ sind die Paare CH₃COOH/CH₃COO⁻ und H₃O⁺/H₂O. Ethansäure und Wasser sind zwar Reaktionspartner, aber kein korrespondierendes Paar.')],
['Organische Säuren und Basen',bookParagraph('Carbonsäuren können ein Proton ihrer Carboxygruppe abgeben. Das Carboxylat-Ion wird durch die Verteilung der negativen Ladung über beide O-Atome stabilisiert. Deshalb ist Ethansäure wesentlich saurer als Ethanol: Im Ethanolat-Ion fehlt diese entsprechende Mesomeriestabilisierung. Amine können am N protoniert werden, etwa CH₃NH₂ + H₂O ⇌ CH₃NH₃⁺ + OH⁻.')+bookParagraph('Säurestärke beschreibt die Bereitschaft zur Protonenabgabe in einem gegebenen Medium; Konzentration beschreibt, wie viel Stoff pro Volumen vorliegt. Eine verdünnte starke Säure und eine konzentrierte schwache Säure sind daher verschiedene Beschreibungen.')],
['pH, Neutralisation und Reaktionstyp',bookParagraph('Für verdünnte wässrige Lösungen kann man den pH näherungsweise als −log₁₀(c(H₃O⁺)/(1 mol/L)) berechnen. Bei 25 °C ist eine neutrale wässrige Lösung ungefähr pH 7; neutral bedeutet gleiche Konzentrationen von H₃O⁺ und OH⁻. Bei einer Neutralisation reagieren diese Ionen zu Wasser:')+bookEquation('H₃O⁺ + OH⁻ → 2 H₂O')+bookNote('Keine Elektronenübertragung','Bei einer Brønsted-Reaktion wird H⁺ übertragen, kein Elektron. Säure-Base-Reaktion und Redoxreaktion müssen deshalb anhand des übertragenen Teilchens unterschieden werden.')]
]},
gleichgewicht:{lead:'Viele Reaktionen laufen in beide Richtungen. Ein Katalysator verändert ihre Geschwindigkeit; die Lage des Gleichgewichts ergibt sich dagegen aus den thermodynamischen Bedingungen.',sections:[
['Ein dynamisches Gleichgewicht',bookParagraph('In einem geschlossenen System können Hin- und Rückreaktion gleichzeitig ablaufen. Im Gleichgewicht sind ihre Geschwindigkeiten gleich. Die Konzentrationen bleiben dann zeitlich konstant, obwohl auf Teilchenebene weiterhin Stoffumwandlungen stattfinden. Die Konzentrationen von Edukten und Produkten müssen dabei nicht gleich sein.')+equilibriumBookFigure()],
['Das Massenwirkungsgesetz',bookParagraph('Für a A + b B ⇌ c C + d D lautet die im Schulunterricht gebräuchliche Konzentrationsform:')+bookEquation('Kc = c(C)ᶜ · c(D)ᵈ / [c(A)ᵃ · c(B)ᵇ]')+bookParagraph('Gemeint sind Gleichgewichtskonzentrationen; die stöchiometrischen Koeffizienten werden zu Exponenten. Bei A + B ⇌ C gilt Kc = c(C)/(c(A)·c(B)). Bei 0,20 mol/L C und jeweils 0,10 mol/L A und B ergibt sich Kc = 20 L/mol. Die Einheit dieser schulischen Konzentrationsform hängt von der Gleichung ab. Die thermodynamische Gleichgewichtskonstante wird mit Aktivitäten formuliert und ist dimensionslos. K ist bei vorgegebener Temperatur festgelegt; ein großes K weist auf eine im Gleichgewicht bevorzugte Produktseite hin.')],
['Ein Gleichgewicht verschieben',bookParagraph('Wird die Konzentration eines Edukts erhöht, kann es verstärkt umgesetzt werden; bei Entnahme eines Produkts kann dieses nachgebildet werden. Das Prinzip von Le Chatelier beschreibt diese Tendenz. Eine Druckerhöhung begünstigt bei Gasgleichgewichten häufig die Seite mit weniger Gasteilchen, sofern sich die Summe der Gas-Koeffizienten unterscheidet. Bei gleichen Gas-Teilchenzahlen ergibt sich daraus keine solche Verschiebung.')+bookParagraph('Eine Temperaturerhöhung begünstigt die endotherme Reaktionsrichtung. Ist die Hinreaktion exotherm, wird daher eher die Rückreaktion begünstigt. Eine Temperaturänderung kann die Gleichgewichtskonstante verändern; eine reine Konzentrationsänderung bei gleicher Temperatur verändert sie nicht.')],
['Was ein Katalysator bewirkt',bookParagraph('Ein Katalysator ermöglicht einen anderen Reaktionsweg mit geringerer Aktivierungsbarriere. Er nimmt an Teilschritten teil und wird im Gesamtprozess regeneriert. Er beschleunigt Hin- und Rückreaktion, sodass das Gleichgewicht schneller erreicht wird. Bei gleicher Temperatur verändert er weder die Gleichgewichtskonstante noch die Gleichgewichtszusammensetzung.')+energyBookFigure()],
['Geschwindigkeit und Ausbeute unterscheiden',bookNote('Beispiel: Esterbildung','Bei der reversiblen Esterbildung aus Carbonsäure und Alkohol kann ein Säurekatalysator die Einstellung des Gleichgewichts beschleunigen. Ein Überschuss eines Reaktionspartners oder die Entfernung eines Produkts kann dagegen die Zusammensetzung zugunsten des Esters verschieben. „Schneller“ und „mehr Produkt im Gleichgewicht“ sind unterschiedliche Aussagen.')]
]},
experiment:{lead:'Ein gutes Experiment verknüpft eine klare Frage mit kontrollierten Bedingungen, nachvollziehbaren Beobachtungen und einer begründeten Auswertung. Ein Befund ist nur so aussagekräftig wie sein Versuchsaufbau.',sections:[
['Von der Frage zum Versuchsplan',bookParagraph('Am Anfang steht eine präzise Frage, zum Beispiel: „Beeinflusst ein Katalysator die Geschwindigkeit unter sonst gleichen Bedingungen?“ Eine Hypothese nennt eine begründete Erwartung. Im Versuchsplan werden die veränderte Einflussgröße, die gemessene Größe und die konstant gehaltenen Bedingungen festgelegt. Vergleichs- und Kontrollansätze helfen, alternative Erklärungen zu prüfen.')+experimentBookFigure()],
['Beobachtung und Deutung trennen',bookTable(['Beobachtung: unmittelbar zugänglich','Deutung: Erklärung oder Schlussfolgerung'],[['Es entstehen Gasblasen.','Eine gasförmige Stoffart könnte entstehen; ihre Identität benötigt einen geeigneten Nachweis.'],['Die Lösung färbt sich orange.','Eine Stoffumwandlung könnte stattgefunden haben; die Farbe allein identifiziert noch kein Produkt.'],['Ein Niederschlag bildet sich.','Eine schwer lösliche Verbindung entsteht; ein Nachweis kann Hinweise auf eine Stoffgruppe geben.']])+bookParagraph('„Der Alkohol wurde oxidiert“ ist eine Deutung, keine reine Beobachtung. Ein Protokoll notiert zunächst sichtbare Veränderungen, Messwerte und Bedingungen. Anschließend werden diese mit Reaktionsgleichungen und Modellen erklärt.')],
['Messwerte sinnvoll auswerten',bookParagraph('Messgröße, Einheit und Zeitpunkt müssen klar dokumentiert werden. Wiederholungsmessungen zeigen die Streuung. Für Zeiten von 20 s, 22 s und 21 s beträgt der Mittelwert 21 s; die drei Einzelwerte gehören trotzdem in das Protokoll. Die Anzahl der Nachkommastellen soll zur Messgenauigkeit passen.')+bookParagraph('In einem Diagramm steht die unabhängige Größe meist auf der x-Achse und die abhängige Messgröße auf der y-Achse. Beide Achsen benötigen Bezeichnung und Einheit. Eine bloße Zunahme der Gasmenge sagt noch nicht, wodurch sie verursacht wurde: Auch Temperatur, Dichtigkeit, Stoffmenge und Messverfahren müssen berücksichtigt werden.')],
['Die Aussagekraft von Nachweisen',bookParagraph('Ein Nachweis prüft eine bestimmte Eigenschaft unter bestimmten Bedingungen. Ein positiver Carbonylnachweis für Aldehyde und Ketone grenzt Stoffklassen ein, bestimmt aber keine einzelne Verbindung eindeutig. Eine positive Fehling-Probe zeigt reduzierende Eigenschaften; sie ist nicht ausschließlich für eine bestimmte Aldehydverbindung spezifisch. Ein negativer Befund ist nur mit geeigneten Bedingungen und funktionsfähiger Kontrolle aussagekräftig.')+bookNote('Kontrollen','Eine Positivkontrolle muss unter den verwendeten Bedingungen den erwarteten Befund zeigen. Eine Negativkontrolle hilft, einen Befund durch Reagenzien oder Verunreinigung zu erkennen. Mehrere unabhängige Befunde sind belastbarer als eine einzelne Farbänderung.')],
['Sicherheit und ein vollständiges Protokoll',bookParagraph('Vor der Durchführung müssen Gefährdungen, Schutzmaßnahmen und Entsorgung für den konkreten Versuch geklärt sein. Dazu gehören die Anweisungen der Lehrkraft, passende Schutzkleidung und ein sicherer Umgang mit Geräten und Stoffen. Eine unbekannte Substanz wird nicht durch Probieren oder direktes Riechen identifiziert.')+bookParagraph('Ein nachvollziehbares Protokoll enthält Fragestellung, Hypothese, Geräte und Stoffe, Aufbau, Durchführung, Beobachtungen beziehungsweise Messwerte, Auswertung und Fehlerbetrachtung. Eine Abweichung vom erwarteten Ergebnis wird dokumentiert und begründet untersucht, statt nachträglich passende Werte einzutragen.')]
]}
};

function selfCheckOverview(){const total=Object.values(selfCheckSkills).flat().length,checked=Object.values(selfCheckSkills).flat().filter(([,id])=>state.selfChecks[id]).length;return `<button class="back-link" data-page="prior">← Vorwissen</button><p class="course">Vorwissen · Selbstkontrolle</p><h1>Ich kann …</h1><p class="intro">Hake ab, was du dir bereits zutraust. Über „Passend üben“ gelangst du direkt zur zugehörigen Übungsstelle. Deine Einschätzung bleibt auf diesem Gerät gespeichert und ist unabhängig von richtig gelösten Aufgaben.</p><p class="selfcheck-summary" role="status" aria-live="polite"><strong id="selfcheck-count">${checked} von ${total}</strong> Punkten selbst abgehakt</p><nav class="selfcheck-index" aria-label="Themen der Selbstkontrolle">${bookTopics.map(([id,title],i)=>`<a href="#selfcheck-${id}">${String(i+1).padStart(2,'0')} ${title}</a>`).join('')}</nav><div class="selfcheck-groups">${bookTopics.map(([id,title],i)=>`<section class="selfcheck-group" id="selfcheck-${id}"><header><h2><span>${String(i+1).padStart(2,'0')}</span> ${title}</h2><button class="knowledge-link" data-book="${id}">Wissen nachlesen →</button></header><ul>${selfCheckSkills[id].map(([text,qid])=>`<li><label for="selfcheck-${qid}"><input type="checkbox" id="selfcheck-${qid}" data-selfcheck="${qid}" ${state.selfChecks[qid]?'checked':''}><span>Ich kann ${esc(text)}</span></label><button class="practice-link" data-practice-question="${qid}" aria-label="Passend üben: Ich kann ${esc(text)}">Passend üben →</button></li>`).join('')}</ul></section>`).join('')}</div>`;}
