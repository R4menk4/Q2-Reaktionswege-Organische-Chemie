let sections=[
 {title:'Was kannst du schon?',intro:'Drei Aufgaben zum Einstieg. Probiere sie zuerst ohne Hilfe. Du kannst danach jeden Abschnitt direkt auswählen.',q:[
 {id:'d1',text:'Wie viele Bindungen bildet ein Kohlenstoffatom in den hier betrachteten neutralen Molekülen?',choices:['2','3','4'],answer:2,ok:'Richtig: C bildet vier Bindungen. Eine Doppelbindung zählt als zwei, eine Dreifachbindung als drei.',bad:'Zähle alle Bindungsstriche am C-Atom. In Methan sind es vier.',hints:['Denke an Methan: CH₄.','C bildet hier vier Bindungen.'],m:'methane',topic:1},

 ]},
 {title:'Strukturformeln lesen',intro:'Gehe systematisch vor: C-Gerüst verfolgen → Bindungen prüfen → H-Atome zählen → weitere Elemente zählen. Die Zeichnung zeigt Verknüpfungen; ihre Anordnung auf dem Bildschirm ist kein räumliches Molekülmodell.',q:[
 {id:'r1',text:'Welche Summenformel gehört zum dargestellten Ethanal?',m:'ethanal',choices:['C₂H₆O','C₂H₄O','C₂H₄O₂'],answer:1,ok:'Zwei C, vier H und ein O: C₂H₄O. Das C mit der Doppelbindung zu O trägt nur ein H.',bad:'Zähle alle eingezeichneten Atome. Die Doppelbindung verändert nicht die Anzahl der O-Atome.',hints:['Die CH₃-Gruppe enthält drei H-Atome.','Am zweiten C sitzt noch ein H-Atom.']},
 {id:'r2',text:'Welche Halbstrukturformel passt zu dieser ausführlichen Strukturformel?',m:'propane',choices:['CH₃–CH₂–CH₃','CH₃–CH₃','CH₂=CH–CH₃'],answer:0,ok:'Die äußeren C-Atome tragen je drei H, das mittlere zwei. Alle C–C-Bindungen sind Einfachbindungen.',bad:'Verfolge die drei verbundenen C-Atome und zähle die H-Atome an jedem C einzeln.',hints:['Es sind drei C-Atome in einer Kette.','Außen je CH₃, in der Mitte CH₂.']},
 {id:'r3',text:'Wie viele H-Atome hat das mittlere C-Atom in CH₃–CH(CH₃)–CH₃?',type:'number',answer:1,ok:'Ein H. Das mittlere C ist außerdem an drei C-Atome gebunden. Die Klammer bezeichnet einen Seitenzweig.',bad:'Die CH₃-Gruppe in Klammern ist an das mittlere C gebunden. Es hat damit bereits drei C–C-Bindungen.',hints:['Eine Klammer zeigt hier eine Abzweigung.','Drei Einfachbindungen zu C lassen noch eine Bindung zu H übrig.']}
 ]},
 {title:'Strukturformeln zeichnen',intro:'Baue auf dem vorgegebenen Gerüst auf: Stelle die Bindungsordnung ein und ergänze an jedem Atom so viele H-Atome, bis seine Bindigkeit erfüllt ist. Die Zeichnung verändert sich mit deinen Eingaben.',q:[
 {id:'b1',text:'Ergänze Ethanol: CH₃–CH₂–OH.',type:'builder',target:[3,2,1,1],ok:'Ethanol ist vollständig: C₁ hat vier, C₂ vier und O zwei Bindungen. Insgesamt C₂H₆O.',bad:'Prüfe jedes Atom einzeln: C braucht vier Bindungen, O zwei. Für Ethanol ist C₂–O eine Einfachbindung.',hints:['Das Gerüst enthält zwei C-Atome und ein O-Atom.','H-Verteilung: 3 am ersten C, 2 am zweiten C, 1 am O. C–O ist einfach.']},
 {id:'b2',text:'Ergänze Ethanal: CH₃–CHO. Das zweite C ist doppelt an O gebunden.',type:'builder',target:[3,1,0,2],ok:'Ethanal ist vollständig: CH₃–C(=O)–H. Das O trägt kein H. Insgesamt C₂H₄O.',bad:'Zähle die C=O-Doppelbindung als zwei. Am zweiten C bleibt neben der C–C-Bindung nur Platz für ein H.',hints:['Stelle zuerst die Doppelbindung zwischen C₂ und O ein.','H-Verteilung: 3 am ersten C, 1 am zweiten C, keines am O.']},
 {id:'b3',text:'Fehlerdetektiv: Die Formel CH₃–CH₂=O ist als neutrales Molekül falsch. Was ist der Fehler?',choices:['Das erste C hat zu wenige Bindungen','Das zweite C hat fünf Bindungen','O muss zusätzlich zwei H-Atome tragen'],answer:1,ok:'C₂ hat eine C–C-Bindung, zwei C–H-Bindungen und eine Doppelbindung zu O: 1 + 2 + 2 = 5. Für Ethanal muss dort ein H weg.',bad:'Prüfe die Bindigkeit des zweiten C: Die Doppelbindung zählt als zwei.',hints:['Zähle nur die Bindungen am zweiten C.','1 zu C + 2 zu H + 2 zu O = ?']}
 ]},
 {title:'Kannst du es jetzt?',intro:'Vier neue Aufgaben. Versuche sie ohne Hilfen. Die Rückmeldung zeigt dir, welchen Abschnitt du gegebenenfalls wiederholen solltest.',q:[
 {id:'a1',text:'Welche Summenformel gehört zu diesem Molekül (Propanon)?',m:'propanone',choices:['C₃H₈O','C₃H₆O','C₃H₆O₂'],answer:1,ok:'Drei C, sechs H und ein O. Das mittlere C trägt kein H.',bad:'Zähle die eingezeichneten Atome und beachte die Doppelbindung am mittleren C.',hints:['Die beiden äußeren C tragen je drei H.','Das mittlere C hat bereits vier Bindungen.'],topic:3},
 {id:'a2',text:'Wie viele H-Atome hat jedes C-Atom in H–C≡C–H?',type:'number',answer:1,ok:'Je eines: Die Dreifachbindung zählt als drei, die C–H-Bindung als eine.',bad:'C braucht vier Bindungen. Drei davon stecken bereits in der C≡C-Bindung.',hints:['Die Dreifachbindung zählt dreifach.','4 − 3 = ?'],topic:1},
 {id:'a3',text:'Welche Halbstrukturformel beschreibt eine Kette C–C–O, in der O auch an ein H gebunden ist?',choices:['CH₃–O–CH₃','CH₃–CH₂–OH','CH₃–CH=O'],answer:1,ok:'CH₃–CH₂–OH zeigt C–C–O–H. Die anderen Formeln besitzen eine andere Verknüpfung oder Bindungsordnung.',bad:'Verfolge die Reihenfolge der Atome und suche die O–H-Bindung.',hints:['Das O muss am Ende der C-Kette stehen.','Die Formel endet auf –OH.'],topic:2},
 {id:'a4',text:'Zeichne Ethanal auf dem vorgegebenen Gerüst. Entscheide selbst über die Bindungsordnung und die H-Atome.',type:'builder',target:[3,1,0,2],ok:'Richtig gezeichnet: drei H am ersten C, ein H am zweiten C und eine C=O-Doppelbindung.',bad:'Prüfe zuerst die C=O-Doppelbindung, dann die Bindigkeiten an beiden C-Atomen.',hints:['Die Halbstrukturformel lautet CH₃–CHO.','H-Verteilung 3 / 1 / 0; C₂=O.'],topic:4}
 ]}
];

 und ergänze je ein H."]}, {"id": "b7", "text": "Zeichne Dimethylether: CH₃–O–CH₃. Das Gerüst zeigt die Reihenfolge C–O–C.", "type": "builder", "graph": {"atoms": [["C", 80, 130], ["O", 210, 130], ["C", 340, 130]], "bonds": [[0, 1, 1], [1, 2, 1]], "slots": [[[-55, 0], [0, -65], [0, 65], [-40, 45]], [[0, -65], [0, 65], [45, 45], [-45, 45]], [[55, 0], [0, -65], [0, 65], [40, 45]]], "labels": ["C₁ (links)", "O (Mitte)", "C₂ (rechts)"], "variable": [], "w": 440, "h": 280}, "target": [3, 0, 3], "ok": "Dimethylether hat zwei CH₃-Gruppen und kein H am O: C₂H₆O. Seine Verknüpfung unterscheidet sich von Ethanol.", "bad": "O ist schon an beide C-Atome einfach gebunden. Damit hat es seine zwei Bindungen.", "hints": ["Prüfe zuerst die Bindigkeit des mittleren O-Atoms.", "Je drei H an den C-Atomen; kein H am O."]}, {"id": "b8", "text": "Zeichne Propan-1-ol: CH₃–CH₂–CH₂–OH. Ergänze die vollständige Strukturformel.", "type": "builder", "graph": {"atoms": [["C", 65, 130], ["C", 165, 130], ["C", 265, 130], ["O", 365, 130]], "bonds": [[0, 1, 1], [1, 2, 1], [2, 3, 1]], "slots": [[[-55, 0], [0, -65], [0, 65], [-40, 45]], [[0, -65], [0, 65], [45, 45], [-45, 45]], [[0, -65], [0, 65], [45, 45], [-45, 45]], [[55, 0], [0, -65], [0, 65], [40, 45]]], "labels": ["C₁ (links)", "C₂", "C₃", "O (rechts)"], "variable": [], "w": 440, "h": 280}, "target": [3, 2, 2, 1], "ok": "Propan-1-ol ist vollständig: H-Verteilung 3 / 2 / 2 / 1. Summenformel C₃H₈O.", "bad": "Die beiden mittleren C-Atome haben je zwei Bindungen im Gerüst. Vergiss das H am O nicht.", "hints": ["Gehe vom linken C bis zum O und ergänze jeweils bis zur Bindigkeit.", "Ergänze 3, 2, 2 und 1 H-Atom."]}, {"id": "b9", "text": "Zeichne Propan-2-ol: CH₃–CH(OH)–CH₃. Die OH-Gruppe ist an das mittlere C gebunden.", "type": "builder", "graph": {"atoms": [["C", 80, 180], ["C", 210, 180], ["C", 340, 180], ["O", 210, 80]], "bonds": [[0, 1, 1], [1, 2, 1], [1, 3, 1]], "slots": [[[-55, 0], [0, -65], [0, 65], [-40, 45]], [[0, 65], [-45, 45], [45, 45], [ ", "bad": "Das obere O ist doppelt an C₂ gebunden. Das rechte O ist einfach an C₂ und an ein H gebunden.", "hints": ["Die beiden O-Atome haben unterschiedliche Verknüpfungen.", "Oben C=O ohne H; rechts C–O–H. Die CH₃-Gruppe trägt drei H."]}]);

const moduleDefinitions={strukturformeln:{title:'Strukturformeln',names,sections,goal:'Ich kann Strukturformeln lesen, zwischen verschiedenen Formeldarstellungen wechseln und einfache Moleküle korrekt zeichnen.',tagline:'Formeln lesen · Darstellungen wechseln · Moleküle zeichnen',transfer:'Zeichne Ethanol und Ethanal ohne Gerüst auf Papier. Prüfe an jedem Atom die Bindigkeit.',success:'Du kannst Strukturformeln lesen, verschiedene Darstellungen verbinden und das Gerüst von Ethanal korrekt ergänzen.'},stoffklassen:{"title": "Organische Stoffklassen", "names": ["Startcheck", "Stoffklassen-Kompass", "Gruppen finden", "Sauerstoffklassen", "Vergleichen", "Abschlusscheck"], "sections": [{"title": "Was erkennst du schon?", "intro": "Drei Aufgaben zum Einstieg. Prüfe zuerst ohne Hilfe, welche Gruppen du in Strukturformeln wiedererkennst.", "q": [{"id": "sk01", "text": "Zu welcher Stoffklasse gehört dieses Molekül?", "formula": "CH₃–CH₂–OH", "choices": ["Alkan", "Alkohol", "Carbonsäure"], "answer": 1, "ok": "Die Hydroxygruppe –OH an einem gesättigten C-Atom kennzeichnet hier den Alkohol Ethanol.", "bad": "Ein C-Gerüst allein reicht zur Einordnung nicht aus. Beachte die –OH-Gruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Die Formel endet auf –OH."]}, {"id": "sk02", "text": "Was ist eine funktionelle Gruppe?", "formula": "", "choices": ["Eine für eine Stoffklasse charakteristische Atomgruppe", "Die Summenformel eines Stoffes", "Immer die längste C-Kette"], "answer": 0, "ok": "Funktionelle Gruppen prägen Eigenschaften und Reaktionsverhalten einer Verbindung.", "bad": "Die Atomzahlen und die Länge der C-Kette legen die funktionelle Gruppe nicht fest.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Beispiele sind Hydroxygruppe und Carboxygruppe."]}, {"id": "sk03", "text": "Was haben diese beiden Moleküle gemeinsam?", "formula": "CH₃–CHO   und   CH₃–C(=O)–CH₃", "choices": ["Beide besitzen eine Carbonylgruppe C=O", "Beide gehören zu den Alkoholen", "Beide besitzen eine Carboxygruppe"], "answer": 0, "ok": "Beide enthalten C=O. Die unterschiedliche Umgebung der Carbonylgruppe unterscheidet Aldehyd und Keton.", "bad": "Eine Carbonylgruppe besteht aus einem C-Atom mit einer Doppelbindung zu O.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche nach C=O; in –CHO ist diese Doppelbindung verkürzt dargestellt."]}], "explainer": ""}, {"title": "Der Stoffklassen-Kompass", "intro": "Vergleiche charakteristische Strukturen. Die Beispiele sind bewusst einfach; Moleküle können auch mehrere funktionelle Gruppen besitzen.", "q": [{"id": "sk04", "text": "Welche Stoffklasse passt zu CH₃–CH₂–CH₃?", "formula": "CH₃–CH₂–CH₃", "choices": ["Alkan", "Alken", "Alkin"], "answer": 0, "ok": "Nur C und H sowie ausschließlich Einfachbindungen: ein Alkan.", "bad": "Eine C=C- oder C≡C-Bindung ist nicht vorhanden.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Zähle nicht die C-Atome, sondern prüfe die Bindungsordnung."]}, {"id": "sk05", "text": "Ordne dieses Molekül zu.", "formula": "CH₃–C≡CH", "choices": ["Alkan", "Alken", "Alkin"], "answer": 2, "ok": "Die C≡C-Dreifachbindung kennzeichnet ein Alkin.", "bad": "Eine Dreifachbindung ist weder eine Einfach- noch eine Doppelbindung.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Das Zeichen ≡ steht für eine Dreifachbindung."]}, {"id": "sk06", "text": "Zu welcher Stoffklasse gehört dieses Molekül?", "formula": "CH₃–CH₂–Br", "choices": ["Alkohol", "Halogenalkan", "Amin"], "answer": 1, "ok": "Br ist ein Halogen und an das gesättigte C-Gerüst gebunden: ein Halogenalkan.", "bad": "Hier kommt Brom vor, keine Hydroxy- oder Aminogruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Die Halogene stehen in der 17. Gruppe des Periodensystems."]}], "explainer": "<details class=\"class-atlas\" open><summary>Stoffklassen-Kompass</summary><div class=\"class-grid\"><div><strong>Alkane</strong><span>nur C–C-Einfachbindungen</span><code>CH₃–CH₃</code></div><div><strong>Alkene</strong><span>mindestens eine C=C-Doppelbindung</span><code>CH₂=CH₂</code></div><div><strong>Alkine</strong><span>mindestens eine C≡C-Dreifachbindung</span><code>HC≡CH</code></div><div><strong>Halogenalkane</strong><span>C–X; X z. B. F, Cl, Br, I</span><code>CH₃–CH₂–Cl</code></div><div><strong>Alkohole</strong><span>R–OH; OH an gesättigtem C</span><code>CH₃–CH₂–OH</code></div><div><strong>Aldehyde</strong><span>R–C(=O)–H, kurz R–CHO</span><code>CH₃–CHO</code></div><div><strong>Ketone</strong><span>R–C(=O)–R′</span><code>CH₃–C(=O)–CH₃</code></div><div><strong>Carbonsäuren</strong><span>R–C(=O)–OH, kurz R–COOH</span><code>CH₃–COOH</code></div><div><strong>Ester</strong><span>R–C(=O)–O–R′</span><code>CH₃–C(=O)–O–CH₃</code></div><div><strong>Amine</strong><span>z. B. R–NH₂ bei primären Aminen</span><code>CH₃–NH₂</code></div></div><p class=\"soft\">R und R′ bezeichnen hier organische Reste; sie können gleich oder verschieden sein. Beim einfachsten Aldehyd (Methanal) steht anstelle von R ein H. Amine und Halogenalkane sind zugleich ein Ausblick auf die Reihe.</p></details>"}, {"title": "Funktionelle Gruppen finden", "intro": "Klicke den Formelabschnitt an, der die gesuchte Gruppe enthält. Bindungen innerhalb eines Abschnitts gehören mit zur Auswahl.", "q": [{"id": "sk07", "text": "Markiere die Hydroxygruppe.", "formula": "", "choices": [], "answer": 2, "ok": "Die Hydroxygruppe ist –OH. Sie ist hier an ein gesättigtes C-Atom gebunden.", "bad": "Die Kohlenwasserstoffgruppen enthalten keine Hydroxygruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche O und H als verbundene Gruppe."], "type": "group", "parts": ["CH₃", "CH₂", "OH"]}, {"id": "sk08", "text": "Markiere den Abschnitt mit der Carbonylgruppe.", "formula": "", "choices": [], "answer": 1, "ok": "Der Abschnitt C(=O) enthält die Carbonylgruppe C=O.", "bad": "Die CH₃-Gruppen enthalten keine Doppelbindung zu O.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Die Carbonylgruppe besteht aus C und doppelt gebundenem O."], "type": "group", "parts": ["CH₃", "C(=O)", "CH₃"]}, {"id": "sk09", "text": "Markiere die gesamte Carboxygruppe.", "formula": "", "choices": [], "answer": 1, "ok": "Die Carboxygruppe umfasst C=O und die am selben C gebundene OH-Gruppe.", "bad": "Bei der Carboxygruppe gehört die gesamte Einheit –C(=O)–OH zusammen.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Die Kurzschreibweise ist –COOH."], "type": "group", "parts": ["CH₃", "C(=O)–OH"]}, {"id": "sk10", "text": "Markiere die Estergruppe.", "formula": "", "choices": [], "answer": 1, "ok": "Die Estergruppe ist –C(=O)–O–; das einfach gebundene O ist hier mit einem weiteren C-Rest verbunden.", "bad": "Eine Estergruppe enthält eine Carbonylgruppe und ein zusätzliches einfach gebundenes O.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche die Einheit –C(=O)–O–."], "type": "group", "parts": ["CH₃", "C(=O)–O", "CH₂", "CH₃"]}, {"id": "sk11", "text": "Markiere die Aminogruppe dieses primären Amins.", "formula": "", "choices": [], "answer": 2, "ok": "–NH₂ ist hier die Aminogruppe. Das N ist mit dem C-Rest und zwei H verbunden.", "bad": "Die Aminogruppe enthält Stickstoff. Die CH₃- und CH₂-Gruppen enthalten keinen N.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche das N-Atom."], "type": "group", "parts": ["CH₃", "CH₂", "NH₂"]}, {"id": "sk12", "text": "Markiere die Hydroxygruppe im Seitenzweig.", "formula": "", "choices": [], "answer": 1, "ok": "Die OH-Gruppe hängt am mittleren C. Auch eine Gruppe im Seitenzweig zählt.", "bad": "Prüfe auch den Klammerausdruck am mittleren C-Atom.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "In CH(OH) zeigt die Klammer die gebundene OH-Gruppe."], "type": "group", "parts": ["CH₃", "CH(OH)", "CH₃"]}], "explainer": "<div class=\"module-goal\"><strong>Genau hinsehen</strong>Die Lage einer Gruppe kann wechseln. Bei Carbonylverbindungen entscheidet die Umgebung von C=O darüber, ob ein Aldehyd, Keton, eine Carbonsäure oder ein Ester vorliegt.</div>"}, {"title": "Sauerstoffhaltige Stoffklassen unterscheiden", "intro": "Gehe von C=O aus: Ist daran H, ein zweiter C-Rest, OH oder O–C gebunden? Fehlt C=O, prüfe auf eine eigenständige OH-Gruppe.", "q": [{"id": "sk13", "text": "Ordne das Molekül zu.", "formula": "CH₃–CH₂–CHO", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 1, "ok": "Die –CHO-Gruppe besitzt ein Carbonyl-C mit einem gebundenen H: ein Aldehyd.", "bad": "–CHO steht für –C(=O)–H, nicht für eine OH-Gruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Denke –CHO als ausgeschriebene Gruppe –C(=O)–H."]}, {"id": "sk14", "text": "Ordne das Molekül zu.", "formula": "CH₃–C(=O)–CH₂–CH₃", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 2, "ok": "Das Carbonyl-C ist mit zwei C-Resten verbunden: ein Keton.", "bad": "Am Carbonyl-C hängt kein H und keine OH- oder O–C-Gruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Betrachte die beiden direkten Nachbarn des Carbonyl-C."]}, {"id": "sk15", "text": "Ordne das Molekül zu.", "formula": "CH₃–CH₂–C(=O)–OH", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 3, "ok": "C=O und OH sind an dasselbe C gebunden: eine Carbonsäure.", "bad": "Die OH-Gruppe ist Bestandteil der Carboxygruppe; sie macht das Molekül hier nicht zum Alkohol.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche die gesamte –COOH-Gruppe."]}, {"id": "sk16", "text": "Ordne das Molekül zu.", "formula": "CH₃–C(=O)–O–CH₂–CH₃", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 4, "ok": "Auf das Carbonyl-C folgt O und dann ein weiterer C-Rest: ein Ester.", "bad": "Am einfach gebundenen O hängt ein C-Rest, kein H.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Vergleiche –C(=O)–OH mit –C(=O)–O–C."]}, {"id": "sk17", "text": "Ordne das Molekül zu.", "formula": "CH₃–CH(OH)–CH₃", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 0, "ok": "Eine OH-Gruppe an einem gesättigten C und keine Carbonylgruppe: ein Alkohol.", "bad": "Hier ist O einfach an C und H gebunden. Es gibt keine C=O-Bindung.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Die Klammer enthält –OH, nicht =O."]}], "explainer": "<div class=\"module-goal\"><strong>Aldehyd oder Keton?</strong>Aldehyd: mindestens ein H am Carbonyl-C. Keton: zwei C-Reste am Carbonyl-C. Die Carbonylgruppe allein reicht zur Einordnung nicht aus.</div>"}, {"title": "Ähnliche Formeln – andere Stoffklasse", "intro": "Prüfe die Verknüpfung statt nur die Atomzahlen. Einige Moleküle gehören gleichzeitig zu mehreren Stoffklassen.", "q": [{"id": "sk18", "text": "Welche Aussage stimmt?", "formula": "CH₃–CH₂–OH   und   CH₃–O–CH₃", "choices": ["Beide sind Alkohole, weil sie O enthalten", "Nur das erste Molekül besitzt eine OH-Gruppe", "Beide sind Ester"], "answer": 1, "ok": "Ethanol besitzt OH; Dimethylether besitzt C–O–C ohne OH und ohne C=O.", "bad": "Sauerstoff allein kennzeichnet weder einen Alkohol noch einen Ester.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Prüfe, ob O an H oder an zwei C-Atome gebunden ist."]}, {"id": "sk19", "text": "Gehören beide Moleküle zur gleichen Stoffklasse?", "formula": "CH₃–CH₂–CH₂–OH   und   CH₃–CH(OH)–CH₃", "choices": ["Ja, beide sind Alkohole", "Nein, nur das erste ist ein Alkohol", "Nein, das zweite ist ein Keton"], "answer": 0, "ok": "Beide besitzen OH an einem gesättigten C. Die Position unterscheidet sich, die Stoffklasse ist gleich.", "bad": "Eine andere Position der OH-Gruppe ändert hier nicht die Stoffklasse.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Prüfe die funktionelle Gruppe beider Moleküle."]}, {"id": "sk20", "text": "Welche Begründung für die Zuordnung ist richtig?", "formula": "CH₃–COOH", "choices": ["Alkohol, weil irgendwo OH vorkommt", "Carbonsäure, weil OH und C=O am selben C sitzen", "Keton, weil C=O vorkommt"], "answer": 1, "ok": "Die komplette Carboxygruppe entscheidet. Ihre OH-Gruppe ist keine zusätzliche Alkoholgruppe.", "bad": "Betrachte nicht nur einzelne Teilgruppen, sondern ihre Verknüpfung.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "–COOH ist die Kurzschreibweise für –C(=O)–OH."]}, {"id": "sk21", "text": "Welche funktionellen Gruppen besitzt dieses Molekül?", "formula": "NH₂–CH₂–COOH", "choices": ["Nur eine Aminogruppe", "Eine Aminogruppe und eine Carboxygruppe", "Eine Estergruppe und eine Hydroxygruppe"], "answer": 1, "ok": "Es enthält sowohl –NH₂ als auch –COOH: ein Beispiel für eine Aminosäure.", "bad": "Ein Molekül kann mehrere funktionelle Gruppen besitzen.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Prüfe beide Enden der Formel."]}, {"id": "sk22", "text": "Kann man allein aus C₂H₆O sicher auf einen Alkohol schließen?", "formula": "C₂H₆O", "choices": ["Ja, weil O enthalten ist", "Nein, die Verknüpfung ist nicht angegeben", "Ja, weil sechs H-Atome enthalten sind"], "answer": 1, "ok": "Ethanol und Dimethylether besitzen beide C₂H₆O, aber unterschiedliche funktionelle Gruppen.", "bad": "Eine Summenformel enthält keine Information über die Verknüpfung.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Vergleiche die beiden Moleküle aus der ersten Aufgabe."]}], "explainer": "<div class=\"module-goal\"><strong>Zusatz: Ether</strong>Bei Ethern ist ein O-Atom einfach an zwei organische Reste gebunden: R–O–R′. Sie besitzen keine Estergruppe, denn dafür fehlt C=O.</div>"}, {"title": "Kannst du Stoffklassen sicher erkennen?", "intro": "Fünf neue Beispiele ohne vorangestellte Merkhilfe. Nutze die Struktur und begründe deine Auswahl.", "q": [{"id": "sk23", "text": "Bestimme die Stoffklasse.", "formula": "CH₃–CH₂–C(=O)–O–CH₃", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 4, "ok": "Die –C(=O)–O–C-Verknüpfung kennzeichnet einen Ester.", "bad": "Prüfe die Bindung des einfach gebundenen O: Es hängt an einem C-Rest.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche Carbonylgruppe plus O–C."], "topic": 3}, {"id": "sk24", "text": "Bestimme die Stoffklasse.", "formula": "CH₃–CH₂–C(=O)–CH₂–CH₃", "choices": ["Alkohol", "Aldehyd", "Keton", "Carbonsäure", "Ester"], "answer": 2, "ok": "Zwei C-Reste sind an das Carbonyl-C gebunden: ein Keton.", "bad": "Das Carbonyl-C trägt kein H und keine OH- oder O–C-Gruppe.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Untersuche die unmittelbaren Nachbarn des Carbonyl-C."], "topic": 3}, {"id": "sk25", "text": "Bestimme die Stoffklasse.", "formula": "CH₂=CH–CH₂–CH₃", "choices": ["Alkan", "Alken", "Alkin", "Halogenalkan"], "answer": 1, "ok": "Die C=C-Doppelbindung kennzeichnet ein Alken.", "bad": "Zwei Bindungsstriche zwischen C bedeuten eine Doppelbindung.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Prüfe die Bindungsordnung zwischen den ersten beiden C."], "topic": 1}, {"id": "sk26", "text": "Markiere die Carboxygruppe.", "formula": "", "choices": [], "answer": 2, "ok": "Die gesamte Gruppe –C(=O)–OH ist die Carboxygruppe.", "bad": "Die CH₃- und CH₂-Gruppen enthalten keinen Sauerstoff.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Suche C=O und OH am selben C."], "topic": 2, "type": "group", "parts": ["CH₃", "CH₂", "C(=O)–OH"]}, {"id": "sk27", "text": "Welche Aussage beschreibt beide funktionellen Gruppen richtig?", "formula": "NH₂–CH₂–CH₂–OH", "choices": ["Aminogruppe und alkoholische Hydroxygruppe", "Carboxygruppe und Aminogruppe", "Estergruppe und Aminogruppe"], "answer": 0, "ok": "–NH₂ und –OH an einem gesättigten C: Das Molekül ist zugleich ein Amin und ein Alkohol.", "bad": "Es gibt keine C=O-Bindung; Carboxy- und Estergruppe kommen nicht vor.", "hints": ["Suche die charakteristische Bindung oder Atomgruppe und prüfe auch ihre Nachbarn.", "Prüfe beide Enden der Formel."], "topic": 4}], "explainer": ""}], "goal": "Ich kann funktionelle Gruppen in Strukturformeln erkennen, organische Verbindungen zuordnen und ähnliche Stoffklassen unterscheiden.", "tagline": "Gruppen erkennen · Stoffklassen zuordnen · Strukturen vergleichen", "transfer": "Wähle drei Alltagsstoffe aus deinem Unterrichtsmaterial. Zeichne ihre charakteristischen Gruppen und begründe die Stoffklassenzuordnung.", "success": "Du erkennst charakteristische Gruppen und kannst auch ähnliche sowie mehrfach funktionalisierte Moleküle begründet zuordnen."}};
moduleDefinitions.nomenklatur={"title": "Nomenklatur", "names": ["Startcheck", "Stammketten", "Verzweigungen", "Mehrfachbindungen", "Funktionelle Gruppen", "Name → Formel", "Abschlusscheck"], "sections": [{"title": "Was kannst du schon benennen?", "intro": "Drei kurze Einstiegsaufgaben. Entscheidend sind die Verknüpfung der Atome und die Position wichtiger Gruppen.", "q": [{"id": "no01", "text": "Wie heißt dieses Molekül?", "formula": "CH₃–CH₂–CH₃", "choices": ["Ethan", "Propan", "Butan"], "answer": 1, "ok": "Drei C-Atome und nur Einfachbindungen: Propan.", "bad": "Zähle die C-Atome der unverzweigten Kette.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Der Stamm prop- steht für drei C-Atome."]}, {"id": "no02", "text": "Welche Endung passt zu einem einfachen Alkohol?", "formula": "R–OH", "choices": ["-al", "-ol", "-on"], "answer": 1, "ok": "Die Endung -ol kennzeichnet die hier behandelten Alkohole.", "bad": "Die Endungen -al und -on kennzeichnen Aldehyde bzw. Ketone.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Vergleiche Ethanol mit Ethanal."]}, {"id": "no03", "text": "Was bezeichnet die 2 in Butan-2-ol?", "formula": "", "choices": ["Die Anzahl der O-Atome", "Die Position der OH-Gruppe", "Die Anzahl der C-Atome"], "answer": 1, "ok": "Die OH-Gruppe sitzt an C-Atom 2 der Butankette.", "bad": "Die Zahl ist eine Positionsangabe. Vier C-Atome stecken im Stamm but-.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Ordne die Zahl einer Stelle in der C-Kette zu."]}], "explainer": ""}, {"title": "Stammkette und Grundname", "intro": "Beginne bei unverzweigten Alkanen: C-Atome zählen, Stammnamen wählen und -an ergänzen.", "q": [{"id": "no04", "text": "Schreibe den Namen dieses Alkans.", "formula": "CH₃–CH₂–CH₂–CH₃", "choices": [], "answer": "Butan", "ok": "Vier C-Atome ergeben but-, Einfachbindungen die Endung -an: Butan.", "bad": "Prüfe die Anzahl der C-Atome.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die Stammkette besteht aus vier C-Atomen."], "type": "text", "aliases": []}, {"id": "no05", "text": "Welche Anzahl an C-Atomen gehört zu Hexan?", "formula": "", "choices": ["5", "6", "7"], "answer": 1, "ok": "Hex- steht für sechs C-Atome.", "bad": "Pent- steht für fünf, hept- für sieben C-Atome.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Nutze die Übersicht der Stammnamen."]}, {"id": "no06", "text": "Benenne diese unverzweigte Verbindung.", "formula": "CH₃–(CH₂)₃–CH₃", "choices": [], "answer": "Pentan", "ok": "Zwei endständige C-Atome plus drei CH₂-Gruppen: insgesamt fünf, also Pentan.", "bad": "Die tiefgestellte 3 vervielfacht die CH₂-Gruppe.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Rechne 1 + 3 + 1 C-Atome."], "type": "text", "aliases": []}, {"id": "no07", "text": "Welche Aussage zur Stammkette eines einfachen verzweigten Alkans stimmt?", "formula": "", "choices": ["Die waagerecht gezeichnete Kette ist immer die Stammkette", "Die längste zusammenhängende C-Kette wird gewählt", "Alle C-Atome des Moleküls gehören zur Stammkette"], "answer": 1, "ok": "Bei den hier betrachteten verzweigten Alkanen zählt die längste zusammenhängende C-Kette.", "bad": "Die Zeichenrichtung ist keine Benennungsregel. Seitenzweige können außerhalb der Stammkette liegen.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Verfolge zusammenhängende Wege durch das C-Gerüst."]}], "explainer": "<details class=\"class-atlas\" open><summary>Die ersten zehn Stammnamen</summary><div class=\"class-grid\"><div><strong>1 C-Atom</strong><code>meth-</code></div><div><strong>2 C-Atome</strong><code>eth-</code></div><div><strong>3 C-Atome</strong><code>prop-</code></div><div><strong>4 C-Atome</strong><code>but-</code></div><div><strong>5 C-Atome</strong><code>pent-</code></div><div><strong>6 C-Atome</strong><code>hex-</code></div><div><strong>7 C-Atome</strong><code>hept-</code></div><div><strong>8 C-Atome</strong><code>oct-</code></div><div><strong>9 C-Atome</strong><code>non-</code></div><div><strong>10 C-Atome</strong><code>dec-</code></div></div></details><div class=\"module-goal\"><strong>Geltungsbereich</strong>Wir üben zunächst einfache, offenkettige Verbindungen. Bei funktionellen Gruppen muss die Stammkette die als Endung benannte Gruppe enthalten; bei den hier behandelten Alkenen und Alkinen die Mehrfachbindung.</div>"}, {"title": "Verzweigungen und Nummerierung", "intro": "Wähle die längste passende Kette. Nummeriere einfache verzweigte Alkane so, dass die Positionszahlen der Seitenreste am ersten Unterschied möglichst klein sind.", "q": [{"id": "no08", "text": "Benenne das verzweigte Alkan.", "formula": "CH₃–CH(CH₃)–CH₂–CH₃", "choices": [], "answer": "2-Methylbutan", "ok": "Die Stammkette enthält vier C. An C₂ sitzt ein Methylrest: 2-Methylbutan.", "bad": "Die CH₃-Gruppe in Klammern ist ein Seitenrest und macht die Stammkette nicht zu Pentan.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Butan als Stamm; der Seitenrest sitzt an C₂."], "type": "text", "aliases": []}, {"id": "no09", "text": "Benenne die Verbindung.", "formula": "CH₃–C(CH₃)₂–CH₃", "choices": [], "answer": "2,2-Dimethylpropan", "ok": "Drei C in der Stammkette, zwei Methylreste an C₂: 2,2-Dimethylpropan.", "bad": "Die 2 außerhalb der Klammer bedeutet zwei gleiche CH₃-Seitenreste.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Beide Methylreste erhalten die Positionszahl 2."], "type": "text", "aliases": []}, {"id": "no10", "text": "Welche Nummerierung ist für dasselbe C-Gerüst richtig?", "formula": "CH₃–CH₂–CH(CH₃)–CH₃", "choices": ["3-Methylbutan", "2-Methylbutan", "2-Ethylpropan"], "answer": 1, "ok": "Vom rechten Ende erhält der Methylrest die kleinere Positionszahl 2.", "bad": "Die Stammkette hat vier C-Atome. Vergleiche die Nummerierung von beiden Enden.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die Nummerierung beginnt hier rechts."]}, {"id": "no11", "text": "Welche Aussage zur Reihenfolge der Seitenreste stimmt?", "formula": "", "choices": ["Ethyl wird vor Methyl genannt", "Methyl wird immer zuerst genannt", "Die Zahlen bestimmen allein die Reihenfolge der Namen"], "answer": 0, "ok": "Verschiedene Seitenreste werden alphabetisch genannt: Ethyl vor Methyl. di-, tri- usw. zählen dabei nicht mit.", "bad": "Die alphabetische Reihenfolge richtet sich nach den Namen der Seitenreste.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Vergleiche die Anfangsbuchstaben E und M."]}, {"id": "no12", "text": "Benenne dieses Molekül.", "formula": "CH₃–CH(CH₃)–CH(CH₃)–CH₂–CH₃", "choices": [], "answer": "2,3-Dimethylpentan", "ok": "Fünf C in der Stammkette und Methylreste an C₂ und C₃: 2,3-Dimethylpentan.", "bad": "Von rechts wären die Zahlen 3 und 4. Die Kombination 2,3 ist am ersten Unterschied kleiner.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Pentan mit zwei Methylresten an den Positionen 2 und 3."], "type": "text", "aliases": []}], "explainer": "<div class=\"module-goal\"><strong>Schreibweise</strong>Zahlen trennt man durch Kommas, Zahlen und Namen durch Bindestriche: <strong>2,3-Dimethylpentan</strong>. Methyl steht für –CH₃, Ethyl für –CH₂–CH₃.</div>"}, {"title": "Doppel- und Dreifachbindungen benennen", "intro": "-en kennzeichnet eine Doppelbindung, -in eine Dreifachbindung. Die Positionszahl nennt das erste C-Atom der Mehrfachbindung.", "q": [{"id": "no13", "text": "Benenne dieses Alken.", "formula": "CH₂=CH–CH₂–CH₃", "choices": [], "answer": "But-1-en", "ok": "Vier C-Atome und eine Doppelbindung zwischen C₁ und C₂: But-1-en.", "bad": "Die Zahl nennt das erste C-Atom der Doppelbindung, nicht beide C-Atome.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Nummeriere vom Ende nahe der Doppelbindung."], "type": "text", "aliases": ["1-Buten"]}, {"id": "no14", "text": "Welche Struktur gehört zu But-2-en?", "formula": "", "choices": ["CH₂=CH–CH₂–CH₃", "CH₃–CH=CH–CH₃", "CH₃–C≡C–CH₃"], "answer": 1, "ok": "Bei But-2-en liegt die Doppelbindung zwischen C₂ und C₃.", "bad": "-en verlangt eine Doppelbindung; die 2 gibt ihren Beginn an.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Suche C₂=C₃."]}, {"id": "no15", "text": "Benenne dieses Alkin.", "formula": "CH₃–CH₂–C≡CH", "choices": [], "answer": "But-1-in", "ok": "Vom rechten Ende beginnt die Dreifachbindung an C₁: But-1-in.", "bad": "Die Dreifachbindung erhält bei diesem einfachen Alkin die kleinere Positionszahl.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Vier C-Atome; nummeriere von rechts."], "type": "text", "aliases": ["1-Butin"]}, {"id": "no16", "text": "Welcher Name passt zur Struktur?", "formula": "CH₂=C(CH₃)–CH₃", "choices": ["2-Methylprop-1-en", "2-Methylpropan", "2-Methylbut-1-en"], "answer": 0, "ok": "Drei C in der Kette mit der Doppelbindung, ein Methylrest an C₂: 2-Methylprop-1-en.", "bad": "Die Stammkette muss die Doppelbindung enthalten. Das vierte C ist ein Seitenrest.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "prop-1-en ist der Stamm; Methyl sitzt an C₂."]}], "explainer": "<div class=\"module-goal\"><strong>Die Richtung entscheidet</strong>Bei den Beispielen in diesem Abschnitt bekommt die Mehrfachbindung die kleinere Positionszahl. E/Z- bzw. cis/trans-Angaben werden später bei der Stereoisomerie ergänzt.</div>"}, {"title": "Funktionelle Gruppen im Namen", "intro": "Verbinde Stoffklasse, Stammkette und Position der Gruppe. Halogene erscheinen als Vorsilben; Ester bestehen im Namen aus zwei Teilen.", "q": [{"id": "no17", "text": "Benenne diesen Alkohol.", "formula": "CH₃–CH(OH)–CH₂–CH₃", "choices": [], "answer": "Butan-2-ol", "ok": "Vier C-Atome, OH an C₂: Butan-2-ol.", "bad": "Die OH-Gruppe erhält die kleinere Positionszahl.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die Endung lautet -ol."], "type": "text", "aliases": ["2-Butanol"]}, {"id": "no18", "text": "Benenne den Aldehyd.", "formula": "CH₃–CH₂–CHO", "choices": [], "answer": "Propanal", "ok": "Das C der CHO-Gruppe zählt mit: drei C, Endung -al, also Propanal.", "bad": "Die CHO-Gruppe enthält ein weiteres C-Atom.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Zähle insgesamt drei C-Atome."], "type": "text", "aliases": []}, {"id": "no19", "text": "Benenne dieses Keton.", "formula": "CH₃–C(=O)–CH₂–CH₃", "choices": [], "answer": "Butan-2-on", "ok": "Vier C-Atome und die Carbonylgruppe an C₂: Butan-2-on.", "bad": "Ein Keton trägt die Endung -on. Die Position gehört zum Carbonyl-C.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Der Name beginnt mit Butan-2-."], "type": "text", "aliases": ["2-Butanon", "Butanon"]}, {"id": "no20", "text": "Benenne diese Carbonsäure systematisch.", "formula": "CH₃–CH₂–COOH", "choices": [], "answer": "Propansäure", "ok": "Das Carboxyl-C gehört zur Kette: drei C-Atome ergeben Propansäure.", "bad": "Zähle das C der COOH-Gruppe mit.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Drei C und die Endung -säure."], "type": "text", "aliases": []}, {"id": "no21", "text": "Welcher Name passt zum Halogenalkan?", "formula": "CH₃–CH(Br)–CH₃", "choices": ["1-Brompropan", "2-Brompropan", "Propan-2-ol"], "answer": 1, "ok": "Brom wird als Vorsilbe Brom- genannt und sitzt an C₂: 2-Brompropan.", "bad": "Die drei C bilden Propan. Br ist ein Halogen, keine OH-Gruppe.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Brom sitzt am mittleren C."]}, {"id": "no22", "text": "Benenne diesen Ester nach dem gezeigten Schema.", "formula": "CH₃–C(=O)–O–CH₂–CH₃", "choices": [], "answer": "Ethylethanoat", "ok": "Der Rest am einfach gebundenen O ist Ethyl. Der Säureteil enthält zwei C: Ethanoat. Zusammen Ethylethanoat, auch Ethansäureethylester.", "bad": "Die C-Atome auf beiden Seiten des O werden für den Namen getrennt betrachtet.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Ethylrest am O plus Ethanoat als Säureteil."], "type": "text", "aliases": ["Ethansäureethylester"]}], "explainer": "<div class=\"module-goal\"><strong>Endungen im Überblick</strong>Alkohol: <strong>-ol</strong> · Aldehyd: <strong>-al</strong> · Keton: <strong>-on</strong> · Carbonsäure: <strong>-säure</strong>. Bei diesen einfachen Verbindungen erhält die als Endung benannte Gruppe Vorrang bei der Nummerierung. Das C einer endständigen CHO- oder COOH-Gruppe gehört zur Kette und ist C₁.</div><div class=\"module-goal\"><strong>Ester: zwei Bausteine</strong><strong>Alkylrest am O + Säureteil auf -oat</strong>, z. B. Methylethanoat. Im Schulunterricht begegnet dir auch Ethansäuremethylester. Amine werden hier nur im Ausblick gezeigt: CH₃–NH₂ heißt Methanamin (auch Methylamin).</div>"}, {"title": "Vom Namen zur Struktur", "intro": "Lies Namen als Bauanleitung: Stammkette anlegen, nummerieren, Gruppen einsetzen und H-Atome ergänzen.", "q": [{"id": "no23", "text": "Welche Halbstrukturformel gehört zu 2-Methylbutan?", "formula": "", "choices": ["CH₃–CH₂–CH₂–CH₂–CH₃", "CH₃–CH(CH₃)–CH₂–CH₃", "CH₃–CH(CH₃)–CH₃"], "answer": 1, "ok": "Vier C in der Stammkette, ein Methylrest an C₂.", "bad": "Die Gesamtzahl an C reicht nicht: Auch Kettenlänge und Verzweigungsposition müssen passen.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Suche eine Butankette mit CH₃-Seitenrest an C₂."]}, {"id": "no24", "text": "Welche Struktur gehört zu Pentan-3-on?", "formula": "", "choices": ["CH₃–CH₂–C(=O)–CH₂–CH₃", "CH₃–C(=O)–CH₂–CH₂–CH₃", "CH₃–CH₂–CH(OH)–CH₂–CH₃"], "answer": 0, "ok": "Fünf C, Carbonylgruppe am mittleren C₃: Pentan-3-on.", "bad": "-on verlangt C=O, die 3 legt dessen Position fest.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Suche die mittlere Carbonylgruppe in einer Fünferkette."]}, {"id": "no25", "text": "Welche Struktur gehört zu Propansäure?", "formula": "", "choices": ["CH₃–COOH", "CH₃–CH₂–COOH", "CH₃–CH₂–CHO"], "answer": 1, "ok": "Die COOH-Gruppe liefert das dritte C der Propansäure.", "bad": "prop- steht für drei C; -säure verlangt eine Carboxygruppe.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Zwei C im Rest plus ein C in COOH."]}, {"id": "no26", "text": "Welche Struktur gehört zu Methylethanoat?", "formula": "", "choices": ["CH₃–C(=O)–O–CH₃", "CH₃–CH₂–C(=O)–O–CH₃", "CH₃–C(=O)–O–CH₂–CH₃"], "answer": 0, "ok": "Der Ethanoatteil enthält zwei C; am O sitzt ein Methylrest.", "bad": "Methyl und Ethanoat werden getrennt in die Struktur übersetzt.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Suche einen CH₃-Rest direkt am einfach gebundenen O."]}], "explainer": "<div class=\"module-goal\"><strong>Vier Prüfungen</strong>Stimmt die Zahl der C-Atome in der Stammkette? Sind Positionen und Bindungsordnungen richtig? Passt die funktionelle Gruppe? Erfüllt jedes Atom seine Bindigkeit?</div>"}, {"title": "Kannst du Namen und Formeln verbinden?", "intro": "Fünf neue Aufgaben ohne vorgeschaltete Merkhilfe. Schreibe Namen selbst und übersetze sie zurück in Strukturen.", "q": [{"id": "no27", "text": "Benenne die Verbindung.", "formula": "CH₃–CH(CH₃)–CH₂–CH₂–CH₃", "choices": [], "answer": "2-Methylpentan", "ok": "Fünf C in der Stammkette und ein Methylrest an C₂: 2-Methylpentan.", "bad": "Vergleiche die Nummerierung von beiden Kettenenden.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die Stammkette heißt Pentan."], "topic": 2, "type": "text", "aliases": []}, {"id": "no28", "text": "Benenne das Alken.", "formula": "CH₃–CH=CH–CH₂–CH₃", "choices": [], "answer": "Pent-2-en", "ok": "Fünf C, Doppelbindung zwischen C₂ und C₃: Pent-2-en.", "bad": "Die Zahl gehört zum Beginn der Doppelbindung.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die Doppelbindung erhält die kleinere Zahl 2."], "topic": 3, "type": "text", "aliases": ["2-Penten"]}, {"id": "no29", "text": "Benenne den Alkohol.", "formula": "CH₃–CH₂–CH₂–CH₂–OH", "choices": [], "answer": "Butan-1-ol", "ok": "Vier C und OH an einem endständigen C: Butan-1-ol.", "bad": "Nummeriere vom Ende mit der OH-Gruppe.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Die OH-Gruppe sitzt an C₁."], "topic": 4, "type": "text", "aliases": ["1-Butanol"]}, {"id": "no30", "text": "Welche Struktur passt zu 3-Methylpentan-2-on?", "formula": "", "choices": ["CH₃–C(=O)–CH(CH₃)–CH₂–CH₃", "CH₃–CH(CH₃)–C(=O)–CH₂–CH₃", "CH₃–CH(OH)–CH(CH₃)–CH₂–CH₃"], "answer": 0, "ok": "Die Fünferkette hat C=O an C₂ und Methyl an C₃.", "bad": "Prüfe sowohl -2-on als auch 3-Methyl.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Carbonylgruppe an C₂, Methylrest an C₃."], "topic": 5}, {"id": "no31", "text": "Benenne diesen Ester.", "formula": "CH₃–CH₂–C(=O)–O–CH₃", "choices": [], "answer": "Methylpropanoat", "ok": "Methyl am O und Propanoat als Säureteil: Methylpropanoat, auch Propansäuremethylester.", "bad": "Der Säureteil umfasst drei C inklusive des Carbonyl-C.", "hints": ["Gehe in der Reihenfolge Stammkette → Nummerierung → Seitenreste oder funktionelle Gruppe vor.", "Methylrest plus Propanoat."], "topic": 4, "type": "text", "aliases": ["Propansäuremethylester"]}], "explainer": "<details class=\"class-atlas\"><summary>Fachliche Grundlage</summary><p>Die Regeln sind für die hier gezeigten einfachen Schulbeispiele zusammengefasst. Grundlage: <a href=\"https://iupac.org/what-we-do/books/bluebook/\" target=\"_blank\" rel=\"noopener\">IUPAC – Nomenclature of Organic Chemistry (Blue Book)</a>.</p></details>"}], "goal": "Ich kann einfache organische Verbindungen systematisch benennen und Namen in Strukturformeln übersetzen.", "tagline": "Stammkette wählen · Nummerieren · Namen und Formeln verbinden", "transfer": "Zeichne 2-Methylpentan, Butan-2-ol und Methylethanoat auf Papier. Markiere Stammkette bzw. Esterbausteine und begründe die Namen.", "success": "Du kannst Stammketten, Positionen und funktionelle Gruppen im Namen zusammenführen und Namen in passende Strukturen übersetzen."};
moduleDefinitions.polaritaet={"title": "Elektronenverteilung und Polarität", "names": ["Startcheck", "Elektronegativität", "Partialladungen", "Bindungsdipole", "Moleküldipole", "Organische Moleküle", "Abschlusscheck"], "sections": [{"title": "Was weißt du über Elektronenverteilung?", "intro": "Prüfe drei Grundideen: Anziehung von Bindungselektronen, Partialladungen und Polarität ganzer Moleküle.", "q": [{"id": "po01", "text": "Welches Atom zieht die gemeinsamen Bindungselektronen stärker an?", "formula": "O–H", "choices": ["O", "H", "Beide gleich stark"], "answer": 0, "ok": "O besitzt die höhere Elektronegativität und zieht die Bindungselektronen stärker an.", "bad": "Eine Bindung kann ein gemeinsames Elektronenpaar besitzen, das ungleich verteilt ist.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "O hat EN 3,44; H hat EN 2,20."]}, {"id": "po02", "text": "Was bedeutet δ− an einem Atom?", "formula": "", "choices": ["Eine vollständige einfach negative Ionenladung", "Eine negative Partialladung", "Eine zusätzliche Doppelbindung"], "answer": 1, "ok": "δ− kennzeichnet eine negative Teilladung durch ungleichmäßige Elektronenverteilung.", "bad": "Das Zeichen δ bedeutet teilweise; δ− ist nicht dasselbe wie eine volle Ladung −.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Denke an eine Verschiebung der Elektronendichte."]}, {"id": "po03", "text": "Ist jedes Molekül mit polaren Bindungen ein permanenter Dipol?", "formula": "", "choices": ["Ja, unabhängig vom Molekülbau", "Nein, die räumliche Anordnung kann zur Aufhebung führen", "Nur wenn es positiv geladen ist"], "answer": 1, "ok": "Bindungsdipole können sich räumlich aufheben. Deshalb muss man auch den Molekülbau betrachten.", "bad": "Polare Bindungen allein reichen zur Beurteilung des Gesamtdipols nicht aus.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Denke an lineares CO₂ mit zwei gleichen C=O-Bindungen."]}], "explainer": "", "polarExplorer": false}, {"title": "Elektronegativität vergleichen", "intro": "Elektronegativität beschreibt, wie stark ein gebundenes Atom gemeinsame Elektronen anzieht. Vergleiche die Werte statt die Anzahl der Außenelektronen allein.", "q": [{"id": "po04", "text": "Welches Element hat in dieser Tabelle die größte Elektronegativität?", "formula": "", "choices": ["H", "C", "O", "N"], "answer": 2, "ok": "Unter diesen vier Elementen hat O mit 3,44 den höchsten Wert.", "bad": "Vergleiche die Zahlen in der Tabelle.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Suche den größten EN-Wert."]}, {"id": "po05", "text": "Wie groß ist ΔEN für C–O?", "formula": "C: 2,55   ·   O: 3,44", "choices": ["0,35", "0,89", "1,24"], "answer": 1, "ok": "3,44 − 2,55 = 0,89.", "bad": "ΔEN ist die positive Differenz, nicht die Summe der Werte.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Ziehe den kleineren Wert vom größeren ab."]}, {"id": "po06", "text": "Welche Bindung hat nach den Tabellenwerten das größte ΔEN?", "formula": "", "choices": ["C–C", "C–H", "O–H"], "answer": 2, "ok": "O–H: 1,24; C–H: 0,35; C–C: 0.", "bad": "Vergleiche jeweils die Differenz der EN-Werte.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "O und H unterscheiden sich am stärksten."]}, {"id": "po07", "text": "Welche Beschreibung der C–H-Bindung ist hier angemessen?", "formula": "C: 2,55   ·   H: 2,20", "choices": ["Stark ionisch", "Schwach polar; in vielen Schulmodellen annähernd unpolar", "So polar wie O–H"], "answer": 1, "ok": "Die EN-Differenz ist klein. C–H wird bei vielen Struktur-Eigenschafts-Erklärungen näherungsweise als unpolar behandelt.", "bad": "C und H haben ähnliche, aber nicht identische EN-Werte.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "ΔEN beträgt nur 0,35."]}], "explainer": "<details class=\"class-atlas\" open><summary>Elektronegativität nach Pauling</summary><div class=\"en-grid\"><div><strong>H</strong><span>2,20</span></div><div><strong>C</strong><span>2,55</span></div><div><strong>N</strong><span>3,04</span></div><div><strong>O</strong><span>3,44</span></div><div><strong>Cl</strong><span>3,16</span></div></div><p class=\"soft\">Die Werte sind dimensionslos. ΔEN ist die positive Differenz der beiden Werte. Größeres ΔEN deutet bei vergleichbaren Bindungen auf stärkere Polarisierung hin; feste Grenzwerte sind nur Faustregeln.</p></details><div class=\"module-goal\"><strong>Eine Eigenschaft gebundener Atome</strong>Elektronegativität beschreibt die Anziehung in einer Bindung. Sie ist keine Ionenladung und kein Maß für die Anzahl freier Elektronenpaare.</div>", "polarExplorer": false}, {"title": "Partialladungen zuordnen", "intro": "Ordne jedem Atom die passende Teilladung für die gezeigte Bindung zu. Das elektronegativere Atom erhält δ−, sein Bindungspartner δ+.", "q": [{"id": "po08", "text": "Ordne die Partialladungen im HCl-Molekül zu.", "formula": "H–Cl (Molekül)", "choices": [], "answer": ["plus", "minus"], "ok": "H trägt δ+, Cl trägt δ−. Das HCl-Molekül bleibt insgesamt elektrisch neutral.", "bad": "Cl ist elektronegativer als H. Es handelt sich hier um das Molekül, nicht um gelöste Ionen.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "EN(H) = 2,20; EN(Cl) = 3,16."], "type": "charges", "chargeLabels": ["H", "Cl"]}, {"id": "po09", "text": "Ordne die Partialladungen der O–H-Bindung zu.", "formula": "O–H", "choices": [], "answer": ["minus", "plus"], "ok": "O erhält δ−, H δ+. Die Elektronendichte ist zum O verschoben.", "bad": "Die höheren EN-Werte gehören zum elektronenreicheren Bindungspartner.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "EN(O) ist größer als EN(H)."], "type": "charges", "chargeLabels": ["O", "H"]}, {"id": "po10", "text": "Ordne die Partialladungen an der Carbonylbindung zu.", "formula": "C=O", "choices": [], "answer": ["plus", "minus"], "ok": "Das Carbonyl-C ist δ+, O ist δ−. Auch eine Doppelbindung kann polar sein.", "bad": "Zwei gemeinsame Elektronenpaare bedeuten nicht automatisch eine gleichmäßige Verteilung.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Vergleiche EN(C) = 2,55 mit EN(O) = 3,44."], "type": "charges", "chargeLabels": ["Carbonyl-C", "O"]}, {"id": "po11", "text": "Ordne die Partialladungen der N–H-Bindung zu.", "formula": "N–H", "choices": [], "answer": ["minus", "plus"], "ok": "N ist elektronegativer als H: N trägt δ−, H δ+.", "bad": "Stickstoff hat eine höhere EN als Wasserstoff.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "EN(N) = 3,04; EN(H) = 2,20."], "type": "charges", "chargeLabels": ["N", "H"]}, {"id": "po12", "text": "Verursacht diese C–C-Bindung eine Polarisierung zwischen den beiden C-Atomen?", "formula": "C–C", "choices": [], "answer": ["equal", "equal"], "ok": "Gleiche Bindungspartner haben gleiches EN: Durch diese C–C-Bindung entsteht keine Polarisierung.", "bad": "Hier wird nur der Beitrag dieser C–C-Bindung betrachtet; andere Gruppen könnten die Elektronenverteilung im ganzen Molekül verändern.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "ΔEN für C–C ist 0."], "type": "charges", "chargeLabels": ["C links", "C rechts"]}], "explainer": "<details class=\"class-atlas\" open><summary>Elektronegativität nach Pauling</summary><div class=\"en-grid\"><div><strong>H</strong><span>2,20</span></div><div><strong>C</strong><span>2,55</span></div><div><strong>N</strong><span>3,04</span></div><div><strong>O</strong><span>3,44</span></div><div><strong>Cl</strong><span>3,16</span></div></div><p class=\"soft\">Die Werte sind dimensionslos. ΔEN ist die positive Differenz der beiden Werte. Größeres ΔEN deutet bei vergleichbaren Bindungen auf stärkere Polarisierung hin; feste Grenzwerte sind nur Faustregeln.</p></details><div class=\"module-goal\"><strong>Partialladung ist keine Ionenladung</strong>H<sup>δ+</sup>–Cl<sup>δ−</sup> ist als Molekül neutral. Na⁺ und Cl⁻ sind dagegen vollständig geladene Ionen. δ gibt keine feste Zahl an und ist nicht mit einer Oxidationszahl gleichzusetzen.</div>", "polarExplorer": false}, {"title": "Bindungsdipole und Ladungen unterscheiden", "intro": "Ein chemischer Dipolpfeil zeigt hier vom positiv polarisierten zum negativ polarisierten Ende. Ein kleines Querzeichen kennzeichnet den positiven Anfang.", "q": [{"id": "po13", "text": "In welche Richtung zeigt der chemische Dipolpfeil für H–Cl?", "formula": "H–Cl", "choices": ["Von H zu Cl", "Von Cl zu H", "Es gibt keinen Bindungsdipol"], "answer": 0, "ok": "Der Pfeil zeigt von Hδ+ zu Clδ−, also zum elektronegativeren Atom.", "bad": "Hier gilt die chemische Pfeilkonvention, die auf der Merkhilfe beschrieben ist.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Cl trägt die negative Partialladung."]}, {"id": "po14", "text": "Welche Aussage zu einer polaren Elektronenpaarbindung ist richtig?", "formula": "", "choices": ["Das bindende Elektronenpaar wird vollständig übertragen", "Die gemeinsamen Bindungselektronen sind ungleich verteilt", "Es sind immer getrennte Ionen vorhanden"], "answer": 1, "ok": "Die Elektronen bleiben Teil der gemeinsamen Bindung, ihre Dichte ist jedoch ungleich verteilt.", "bad": "Eine polare Elektronenpaarbindung ist keine vollständige Elektronenübertragung.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Denke an die Verschiebung der gemeinsamen Elektronendichte."]}, {"id": "po15", "text": "Welche Schreibweise kennzeichnet eine vollständige Ionenladung?", "formula": "", "choices": ["δ−", "Cl⁻", "C=O"], "answer": 1, "ok": "Cl⁻ bezeichnet ein Chloridion mit einer vollständigen einfach negativen Ladung.", "bad": "δ− steht für eine Partialladung, = für eine Doppelbindung.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Suche ein Ladungszeichen ohne δ."]}, {"id": "po16", "text": "Wird ein neutrales Molekül durch eine polare Bindung automatisch zum Ion?", "formula": "", "choices": ["Ja, es wird negativ geladen", "Nein, die innere Ladungsverteilung kann ungleich sein und die Gesamtladung dennoch null", "Ja, es entstehen immer zwei getrennte Ionen"], "answer": 1, "ok": "Ein permanenter Dipol kann insgesamt neutral sein. Innere Ladungstrennung und Gesamtladung sind verschiedene Dinge.", "bad": "Eine Verschiebung innerhalb des Moleküls ändert nicht automatisch seine gesamte Elektronenzahl.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "HCl als Molekül ist trotz δ+ und δ− neutral."]}], "explainer": "<div class=\"module-goal\"><strong>Pfeilkonvention</strong>Hier verwenden wir den <strong>chemischen Dipolpfeil von δ+ nach δ−</strong>, mit Querzeichen am positiven Anfang. Der physikalische Vektor des elektrischen Dipolmoments wird entgegengesetzt definiert. Die Pfeile in den Modellen zeigen Richtungen, keine maßstäblichen Dipolstärken.</div>", "polarExplorer": false}, {"title": "Wann ist das ganze Molekül polar?", "intro": "Untersuche Bindungspolarität und Molekülgestalt gemeinsam. Im Modell kannst du zwischen linearem CO₂ und gewinkeltem Wasser wechseln und die Dipolpfeile einblenden.", "q": [{"id": "po17", "text": "Warum hat CO₂ trotz polarer C=O-Bindungen keinen permanenten Gesamtdipol?", "formula": "", "choices": ["Die Bindungen sind eigentlich unpolar", "Die gleich großen Bindungsdipole heben sich in der linearen Anordnung auf", "O hat dieselbe EN wie C"], "answer": 1, "ok": "CO₂ ist linear. Die beiden gleich großen, entgegengesetzten Bindungsdipole heben sich auf.", "bad": "Nicht die Bindungspolarität fehlt, sondern die resultierende Ladungstrennung des Moleküls.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Prüfe Größe und entgegengesetzte Richtung der beiden Bindungsdipole."], "polarFigure": "co2"}, {"id": "po18", "text": "Warum ist Wasser ein permanenter Dipol?", "formula": "", "choices": ["Wegen seiner gewinkelten Gestalt heben sich die O–H-Bindungsdipole nicht auf", "Jedes Molekül mit O muss polar sein", "Wasser besteht aus zwei freien H⁺-Ionen und einem O²⁻-Ion"], "answer": 0, "ok": "Polare O–H-Bindungen und die gewinkelte Gestalt ergeben einen Gesamtdipol.", "bad": "Die molekulare Gestalt entscheidet neben der Bindungspolarität.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Die beiden Pfeile zeigen nicht genau entgegengesetzt."], "polarFigure": "water"}, {"id": "po19", "text": "Wie wäre ein hypothetisches lineares H–O–H mit zwei gleichen O–H-Bindungen zu beurteilen?", "formula": "", "choices": ["Die Bindungen wären unpolar", "Die Bindungsdipole würden sich in diesem vereinfachten Modell aufheben", "Die Gesamtladung wäre −2"], "answer": 1, "ok": "Im hypothetischen linearen Modell wären die Bindungsdipole entgegengesetzt. Tatsächliches Wasser ist gewinkelt.", "bad": "Die Frage verändert die Gestalt, nicht die EN-Werte.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Zwei gleich große entgegengesetzte Beiträge ergeben null."]}, {"id": "po20", "text": "Welche Aussage zu Methan stimmt?", "formula": "CH₄ (tetraedrisch)", "choices": ["Methan hat einen permanenten Gesamtdipol", "Die gleichartigen C–H-Beiträge heben sich aufgrund der tetraedrischen Symmetrie auf", "Methan ist ein negativ geladenes Ion"], "answer": 1, "ok": "Methan besitzt keinen permanenten Dipol. Das gilt auch, wenn man die schwache C–H-Polarität berücksichtigt.", "bad": "Betrachte das räumliche tetraedrische Molekül, nicht nur eine flache Strukturformel.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Vier gleiche Bindungen sind symmetrisch im Raum angeordnet."]}, {"id": "po21", "text": "NH₃ ist trigonal-pyramidal und besitzt polare N–H-Bindungen. Welche Aussage passt?", "formula": "NH₃", "choices": ["Die räumliche Anordnung führt zu einem permanenten Gesamtdipol", "Drei N–H-Bindungen müssen sich immer aufheben", "NH₃ ist allein wegen δ− am N ein Ion"], "answer": 0, "ok": "Im trigonal-pyramidalen Ammoniak heben sich die Beiträge nicht auf; das Molekül besitzt einen Gesamtdipol.", "bad": "Drei Bindungen bedeuten nicht automatisch eine symmetrische Aufhebung.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Prüfe die pyramidal räumliche Form."]}], "explainer": "<div class=\"module-goal\"><strong>Zwei Prüfschritte</strong>1. Sind Bindungen polar? 2. Heben sich ihre Beiträge in der tatsächlichen Molekülgestalt auf? Ein Molekül ist ein permanenter Dipol, wenn eine resultierende Ladungstrennung bleibt.</div>", "polarExplorer": true}, {"title": "Polarität in organischen Molekülen", "intro": "Übertrage die Grundlagen auf Alkohole, Carbonylverbindungen und Halogenalkane. Unterscheide lokale Polarität, Gesamtdipol und die Größe unpolarer Bereiche.", "q": [{"id": "po22", "text": "Ordne die Partialladungen in der C–Cl-Bindung zu.", "formula": "CH₃–Cl: betrachtet wird C–Cl", "choices": [], "answer": ["plus", "minus"], "ok": "Cl ist elektronegativer: Cδ+–Clδ−.", "bad": "Vergleiche C und Cl anhand der Tabelle.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "EN(Cl) = 3,16; EN(C) = 2,55."], "type": "charges", "chargeLabels": ["C", "Cl"]}, {"id": "po23", "text": "Welche Bereiche von Ethanol sind besonders polar?", "formula": "CH₃–CH₂–OH", "choices": ["C–O und O–H im Bereich der Hydroxygruppe", "Nur die C–C-Bindung", "Alle Bindungen gleich stark"], "answer": 0, "ok": "C–O und O–H sind deutlich polar; der Kohlenwasserstoffrest ist vergleichsweise unpolar.", "bad": "Prüfe die EN-Differenzen für die einzelnen Bindungen.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "O hat eine deutlich höhere EN als C und H."]}, {"id": "po24", "text": "Welches Atom der Carbonylgruppe ist das elektronenärmere Zentrum?", "formula": "CH₃–C(=O)–CH₃", "choices": ["O", "Das Carbonyl-C", "Beide sind gleich elektronenreich"], "answer": 1, "ok": "O zieht Elektronendichte an; dadurch ist das Carbonyl-C δ+ und elektronenärmer.", "bad": "Die positive Partialladung liegt am weniger elektronegativen Bindungspartner.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "C trägt in der C=O-Bindung δ+."]}, {"id": "po25", "text": "Wie verändert sich beim Vergleich dieser Alkohole der Anteil des Kohlenwasserstoffbereichs?", "formula": "CH₃–OH   und   CH₃–(CH₂)₅–OH", "choices": ["Beim längeren Alkohol ist der vergleichsweise unpolare Rest größer", "Die OH-Gruppe wird allein durch die längere Kette unpolar", "Der längere Alkohol besitzt keine polaren Bindungen mehr"], "answer": 0, "ok": "Die polare OH-Gruppe bleibt vorhanden; der Anteil des vergleichsweise unpolaren Restes nimmt zu.", "bad": "Kettenlänge und lokale Bindungspolarität sind unterschiedliche Gesichtspunkte.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Zähle die C-Atome, ohne die OH-Gruppe zu verändern."]}, {"id": "po26", "text": "Welche Aussage zu Löslichkeit ist fachlich sinnvoll?", "formula": "", "choices": ["Ein Molekül mit einer polaren Bindung ist immer vollständig wasserlöslich", "Wasserlöslichkeit hängt auch von Größe, Struktur und möglichen Wechselwirkungen ab", "Polarität spielt bei Löslichkeit nie eine Rolle"], "answer": 1, "ok": "Polarität liefert Hinweise. Für Löslichkeit müssen zusätzlich Molekülgröße und Wechselwirkungen betrachtet werden.", "bad": "Eine einzelne polare Bindung ist keine Garantie für vollständige Mischbarkeit mit Wasser.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Denke an den wachsenden Kohlenwasserstoffrest bei Alkoholen."]}], "explainer": "<details class=\"class-atlas\" open><summary>Elektronegativität nach Pauling</summary><div class=\"en-grid\"><div><strong>H</strong><span>2,20</span></div><div><strong>C</strong><span>2,55</span></div><div><strong>N</strong><span>3,04</span></div><div><strong>O</strong><span>3,44</span></div><div><strong>Cl</strong><span>3,16</span></div></div><p class=\"soft\">Die Werte sind dimensionslos. ΔEN ist die positive Differenz der beiden Werte. Größeres ΔEN deutet bei vergleichbaren Bindungen auf stärkere Polarisierung hin; feste Grenzwerte sind nur Faustregeln.</p></details><div class=\"module-goal\"><strong>Brücke zur Reihe</strong>Eine funktionelle Gruppe beeinflusst die Elektronenverteilung lokal. Das hilft später dabei, Eigenschaften und reaktive Stellen in organischen Molekülen zu erklären.</div>", "polarExplorer": false}, {"title": "Kannst du Polarität begründet beurteilen?", "intro": "Fünf neue Aufgaben. Ordne Partialladungen zu und beurteile Moleküle unter Berücksichtigung ihrer Gestalt.", "q": [{"id": "po27", "text": "Ordne die Partialladungen der C–O-Bindung zu.", "formula": "C–O", "choices": [], "answer": ["plus", "minus"], "ok": "C trägt δ+, O δ−, weil O elektronegativer ist.", "bad": "Die Richtung ergibt sich aus der höheren EN von O.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "EN(C) = 2,55; EN(O) = 3,44."], "topic": 2, "type": "charges", "chargeLabels": ["C", "O"]}, {"id": "po28", "text": "Welche Aussage unterscheidet Bindungspolarität und Molekülpolarität richtig?", "formula": "", "choices": ["Polare Bindungen garantieren immer einen Gesamtdipol", "Für den Gesamtdipol muss auch die räumliche Aufhebung der Beiträge geprüft werden", "Ein Moleküldipol ist immer ein Ion"], "answer": 1, "ok": "Die räumliche Anordnung der polaren Bindungen entscheidet mit über den Gesamtdipol.", "bad": "Beide Betrachtungsebenen sind nötig: Bindungen und ganzes Molekül.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Vergleiche CO₂ mit Wasser."], "topic": 4}, {"id": "po29", "text": "Ein Molekül hat zwei gleiche polare Bindungen, die exakt entgegengesetzt angeordnet sind. Was folgt im vereinfachten Bindungsdipolmodell?", "formula": "", "choices": ["Die Beiträge addieren sich zu einem doppelt so großen Gesamtdipol", "Die Beiträge heben sich auf", "Die Bindungen verlieren ihre Polarität"], "answer": 1, "ok": "Die gleich großen entgegengesetzten Beiträge heben sich auf. Die einzelnen Bindungen bleiben polar.", "bad": "Die Aufhebung betrifft den Gesamtdipol und ändert nicht die EN-Differenzen.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Denke an die Addition zweier entgegengesetzter Pfeile."], "topic": 4}, {"id": "po30", "text": "Welche Beschreibung von δ+ ist richtig?", "formula": "", "choices": ["Eine positive Partialladung durch relativ geringere Elektronendichte", "Immer die vollständige Ladung +1", "Die Anzahl freier Elektronenpaare"], "answer": 0, "ok": "δ+ beschreibt eine positive Teilladung, keine feste Ionenladung +1.", "bad": "Eine Partialladung ist keine vollständige ganzzahlige Ladung.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "δ bedeutet teilweise."], "topic": 3}, {"id": "po31", "text": "Was bleibt bei einem langkettigen Alkohol richtig?", "formula": "CH₃–(CH₂)₇–OH", "choices": ["Er besitzt wegen der langen Kette keine polare Gruppe", "Die OH-Gruppe bleibt polar; zugleich ist der vergleichsweise unpolare Rest groß", "Alle C–C-Bindungen werden stark polar"], "answer": 1, "ok": "Lokale Polarität und die Größe des Kohlenwasserstoffrestes müssen getrennt betrachtet werden.", "bad": "Die OH-Gruppe wird nicht allein wegen der Kettenlänge unpolar.", "hints": ["Vergleiche zuerst die Elektronegativitäten. Prüfe bei ganzen Molekülen zusätzlich die räumliche Anordnung.", "Suche weiterhin nach C–O und O–H."], "topic": 5}], "explainer": "<details class=\"class-atlas\"><summary>Fachliche Grundlage</summary><p>EN-Werte: <a href=\"https://pubchem.ncbi.nlm.nih.gov/periodic-table/electronegativity\" target=\"_blank\" rel=\"noopener\">PubChem – Pauling-Elektronegativität</a>. Die Modelle stellen Richtungen und symmetrische Aufhebung vereinfacht dar; sie sind keine maßstäblichen Elektronendichtebilder.</p></details>", "polarExplorer": false}], "goal": "Ich kann Bindungen mithilfe der Elektronegativität beurteilen, Partialladungen zuordnen und Bindungspolarität von Molekülpolarität unterscheiden.", "tagline": "EN vergleichen · Partialladungen zuordnen · Moleküldipole erklären", "transfer": "Markiere in Ethanol und Propanon die polaren Bindungen und ihre Partialladungen. Erkläre danach, warum CO₂ trotz polarer Bindungen keinen permanenten Gesamtdipol besitzt.", "success": "Du kannst Partialladungen und Bindungsdipole erklären, ihre räumliche Aufhebung prüfen und die Grundlagen auf organische Moleküle übertragen."};
moduleDefinitions.stoffteilchen={"title": "Stoff- und Teilchenebene", "names": ["Startcheck", "Drei Ebenen", "Beobachten & Deuten", "Teilchenmodelle", "Zustandsänderungen", "Chemische Reaktionen", "Abschlusscheck"], "sections": [{"title": "Beobachtung oder Teilchenerklärung?", "intro": "Starte mit drei Grundfragen. Im weiteren Lernweg verbinden wir Beobachtungen, Modelle und Formeln, ohne die Ebenen zu vermischen.", "q": [{"id": "st01", "text": "Welche Aussage beschreibt eine Beobachtung auf der Stoffebene?", "formula": "", "choices": ["Nach dem Schütteln sind zwei Flüssigkeitsschichten sichtbar", "Die Moleküle ziehen sich unterschiedlich stark an", "Die Bindungselektronen sind ungleich verteilt"], "answer": 0, "ok": "Zwei sichtbare Flüssigkeitsschichten sind eine Beobachtung am Stoffsystem.", "bad": "Moleküle und Bindungselektronen werden hier als Modell zur Erklärung herangezogen.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Was wäre im Gefäß direkt zu sehen?"]}, {"id": "st02", "text": "Welche Aussage gehört zur Teilchenebene?", "formula": "", "choices": ["Die Flüssigkeit ist farblos", "Zwischen den Molekülen wirken Anziehungskräfte", "Die Temperatur beträgt 25 °C"], "answer": 1, "ok": "Anziehung zwischen Molekülen ist eine Erklärung auf der Teilchenebene.", "bad": "Farbe und gemessene Temperatur beschreiben die Stoffprobe.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Suche eine Aussage über Moleküle."]}, {"id": "st03", "text": "Was verändert sich beim Verdampfen von reinem Ethanol hauptsächlich?", "formula": "", "choices": ["Die Ethanolmoleküle werden zu neuen Stoffen", "Die Abstände und Anordnung der Moleküle ändern sich; ihre chemische Identität bleibt erhalten", "Die C-Atome verschwinden"], "answer": 1, "ok": "Beim Verdampfen bleiben Ethanolmoleküle erhalten. Ihre mittleren Abstände und ihre Anordnung verändern sich.", "bad": "Verdampfen ist eine physikalische Zustandsänderung, keine Zerlegung der Moleküle.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Unterscheide Stoffzustand und Molekülaufbau."]}], "explainer": "", "particleExplorer": false}, {"title": "Drei Ebenen auseinanderhalten", "intro": "Die Stoffebene beschreibt Stoffproben und beobachtbare Vorgänge. Die Teilchenebene erklärt mithilfe von Atomen, Molekülen, Ionen und Wechselwirkungen. Die Symbolebene stellt chemische Sachverhalte durch Formeln und Gleichungen dar.", "q": [{"id": "st04", "text": "Ordne die drei Aussagen ihrer Ebene zu.", "formula": "", "choices": [], "answer": [0, 1, 2], "ok": "Sieden: Stoffebene. Moleküle und Abstände: Teilchenebene. Summenformel: Symbolebene.", "bad": "Die Formel ist eine Darstellung, kein direkt sichtbares Molekül.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Trenne Beobachtung, Modell und Schreibweise."], "type": "match", "matchLabels": ["Eine Flüssigkeit siedet.", "Die Moleküle bewegen sich und haben im Gas größere mittlere Abstände.", "Die Verbindung wird als C₂H₆O dargestellt."], "matchChoices": ["Stoffebene", "Teilchenebene", "Symbolebene"]}, {"id": "st05", "text": "Welche Aussage ist sprachlich problematisch?", "formula": "", "choices": ["Die Ethanolprobe ist bei Raumtemperatur flüssig", "Ein einzelnes Ethanolmolekül ist flüssig", "Die Ethanolprobe besteht aus Molekülen"], "answer": 1, "ok": "Der Aggregatzustand beschreibt einen Stoff bzw. ein Teilchenensemble; er wird nicht einem einzelnen Molekül als Stoffeigenschaft zugeschrieben.", "bad": "Ein Molekül besitzt einen Aufbau. Flüssigsein beschreibt das Zusammenwirken vieler Teilchen.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Übertrage eine Eigenschaft der Stoffprobe nicht automatisch auf ein einzelnes Molekül."]}, {"id": "st06", "text": "Eine Strukturformel wird an der Tafel gezeichnet. Was ist sie?", "formula": "CH₃–CH₂–OH", "choices": ["Das reale Molekül in Originalgröße", "Eine symbolische Darstellung der Verknüpfung von Atomen", "Eine Beobachtung der Flüssigkeitsfarbe"], "answer": 1, "ok": "Eine Strukturformel stellt den Molekülaufbau symbolisch dar. Sie verweist auf die Teilchenebene.", "bad": "Die Zeichnung ist keine direkte Aufnahme des Moleküls.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Unterscheide Modellgegenstand und Darstellung."]}, {"id": "st07", "text": "Welche Verbindung zwischen den Ebenen ist sinnvoll?", "formula": "", "choices": ["Eine Beobachtung wird durch ein passendes Teilchenmodell erklärt", "Jede Teilchenerklärung lässt sich mit bloßem Auge sehen", "Formeln ersetzen immer jede Beobachtung"], "answer": 0, "ok": "Die Teilchenebene hilft, Beobachtungen auf der Stoffebene zu erklären. Formeln unterstützen die Darstellung.", "bad": "Eine Erklärung auf Teilchenebene ist keine unmittelbare makroskopische Beobachtung.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Modelle und Beobachtungen ergänzen sich."]}], "explainer": "<div class=\"class-grid\"><div><strong>Stoffebene</strong><span>sehen, messen, beschreiben</span><code>z. B. Phasengrenze oder Temperatur</code></div><div><strong>Teilchenebene</strong><span>mit Teilchen und Wechselwirkungen erklären</span><code>z. B. Moleküle und ihre Anordnung</code></div><div><strong>Symbolebene</strong><span>mit Formeln und Gleichungen darstellen</span><code>z. B. CH₃–CH₂–OH</code></div></div>", "particleExplorer": false}, {"title": "Beobachtung und Deutung trennen", "intro": "Formuliere zuerst, was wahrnehmbar oder messbar ist. Erkläre danach mithilfe eines Modells. Eine Deutung muss zur Beobachtung passen und begründet sein.", "q": [{"id": "st08", "text": "Ordne zu: Beobachtung oder Deutung?", "formula": "", "choices": [], "answer": [0, 1, 0], "ok": "Sichtbare Klarheit und Flüssigkeitsschichten sind Beobachtungen; Wechselwirkungen zwischen Molekülen sind eine Deutung.", "bad": "Aussagen über Moleküle gehen über das unmittelbar Sichtbare hinaus.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Frage: Was kann ich sehen, was erkläre ich?"], "type": "match", "matchLabels": ["Nach dem Schütteln ist eine klare Flüssigkeit ohne sichtbare Phasengrenze zu sehen.", "Wasser- und Ethanolmoleküle können günstige Wechselwirkungen miteinander ausbilden.", "Nach einiger Zeit sind eine obere und eine untere Flüssigkeitsschicht erkennbar."], "matchChoices": ["Beobachtung", "Deutung"]}, {"id": "st09", "text": "Welche Formulierung beschreibt eine Beobachtung besonders genau?", "formula": "", "choices": ["Die Stoffe mögen sich nicht", "Öl und Wasser bilden nach dem Stehen zwei sichtbare Flüssigkeitsschichten", "Die Moleküle sind unfreundlich"], "answer": 1, "ok": "Die sichtbare Schichtung ist konkret beschrieben. Vermenschlichung erklärt den Vorgang nicht.", "bad": "Verwende beobachtbare Merkmale statt menschlicher Absichten.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Beschreibe die Phasengrenze."]}, {"id": "st10", "text": "In einer Flüssigkeit steigen Gasblasen auf. Was darf daraus allein sicher geschlossen werden?", "formula": "", "choices": ["Es muss eine chemische Reaktion stattfinden", "Es tritt eine Gasphase auf; ihre Entstehung muss weiter untersucht werden", "Es entsteht immer Kohlenstoffdioxid"], "answer": 1, "ok": "Gasblasen können z. B. durch Sieden, Entgasen oder eine Reaktion entstehen. Die Beobachtung allein identifiziert den Vorgang nicht.", "bad": "Ein sichtbares Phänomen kann verschiedene Ursachen haben.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Denke an Gasblasen beim Sieden."]}, {"id": "st11", "text": "Welche Kombination aus Beobachtung und Deutung passt zum Verdampfen?", "formula": "", "choices": ["Beobachtung: Die Flüssigkeitsmenge nimmt ab. Deutung: Moleküle gehen in die Gasphase über.", "Beobachtung: C–O-Bindungen brechen. Deutung: Die Flüssigkeit ist farblos.", "Beobachtung: Moleküle verschwinden. Deutung: Masse wird vernichtet."], "answer": 0, "ok": "Eine abnehmende Flüssigkeitsmenge kann durch den Übergang von Molekülen in die Gasphase erklärt werden.", "bad": "Der Molekülaufbau bleibt beim Verdampfen erhalten. In einem offenen Gefäß kann Stoff in die Umgebung gelangen.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Unterscheide sichtbare Flüssigkeitsmenge und Übergang der Moleküle."]}], "explainer": "<div class=\"module-goal\"><strong>Eine hilfreiche Satzstruktur</strong><strong>Ich beobachte …</strong> (Stoffebene). <strong>Ich erkläre dies damit, dass …</strong> (Teilchenebene). Aussagen über eine Ursache gehören zur Deutung.</div>", "particleExplorer": false}, {"title": "Teilchenmodelle lesen", "intro": "Ein Teilchenbild vereinfacht. Symbole, Farben, Abstände und Verbindungen müssen mithilfe einer Legende gedeutet werden.", "q": [{"id": "st12", "text": "Was stellt jedes Zeichen E in diesem Modell dar?", "formula": "", "choices": ["Ein einzelnes C-Atom", "Ein vollständiges Ethanolmolekül", "Einen Tropfen mit vielen Molekülen"], "answer": 1, "ok": "Nach der Legende steht jedes E für ein vollständiges Ethanolmolekül.", "bad": "Die Bedeutung eines Symbols ergibt sich aus der Modelllegende.", "hints": ["Prüfe: Wird etwas Beobachtbares beschrieben, ein Teilchenmodell verwendet oder eine Formel dargestellt?", "Ein Zeichen E bedeutet hier ein Molekül."], "particleFigure": "liquid"}, {"id": "st13", "text": "Welche Information lässt sich aus den dargestellten größeren Abständen able
